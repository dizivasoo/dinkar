<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> wave optics </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"Which of the following phenomena proves the transverse nature of light waves?",o:["Polarisation","Interference","Diffraction","Refraction"],a:0},
  {q:"The wavefront due to a point source at a very large distance is",o:["Plane","Spherical","Cylindrical","Circular"],a:0},
  {q:"Two coherent sources of light have a intensity ratio of 81:1. The ratio of their amplitudes is",o:["9:1","81:1","3:1","27:1"],a:0},
  {q:"In Young's Double Slit Experiment, if the distance between the slits is halved, the fringe width becomes",o:["Double","Half","Four times","Unchanged"],a:0},
  {q:"The idea of secondary wavelets was first given by",o:["Huygens","Newton","Maxwell","Fresnel"],a:0},
  {q:"Colors in thin films are due to the phenomenon of",o:["Interference","Scattering","Dispersion","Absorption"],a:0},
  {q:"The phase difference between two points on the same wavefront is",o:["0","π/2","π","2π"],a:0},
  {q:"Light propagates in a rectilinear path because of its",o:["Small wavelength","Large wavelength","Frequency","Transverse nature"],a:0},
  {q:"In the context of Doppler effect in light, 'Red Shift' signifies",o:["Increase in wavelength","Decrease in wavelength","Increase in frequency","No change in speed"],a:0},
  {q:"A Brewster's angle $i_p$ for a glass slab of refractive index $\mu$ is given by",o:["$\tan i_p = \mu$","$\sin i_p = \mu$","$\cos i_p = \mu$","$\cot i_p = \mu$"],a:0},
  {q:"The locus of all particles vibrating in the same phase is called",o:["Wavefront","Wavelength","Frequency","Ray"],a:0},
  {q:"If a thin transparent sheet is placed in front of one of the slits in YDSE, the fringe width",o:["Remains same","Increases","Decreases","Disappears"],a:0},
  {q:"Diffraction is most pronounced when the size of the obstacle is",o:["Infinite","Comparable to wavelength","Much larger than wavelength","Zero"],a:1},
  {q:"Two sources are said to be coherent if they produce waves of",o:["Constant phase difference","Different frequencies","Variable speed","Different amplitudes"],a:1},
  {q:"The resolving power of a telescope can be increased by",o:["Decreasing wavelength","Increasing wavelength","Decreasing aperture","Increasing focal length"],a:1},
  {q:"When a wave undergoes reflection at a denser medium, the phase change is",o:["0","π","π/2","2π"],a:1},
  {q:"Polaroid glass is used in sunglasses because it",o:["Reduces intensity to half","Reduces glare via polarisation","Is cheaper than glass","Blocks UV rays only"],a:1},
  {q:"Central fringe in interference pattern is usually",o:["Dark","Bright","Colored","Invisible"],a:2},
  {q:"The path difference for constructive interference is ($n$ is an integer)",o:["$(2n+1)\lambda/2$","$n\lambda/2$","$n\lambda$","$(n+1)\lambda$"],a:2},
  {q:"Unpolarised light can be converted into partially or fully polarised light by",o:["Reflection","Scattering","Both A and B","None of these"],a:2},
  {q:"Malus Law is given by the expression",o:["$I = I_0 \sin^2 \theta$","$I = I_0 \tan \theta$","$I = I_0 \cos^2 \theta$","$I = I_0 / 2$"],a:2},
  {q:"In Fresnel's biprism experiment, the coherent sources are obtained by",o:["Division of amplitude","Division of frequency","Division of wavefront","Reflection only"],a:2},
  {q:"The ratio of maximum to minimum intensity in interference is ($a_1, a_2$ are amplitudes)",o:["$(a_1+a_2)/(a_1-a_2)$","$(a_1^2+a_2^2)/(a_1^2-a_2^2)$","$(a_1+a_2)^2/(a_1-a_2)^2$","$(a_1-a_2)^2/(a_1+a_2)^2$"],a:2},
  {q:"The wavefront originating from a slit is",o:["Spherical","Plane","Cylindrical","Elliptical"],a:2},
  {q:"Huygens principle is used to explain",o:["Photoelectric effect","Origin of spectra","Polarisation","Propagation of wavefronts"],a:3},
  {q:"Which of the following does not show interference?",o:["Soap bubble","Oil film on water","Wedge shaped glass","Independent light bulbs"],a:3},
  {q:"Fringe width ($\beta$) in YDSE is given by",o:["$dD/\lambda$","$d\lambda/D$","$D/\lambda d$","$\lambda D/d$"],a:3},
  {q:"The direction of vibration of the electric field vector in a polarised light wave is",o:["Random","In all directions","Circular","In one fixed direction"],a:3},
  {q:"The central point in a Newton's ring pattern seen by reflection is",o:["Bright","Colored","Diffused","Dark"],a:3},
  {q:"The limit of resolution of a microscope is proportional to",o:["$\mu \sin \theta$","$1/\lambda$","Aperture","$\lambda$"],a:3},
  {q:"Airy's disc is related to",o:["Interference","Polarisation","Refraction","Diffraction"],a:3},
  {q:"If white light is used in YDSE, the central fringe is",o:["Red","Blue","Black","White"],a:3},
  {q:"To observe diffraction, the size of the slit should be of the order of",o:["1 cm","1 m","10 cm","Wavelength of light"],a:3},
  {q:"The energy in an interference pattern is",o:["Created at maxima","Destroyed at minima","Lost as heat","Redistributed"],a:3},
  {q:"A wave is reflected from a rarer medium. The phase change is",o:["π","π/2","2π","Zero"],a:3}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_10")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>


<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
