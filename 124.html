<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Semiconductors</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  { q: "The energy gap is maximum in which of the following?", o: ["Superconductors", "Metals", "Insulators", "Semiconductors"], a: 2 },
  { q: "In an n-type semiconductor, the majority charge carriers are:", o: ["Holes", "Electrons", "Protons", "Neutrons"], a: 1 },
  { q: "The forbidden energy gap in Germanium is approximately:", o: ["1.1 eV", "0.72 eV", "0.3 eV", "5 eV"], a: 1 },
  { q: "Which of the following is a universal gate?", o: ["AND", "OR", "NAND", "NOT"], a: 2 },
  { q: "At absolute zero temperature, an intrinsic semiconductor acts as a:", o: ["Superconductor", "Perfect insulator", "Good conductor", "Variable resistor"], a: 1 },
  { q: "The addition of pentavalent impurity to a semiconductor creates:", o: ["Free electrons", "Holes", "Valence electrons", "Bound electrons"], a: 0 },
  { q: "A p-type semiconductor is:", o: ["Positively charged", "Negatively charged", "Uncharged (Neutral)", "None of these"], a: 2 },
  { q: "In a forward-biased p-n junction, the depletion layer:", o: ["Increases", "Decreases", "Remains same", "Becomes zero"], a: 1 },
  { q: "The process of adding impurities to a pure semiconductor is called:", o: ["Ionization", "Diffusing", "Doping", "Mixing"], a: 2 },
  { q: "The conductivity of a semiconductor increases with:", o: ["Decrease in temp", "Increase in temp", "Constant temp", "None"], a: 1 },
  { q: "Which diode is used for voltage regulation?", o: ["LED", "Varactor diode", "Zener diode", "Photo diode"], a: 2 },
  { q: "The majority carriers in p-type semiconductors are:", o: ["Electrons", "Holes", "Ions", "Photons"], a: 1 },
  { q: "When a p-n junction is reverse biased, the current is due to:", o: ["Majority carriers", "Minority carriers", "Both", "Diffusion"], a: 1 },
  { q: "The output of an OR gate is Low (0) only when:", o: ["Both inputs are High", "One input is High", "Both inputs are Low", "Any input is Low"], a: 2 },
  { q: "The energy gap in Silicon is:", o: ["0.7 eV", "1.1 eV", "1.5 eV", "2.0 eV"], a: 1 },
  { q: "A transistor acts as a switch in which region?", o: ["Active region", "Saturation region", "Cut-off and Saturation", "Linear region"], a: 2 },
  { q: "The current gain (beta) of a transistor is the ratio of:", o: ["IC / IB", "IC / IE", "IB / IC", "IE / IC"], a: 0 },
  { q: "Logic gate which provides high output for low input is:", o: ["AND", "OR", "NOT", "EX-OR"], a: 2 },
  { q: "In a p-n junction, the barrier potential depends on:", o: ["Temperature", "Doping density", "Semiconductor material", "All of the above"], a: 3 },
  { q: "Which of the following is a trivalent impurity?", o: ["Phosphorus", "Antimony", "Indium", "Arsenic"], a: 2 },
  { q: "LEDs are made from:", o: ["Silicon", "Germanium", "Gallium Arsenide", "Carbon"], a: 2 },
  { q: "The ripple factor of a full wave rectifier is:", o: ["1.21", "0.48", "0.81", "0.50"], a: 1 },
  { q: "A hole in a semiconductor is defined as:", o: ["A free electron", "An incomplete bond", "A proton", "A free neutron"], a: 1 },
  { q: "Full wave rectifier uses how many diodes?", o: ["One", "Two", "Three", "None"], a: 1 },
  { q: "Rectification is the process of converting:", o: ["DC to AC", "Low V to High V", "AC to DC", "High V to Low V"], a: 2 },
  { q: "For a transistor, the relation between alpha and beta is:", o: ["beta = alpha/(1-alpha)", "alpha = beta/(1-beta)", "beta = alpha/(1+alpha)", "alpha = beta+1"], a: 0 },
  { q: "The decimal equivalent of binary 1011 is:", o: ["9", "10", "11", "12"], a: 2 },
  { q: "The width of depletion layer is of the order of:", o: ["10^-3 m", "10^-6 m", "10^-9 m", "10^-12 m"], a: 1 },
  { q: "A solar cell works on the principle of:", o: ["Thermionic emission", "Photoelectric effect", "Photovoltaic effect", "Field emission"], a: 2 },
  { q: "The boiling point of liquid Nitrogen used in cooling is:", o: ["77 K", "-196 K", "Both A and B", "273 K"], a: 2 },
  { q: "In Common Emitter configuration, the phase difference is:", o: ["0 degrees", "90 degrees", "180 degrees", "270 degrees"], a: 2 },
  { q: "Boolean expression for AND gate is:", o: ["Y = A + B", "Y = A . B", "Y = A'", "Y = (A.B)'"], a: 1 },
  { q: "Which of the following is an elemental semiconductor?", o: ["CdS", "GaAs", "Si", "InP"], a: 2 },
  { q: "Identify the donor impurity:", o: ["Boron", "Aluminium", "Phosphorus", "Gallium"], a: 2 },
  { q: "The knee voltage for Silicon is:", o: ["0.3 V", "0.7 V", "1.1 V", "0.1 V"], a: 1 }
];
let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_14")

  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
