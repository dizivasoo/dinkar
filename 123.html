<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> atoms </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "The radius of a nucleus with mass number A is proportional to", o: ["A^(1/3)", "A", "A^2", "A^(1/2)"], a: 0},
  {q: "In the fusion of two light nuclei, the total mass of the products is", o: ["More than the sum of masses of reactants", "Equal to the sum of masses of reactants", "Less than the sum of masses of reactants", "Twice the mass of reactants"], a: 2},
  {q: "The mass defect per nucleon is a measure of", o: ["Size of nucleus", "Binding energy per nucleon", "Atomic number", "Number of neutrons"], a: 1},
  {q: "Two nuclei have their mass numbers in the ratio 1:8. The ratio of their nuclear radii is", o: ["1:8", "1:2", "1:4", "2:1"], a: 1},
  {q: "The energy equivalent of 1 amu is nearly", o: ["931.5 MeV", "93.15 MeV", "1.6 x 10^-19 J", "0.511 MeV"], a: 0},
  {q: "Which of the following is used as a moderator in a nuclear reactor?", o: ["Uranium", "Cadmium", "Boron", "Heavy Water"], a: 3},
  {q: "In an alpha decay, the atomic number of the parent nucleus", o: ["Decreases by 2", "Increases by 2", "Decreases by 4", "Remains same"], a: 0},
  {q: "Nuclear forces are", o: ["Charge dependent", "Long range", "Strongly attractive and short range", "Gravitational in nature"], a: 2},
  {q: "The stability of a nucleus is decided by its", o: ["Binding energy per nucleon", "Total binding energy", "Number of protons", "Number of electrons"], a: 0},
  {q: "The density of nuclear matter is", o: ["Dependent on A", "Independent of A", "Proportional to A", "Inversely proportional to A"], a: 1},
  {q: "During a beta-minus (β-) decay, the neutron to proton ratio", o: ["Increases", "Remains same", "Decreases", "Becomes zero"], a: 2},
  {q: "The force between two neutrons is", o: ["Repulsive", "Strongly attractive", "Zero", "Only gravitational"], a: 1},
  {q: "A radioactive element has a half-life of 5 days. After 20 days, the fraction remaining is", o: ["1/4", "1/8", "1/10", "1/16"], a: 3},
  {q: "The mass number of a nucleus is", o: ["Always less than atomic number", "Always more than atomic number", "Number of nucleons in the nucleus", "Total number of protons"], a: 2},
  {q: "For a stable nucleus, the number of neutrons (N) related to atomic number (Z) for heavy nuclei is", o: ["N < Z", "N = Z", "N > Z", "N = 0"], a: 2},
  {q: "The unit of radioactivity 'Curie' is equal to", o: ["3.7 x 10^10 disintegrations/sec", "1 disintegration/sec", "10^6 disintegrations/sec", "3.7 x 10^7 disintegrations/sec"], a: 0},
  {q: "Which particle is emitted when a neutron is converted into a proton inside a nucleus?", o: ["Positron", "Alpha particle", "Gamma ray", "Electron"], a: 3},
  {q: "The binding energy per nucleon is maximum for the nucleus", o: ["U-238", "Fe-56", "O-16", "He-4"], a: 1},
  {q: "Nuclear fission is the process in which", o: ["A heavy nucleus splits into two lighter nuclei", "Two light nuclei combine", "A nucleus emits an alpha particle", "Electrons are ejected from the shell"], a: 0},
  {q: "The source of energy in the sun is", o: ["Nuclear fission", "Chemical reaction", "Nuclear fusion", "Radioactive decay"], a: 2},
  {q: "Control rods in a nuclear reactor are made of", o: ["Graphite", "Cadmium", "Sodium", "Plutonium"], a: 1},
  {q: "Isotopes have the same", o: ["Mass number", "Chemical properties", "Number of neutrons", "Binding energy"], a: 0},
  {q: "Isobars are atoms having the same", o: ["Number of protons", "Number of neutrons", "Atomic number", "Mass number"], a: 3},
  {q: "The radius of a nucleus is of the order of", o: ["10^-15 m", "10^-10 m", "10^-8 m", "10^-12 m"], a: 0},
  {q: "One gram of a substance is converted into energy. The energy released is", o: ["9 x 10^13 J", "3 x 10^8 J", "1 J", "9 x 10^10 J"], a: 0},
  {q: "The mean life (τ) of a radioactive substance is related to half-life (T) as", o: ["τ = 1.44 T", "τ = T", "τ = 0.693 T", "τ = T^2"], a: 0},
  {q: "Which of the following has zero rest mass?", o: ["Neutron", "Electron", "Alpha particle", "Photon (Gamma ray)"], a: 3},
  {q: "If the binding energy per nucleon increases, the nucleus becomes", o: ["Less stable", "More stable", "Radioactive", "Lighter"], a: 1},
  {q: "Which of the following rays is not deflected by a magnetic field?", o: ["Alpha rays", "Beta rays", "Gamma rays", "Positrons"], a: 2},
  {q: "In an endothermic nuclear reaction, the Q-value is", o: ["Positive", "Zero", "Negative", "Infinite"], a: 2},
  {q: "The particle used to trigger fission in U-235 is", o: ["Proton", "Alpha particle", "Fast neutron", "Slow neutron"], a: 3},
  {q: "Nuclear fusion requires high temperature because", o: ["It is an exothermic process", "Nuclei must overcome electrostatic repulsion", "Binding energy is low", "Moderators are not used"], a: 1},
  {q: "Which of the following are called nucleons?", o: ["Electrons and protons", "Electrons and neutrons", "Photons and neutrons", "Protons and neutrons"], a: 3},
  {q: "In a nuclear reactor, the coolant is used to", o: ["Slow down neutrons", "Control the chain reaction", "Absorb neutrons", "Transfer heat from reactor core"], a: 3},
  {q: "The most stable nuclei are found in the mass number range of", o: ["1 to 20", "200 to 240", "120 to 180", "40 to 120"], a: 3}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_13")

  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
