<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> surface chemistry </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35 </div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  { q: "Which of the following is an example of absorption?", o: ["Water on silica gel", "Ink on paper", "Water on calcium chloride", "Hydrogen on charcoal"], a: 2 },
  { q: "In Physisorption, the adsorbent and adsorbate are held by:", o: ["Chemical bonds", "Hydrogen bonds", "Vander Waals forces", "Ionic bonds"], a: 2 },
  { q: "Which gas is adsorbed most easily on activated charcoal?", o: ["H2", "N2", "SO2", "O2"], a: 2 },
  { q: "Physical adsorption is generally:", o: ["Irreversible", "Endothermic", "Reversible", "Non-specific"], a: 2 },
  { q: "Extent of physisorption _________ with increase in temperature.", o: ["Increases", "Decreases", "Remains same", "First increases then decreases"], a: 1 },
  { q: "The enthalpy of chemisorption is usually in the range of:", o: ["20-40 kJ/mol", "40-100 kJ/mol", "80-240 kJ/mol", "200-500 kJ/mol"], a: 2 },
  { q: "Which of the following is a lyophobic colloid?", o: ["Starch", "Gum", "Gold sol", "Gelatin"], a: 2 },
  { q: "The movement of colloidal particles under the influence of an electric field is:", o: ["Dialysis", "Electrophoresis", "Brownian motion", "Tyndall effect"], a: 1 },
  { q: "Cloud is an example of:", o: ["Solid in gas", "Liquid in gas", "Gas in liquid", "Solid in liquid"], a: 1 },
  { q: "The process of removing a dissolved substance from a colloidal solution by diffusion through a membrane is:", o: ["Peptization", "Coagulation", "Dialysis", "Electrolysis"], a: 2 },
  { q: "Which ion has the highest coagulating power for a positive sol?", o: ["Cl-", "SO4^2-", "PO4^3-", "[Fe(CN)6]^4-"], a: 3 },
  { q: "Brownian movement is caused by:", o: ["Temperature fluctuations", "Gravity", "Collisions of molecules of dispersion medium", "Electrical charge"], a: 2 },
  { q: "Tyndall effect is observed in:", o: ["True solution", "Colloidal solution", "Precipitate", "Solvent"], a: 1 },
  { q: "The catalyst used in the Haber's process for the synthesis of Ammonia is:", o: ["Pt", "Fe + Mo", "V2O5", "Ni"], a: 1 },
  { q: "Enzymes are basically:", o: ["Carbohydrates", "Lipids", "Proteins", "Minerals"], a: 2 },
  { q: "Gold number is a measure of:", o: ["Purity of gold", "Protective power of lyophilic colloid", "Coagulating power", "Size of gold particles"], a: 1 },
  { q: "Which of the following is used to stop bleeding from a cut?", o: ["NaCl", "Alum", "Glucose", "Kanes"], a: 1 },
  { q: "A reaction in which one of the products acts as a catalyst is:", o: ["Homogeneous catalysis", "Heterogeneous catalysis", "Autocatalysis", "Biocatalysis"], a: 2 },
  { q: "The size of colloidal particles ranges between:", o: ["1 nm to 1000 nm", "0.1 nm to 1 nm", "1000 nm to 5000 nm", "10 nm to 100 nm"], a: 0 },
  { q: "Which of the following is an emulsifier?", o: ["Water", "Oil", "Soap", "Salt"], a: 2 },
  { q: "Freundlich adsorption isotherm is given by:", o: ["x/m = kp", "x/m = kp^(1/n)", "x/m = k/p", "x/m = p/k"], a: 1 },
  { q: "Peptization is a process of:", o: ["Precipitating a colloid", "Purifying a colloid", "Converting a precipitate into a colloid", "Movement of particles"], a: 2 },
  { q: "Shape-selective catalysis is a reaction catalyzed by:", o: ["Zeolites", "Enzymes", "Platinum", "Iron"], a: 0 },
  { q: "The zigzag motion of colloidal particles is known as:", o: ["Tyndall effect", "Peptization", "Brownian motion", "Coagulation"], a: 2 },
  { q: "Milk is a/an:", o: ["Sol", "Gel", "Emulsion", "Aerosol"], a: 2 },
  { q: "Which of the following is not a surfactant?", o: ["Soap", "Detergent", "Water", "Aryl sulfonates"], a: 2 },
  { q: "According to Hardy-Schulze law, coagulating power is directly proportional to:", o: ["Size of ion", "Charge on ion", "Magnitude of charge on ion", "Hydration energy"], a: 2 },
  { q: "In the adsorption of acetic acid on charcoal, the acetic acid is:", o: ["Adsorbent", "Adsorbate", "Absorbent", "Catalyst"], a: 1 },
  { q: "Butter is a type of emulsion of:", o: ["Liquid in liquid", "Solid in liquid", "Water in oil", "Oil in water"], a: 2 },
  { q: "The number of phases in a colloidal system is:", o: ["1", "2", "3", "4"], a: 1 },
  { q: "The catalyst used in the dehydration of ethyl alcohol to form ethene is:", o: ["Al2O3", "Fe", "Cu", "Pt"], a: 0 },
  { q: "Which of the following is a solid sol?", o: ["Smoke", "Cake", "Gemstones", "Foam"], a: 2 },
  { q: "Which is a characteristic of chemisorption?", o: ["Low enthalpy", "Reversible", "Highly specific", "Multimolecular layer"], a: 2 },
  { q: "Cottrell precipitator works on the principle of:", o: ["Neutralization of charge", "Diffusion", "Gravitation", "Osmosis"], a: 0 },
  { q: "Formation of micelles takes place only above:", o: ["Inversion temperature", "Critical temperature", "Kraft temperature", "Boiling point"], a: 2 }
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct /35) * 360;
localStorage.getItem("chemistry_chapter_5")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

  
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
