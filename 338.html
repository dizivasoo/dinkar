<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> integrals</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "The value of ∫ [1 / (x log x)] dx is", o: ["log|log x| + C (23%)", "1/(log x)² + C (43%)", "log|x| + C (21%)", "e^x log x + C (13%)"], a: 0},
  {q: "The value of the definite integral ∫ (from 0 to π/2) [sin x / (sin x + cos x)] dx is", o: ["π (23%)", "π/2 (43%)", "π/4 (21%)", "0 (13%)"], a: 2},
  {q: "Evaluate ∫ e^x (sin x + cos x) dx", o: ["e^x cos x + C (23%)", "e^x sin x + C (43%)", "e^x (sin x - cos x) + C (21%)", "sin x + cos x + C (13%)"], a: 1},
  {q: "The integral of tan x dx is equal to", o: ["sec² x + C (23%)", "log|sec x| + C (43%)", "log|sin x| + C (21%)", "-sec x + C (13%)"], a: 1},
  {q: "The value of ∫ (from -1 to 1) |x| dx is", o: ["0 (23%)", "2 (43%)", "1 (21%)", "1/2 (13%)"], a: 2},
  {q: "Find ∫ [dx / (x² + 16)]", o: ["1/4 tan⁻¹(x/4) + C (23%)", "tan⁻¹(x/4) + C (43%)", "1/16 tan⁻¹(x) + C (21%)", "log|x² + 16| + C (13%)"], a: 0},
  {q: "Evaluate ∫ x e^x dx", o: ["x e^x + C (23%)", "e^x(x + 1) + C (43%)", "e^x(x - 1) + C (21%)", "x²/2 e^x + C (13%)"], a: 2},
  {q: "The integral ∫ [dx / √(1 - x²)] is", o: ["cos⁻¹ x + C (23%)", "sin⁻¹ x + C (43%)", "tan⁻¹ x + C (21%)", "log|x + √(1-x²)| + C (13%)"], a: 1},
  {q: "The value of ∫ (from 0 to 1) [1 / (1 + x²)] dx is", o: ["π/2 (23%)", "1 (43%)", "π/4 (21%)", "π (13%)"], a: 2},
  {q: "Find ∫ cos² x dx", o: ["sin³ x / 3 + C (23%)", "x/2 + (sin 2x)/4 + C (43%)", "x/2 - (sin 2x)/4 + C (21%)", "sin 2x + C (13%)"], a: 1},
  {q: "∫ (sec² x / cosec² x) dx is equal to", o: ["tan x - x + C (23%)", "tan x + x + C (43%)", "cot x - x + C (21%)", "sec x + C (13%)"], a: 0},
  {q: "The value of ∫ (from 2 to 3) (1/x) dx is", o: ["log(3/2) (23%)", "log 5 (43%)", "log 1 (21%)", "log 6 (13%)"], a: 0},
  {q: "∫ [dx / (x² - a²)] is equal to", o: ["1/a log|(x-a)/(x+a)| + C (23%)", "1/(2a) log|(x-a)/(x+a)| + C (43%)", "1/(2a) log|(x+a)/(x-a)| + C (21%)", "tan⁻¹(x/a) + C (13%)"], a: 1},
  {q: "∫ [e^(6 log x) - e^(5 log x)] / [e^(4 log x) - e^(3 log x)] dx is", o: ["x³/3 + C (23%)", "x²/2 + C (43%)", "x + C (21%)", "log x + C (13%)"], a: 0},
  {q: "The value of ∫ (from 0 to π) cos x dx is", o: ["1 (23%)", "2 (43%)", "0 (21%)", "-1 (13%)"], a: 2},
  {q: "∫ cot x dx is", o: ["log|sin x| + C (23%)", "log|cos x| + C (43%)", "-cosec² x + C (21%)", "tan x + C (13%)"], a: 0},
  {q: "∫ [dx / sin²x cos²x] is", o: ["tan x + cot x + C (23%)", "tan x - cot x + C (43%)", "cot x - tan x + C (21%)", "sin 2x + C (13%)"], a: 1},
  {q: "The value of ∫ (from 0 to 2) √(4 - x²) dx is", o: ["π (23%)", "2π (43%)", "π/2 (21%)", "4π (13%)"], a: 0},
  {q: "∫ [1 / (1 + cos x)] dx is", o: ["tan(x/2) + C (23%)", "cot(x/2) + C (43%)", "1/2 tan(x/2) + C (21%)", "sec x + C (13%)"], a: 0},
  {q: "∫ x sin x dx is", o: ["x cos x + sin x + C (23%)", "sin x - x cos x + C (43%)", "x sin x + cos x + C (21%)", "cos x - x sin x + C (13%)"], a: 1},
  {q: "The value of ∫ (from -π/2 to π/2) sin⁷ x dx is", o: ["1 (23%)", "π (43%)", "0 (21%)", "1/2 (13%)"], a: 2},
  {q: "∫ [dx / (1 + 3x²)] is", o: ["1/√3 tan⁻¹(√3 x) + C (23%)", "tan⁻¹(√3 x) + C (43%)", "1/3 tan⁻¹(3x) + C (21%)", "√3 tan⁻¹(x) + C (13%)"], a: 0},
  {q: "∫ [sin⁻¹ x + cos⁻¹ x] dx is", o: ["πx/2 + C (23%)", "π/2 + C (43%)", "x + C (21%)", "0 (13%)"], a: 0},
  {q: "The value of ∫ (from 0 to π/4) tan x dx is", o: ["log 2 (23%)", "1/2 log 2 (43%)", "log √2 (21%)", "1 (13%)"], a: 1},
  {q: "∫ e^x (1/x - 1/x²) dx is", o: ["e^x/x + C (23%)", "-e^x/x + C (43%)", "e^x log x + C (21%)", "e^x/x² + C (13%)"], a: 0},
  {q: "∫ dx / (9 + x²) is", o: ["1/3 tan⁻¹(x/3) + C (23%)", "3 tan⁻¹(x/3) + C (43%)", "tan⁻¹(x/3) + C (21%)", "1/9 tan⁻¹(x) + C (13%)"], a: 0},
  {q: "∫ [ (log x)² / x ] dx is", o: ["(log x)³/3 + C (23%)", "(log x)²/2 + C (43%)", "2 log x + C (21%)", "1/x + C (13%)"], a: 0},
  {q: "The area bounded by the curve y = sin x between x = 0 and x = π is", o: ["1 (23%)", "2 (43%)", "π (21%)", "0 (13%)"], a: 1},
  {q: "∫ dx / √(a² - x²) is", o: ["1/a sin⁻¹(x/a) + C (23%)", "sin⁻¹(x/a) + C (43%)", "cos⁻¹(x/a) + C (21%)", "1/a tan⁻¹(x/a) + C (13%)"], a: 1},
  {q: "The value of ∫ (from 0 to 1) [e^x / (1 + e^x)] dx is", o: ["log(1+e) (23%)", "log[(1+e)/2] (43%)", "e - 1 (21%)", "log e (13%)"], a: 1},
  {q: "∫ sec x dx is", o: ["log|sec x + tan x| + C (23%)", "log|sec x - tan x| + C (43%)", "sec x tan x + C (21%)", "tan x + C (13%)"], a: 0},
  {q: "∫ [sin(log x) / x] dx is", o: ["-cos(log x) + C (23%)", "cos(log x) + C (43%)", "sin(log x) + C (21%)", "log(sin x) + C (13%)"], a: 0},
  {q: "The value of ∫ (from 0 to a) [f(x) / (f(x) + f(a-x))] dx is", o: ["a (23%)", "a/2 (43%)", "0 (21%)", "2a (13%)"], a: 1},
  {q: "∫ [2x / (1 + x²)] dx is", o: ["log|1 + x²| + C (23%)", "tan⁻¹ x + C (43%)", "2 log|x| + C (21%)", "x² + C (13%)"], a: 0},
  {q: "∫ dx / (x² - 16) is", o: ["1/4 log|(x-4)/(x+4)| + C (23%)", "1/8 log|(x-4)/(x+4)| + C (43%)", "1/8 log|(x+4)/(x-4)| + C (21%)", "1/4 tan⁻¹(x/4) + C (13%)"], a: 1}
];



let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_6")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

  
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
