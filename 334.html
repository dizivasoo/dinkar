<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title> inverse trignometric functions </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

  <div class="header">

  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<script>
/* QUESTIONS */
const questions = [
  {q: "The principal value branch of sin⁻¹x is", o: ["[-π/2, π/2] (23%)", "[0, π] (43%)", "(-π/2, π/2) (21%)", "(0, π) (13%)"], a: 0},
  {q: "The value of cos⁻¹(cos 13π/6) is", o: ["13π/6 (23%)", "π/6 (43%)", "7π/6 (21%)", "5π/6 (13%)"], a: 1},
  {q: "The domain of the function f(x) = sin⁻¹x is", o: ["(0, 1) (23%)", "[-1, 1] (43%)", "R (21%)", "[-π, π] (13%)"], a: 1},
  {q: "The value of tan⁻¹(√3) - sec⁻¹(-2) is", o: ["π/3 (23%)", "-π/3 (43%)", "π (21%)", "2π/3 (13%)"], a: 1},
  {q: "The value of sin(π/3 - sin⁻¹(-1/2)) is", o: ["1/2 (23%)", "1 (43%)", "-1 (21%)", "0 (13%)"], a: 1},
  {q: "The principal value of cos⁻¹(-1/√2) is", o: ["π/4 (23%)", "3π/4 (43%)", "5π/4 (21%)", "-π/4 (13%)"], a: 1},
  {q: "Domain of cos⁻¹(2x - 1) is", o: ["[0, 1] (23%)", "[0, 1] (43%)", "[-1, 1] (21%)", "R (13%)"], a: 1},
  {q: "The value of sin⁻¹(sin 2π/3) is", o: ["2π/3 (23%)", "π/3 (43%)", "-π/3 (21%)", "4π/3 (13%)"], a: 1},
  {q: "The range of principal value branch of cot⁻¹x is", o: ["(0, π) (23%)", "(0, π) (43%)", "[0, π] (21%)", "(-π/2, π/2) (13%)"], a: 1},
  {q: "If sin⁻¹x = y, then", o: ["0 ≤ y ≤ π (23%)", "-π/2 ≤ y ≤ π/2 (43%)", "0 < y < π (21%)", "-π/2 < y < π/2 (13%)"], a: 1},
  {q: "The value of tan⁻¹(1) + cos⁻¹(-1/2) + sin⁻¹(-1/2) is", o: ["π/4 (23%)", "3π/4 (43%)", "π/2 (21%)", "3π/2 (13%)"], a: 1},
  {q: "The value of tan⁻¹√3 - cot⁻¹(-√3) is", o: ["π (23%)", "-π/2 (43%)", "0 (21%)", "2√3 (13%)"], a: 1},
  {q: "sin(tan⁻¹x), |x| < 1 is equal to", o: ["x/√(1-x²) (23%)", "x/√(1+x²) (43%)", "1/√(1-x²) (21%)", "1/√(1+x²) (13%)"], a: 1},
  {q: "The principal value of cosec⁻¹(2) is", o: ["π/3 (23%)", "π/6 (43%)", "π/4 (21%)", "π/2 (13%)"], a: 1},
  {q: "The value of cos⁻¹(cos 7π/6) is", o: ["7π/6 (23%)", "5π/6 (43%)", "π/6 (21%)", "π/3 (13%)"], a: 1},
  {q: "The range of sec⁻¹x is", o: ["[0, π] (23%)", "[0, π] - {π/2} (43%)", "(-π/2, π/2) (21%)", "[-π/2, π/2] - {0} (13%)"], a: 1},
  {q: "If 3 sin⁻¹x = sin⁻¹(3x - 4x³), then x belongs to", o: ["[-1, 1] (23%)", "[1/2, 1] (43%)", "[-1/2, 1/2] (21%)", "[0, 1] (13%)"], a: 2},
  {q: "The value of tan(cos⁻¹ 4/5 + tan⁻¹ 2/3) is", o: ["6/17 (23%)", "17/6 (43%)", "7/16 (21%)", "16/7 (13%)"], a: 1},
  {q: "Which of the following is the principal value branch of cosec⁻¹x?", o: ["(-π/2, π/2) (23%)", "[-π/2, π/2] - {0} (43%)", "[0, π] - {π/2} (21%)", "[-π/2, π/2] (13%)"], a: 1},
  {q: "The value of cos(sin⁻¹ 1/2 + cos⁻¹ 1/2) is", o: ["1 (23%)", "0 (43%)", "-1 (21%)", "1/2 (13%)"], a: 1},
  {q: "Principal value of sin⁻¹(-1/2) is", o: ["π/6 (23%)", "-π/6 (43%)", "5π/6 (21%)", "7π/6 (13%)"], a: 1},
  {q: "The value of tan⁻¹(tan 3π/4) is", o: ["3π/4 (23%)", "-π/4 (43%)", "π/4 (21%)", "7π/4 (13%)"], a: 1},
  {q: "The domain of sec⁻¹x is", o: ["R (23%)", "R - (-1, 1) (43%)", "[-1, 1] (21%)", "(-∞, ∞) (13%)"], a: 1},
  {q: "The value of cot(tan⁻¹a + cot⁻¹a) is", o: ["1 (23%)", "0 (43%)", "a (21%)", "None (13%)"], a: 1},
  {q: "The value of sin⁻¹(1/2) + cos⁻¹(1/2) is", o: ["π (23%)", "π/2 (43%)", "π/4 (21%)", "0 (13%)"], a: 1},
  {q: "Principal value of cos⁻¹(√3/2) is", o: ["π/3 (23%)", "π/6 (43%)", "π/4 (21%)", "π/2 (13%)"], a: 1},
  {q: "If tan⁻¹x = y, then", o: ["-π/2 ≤ y ≤ π/2 (23%)", "-π/2 < y < π/2 (43%)", "0 < y < π (21%)", "0 ≤ y ≤ π (13%)"], a: 1},
  {q: "The value of sin⁻¹(sin 5) is", o: ["5 (23%)", "5 - 2π (43%)", "2π - 5 (21%)", "None (13%)"], a: 1},
  {q: "Domain of tan⁻¹x is", o: ["[-1, 1] (23%)", "R (43%)", "(-π/2, π/2) (21%)", "R - {0} (13%)"], a: 1},
  {q: "Principal value of sec⁻¹(2/√3) is", o: ["π/3 (23%)", "π/6 (43%)", "π/4 (21%)", "2π/3 (13%)"], a: 1},
  {q: "If cos⁻¹x = y, then the range of y is", o: ["(-π/2, π/2) (23%)", "[0, π] (43%)", "[-π/2, π/2] (21%)", "(0, π) (13%)"], a: 1},
  {q: "The value of cos⁻¹(1/2) + 2sin⁻¹(1/2) is", o: ["π/3 (23%)", "2π/3 (43%)", "π (21%)", "π/2 (13%)"], a: 1},
  {q: "The value of tan⁻¹(√3) - sec⁻¹(-2) is", o: ["π/3 (23%)", "-π/3 (43%)", "π (21%)", "2π/3 (13%)"], a: 1},
  {q: "If sin⁻¹(1-x) - 2sin⁻¹x = π/2, then x is", o: ["0, 1/2 (23%)", "0 (43%)", "1/2 (21%)", "None (13%)"], a: 1},
  {q: "The value of sin(2 sin⁻¹ 0.6) is", o: ["1.2 (23%)", "0.96 (43%)", "0.48 (21%)", "0.36 (13%)"], a: 1}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_2")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

   
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>
