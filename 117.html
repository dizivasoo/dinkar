<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> electromagnetic induction </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>

/* QUESTIONS */
const questions = [
  {q:"The phenomena of generation of induced emf in a conductor when the magnetic flux linked with it changes is called",o:["Magnetic induction","Electromagnetic induction","Self induction","Mutual induction"],a:1},
  {q:"Lenz's law is a consequence of the law of conservation of",o:["Charge","Mass","Momentum","Energy"],a:3},
  {q:"The SI unit of magnetic flux is",o:["Tesla","Henry","Gauss","Weber"],a:3},
  {q:"The polarity of induced emf is given by",o:["Ampere's law","Lenz's law","Biot-Savart law","Fleming's Right Hand Rule"],a:1},
  {q:"The self-inductance of a long solenoid is proportional to",o:["Number of turns","Square of number of turns","Area of cross-section","Both B and C"],a:3},
  {q:"Eddy currents are produced when",o:["A metal is kept in a steady magnetic field","A metal is kept in a varying magnetic field","A circular coil is placed in a steady field","Current is passed through a conductor"],a:1},
  {q:"The SI unit of self-inductance is",o:["Weber","Henry","Tesla","Farad"],a:1},
  {q:"A metal plate can be heated by",o:["Passing direct current","Passing alternating current","Placing in a time-varying magnetic field","All of the above"],a:3},
  {q:"The mutual inductance between two coils depends on",o:["Medium between coils","Distance between coils","Orientation of coils","All of the above"],a:3},
  {q:"If the number of turns in a coil is doubled, its self-inductance becomes",o:["Double","Half","Four times","One-fourth"],a:2},
  {q:"An inductor stores energy in its",o:["Electric field","Magnetic field","Core","Coil"],a:1},
  {q:"The induced emf in a coil rotating in a uniform magnetic field is maximum when the angle between field and area vector is",o:["0°","90°","45°","180°"],a:1},
  {q:"The role of inductance in a circuit is equivalent to",o:["Inertia","Force","Friction","Momentum"],a:0},
  {q:"The working of an AC generator is based on",o:["Chemical effect","Heating effect","Mutual induction","Electromagnetic induction"],a:3},
  {q:"The magnetic flux linked with a coil of N turns and area A perpendicular to field B is",o:["B/A","NAB","BA/N","Zero"],a:1},
  {q:"A transformer works on the principle of",o:["Self induction","Eddy currents","Mutual induction","Seebeck effect"],a:2},
  {q:"When a magnet is moved towards a coil, the induced current in the coil produces a",o:["Force of attraction","Gravitational force","Repulsive force","None of these"],a:2},
  {q:"The expression for motional emf is",o:["Bv/l","Blv","B²/lv","Bl/v"],a:1},
  {q:"The coefficient of mutual induction for two coils is 2H. If current in one changes by 5A in 1s, the emf in other is",o:["10V","5V","2V","0.4V"],a:0},
  {q:"Dimensional formula of magnetic flux is",o:["[ML²T⁻²A⁻¹]","[MLT⁻²A⁻¹]","[ML²T⁻¹A⁻¹]","[ML²T⁻²A⁻²]"],a:0},
  {q:"If a current of 2A in a coil of 100 turns produces a flux of 0.05 Wb, the self-inductance is",o:["2.5 H","5 H","0.5 H","25 H"],a:0},
  {q:"Which of the following does not use eddy currents?",o:["Magnetic braking","Induction furnace","Electric heater","Galvanometer damping"],a:2},
  {q:"The rate of change of magnetic flux has the same units as",o:["Current","Resistance","Potential difference","Capacitance"],a:2},
  {q:"The energy density in a magnetic field B is proportional to",o:["B","√B","B²","1/B²"],a:2},
  {q:"A copper ring is held horizontally and a bar magnet is dropped through the ring. Its acceleration is",o:["Equal to g","Greater than g","Zero","Less than g"],a:3},
  {q:"The flux linked with a circuit of resistance R changes by ΔΦ. The total charge Q that flows is",o:["ΔΦ/R","R·ΔΦ","ΔΦ/R²","R²/ΔΦ"],a:0},
  {q:"Self-inductance of a coil is the measure of",o:["Electrical friction","Electrical inertia","Electrical momentum","Electrical energy"],a:1},
  {q:"Two coils are placed close to each other. The mutual inductance is maximum when",o:["Coils are parallel","Coils are perpendicular","Coils are at 45°","Coils are concentric and coplanar"],a:3},
  {q:"The magnetic flux linked with a coil changes from 10Wb to 2Wb in 0.1s. The induced emf is",o:["8V","0.8V","80V","40V"],a:2},
  {q:"The core of a transformer is laminated to",o:["Increase flux","Decrease resistance","Reduce hysteresis","Reduce eddy current loss"],a:3},
  {q:"A coil is removed from a magnetic field rapidly. The induced charge is",o:["More than if removed slowly","Less than if removed slowly","Independent of speed","Zero"],a:2},
  {q:"A back emf is produced in",o:["Transformer","DC Motor","Voltmeter","Ammeter"],a:1},
  {q:"The unit of L/R is same as that of",o:["Frequency","Velocity","Force","Time"],a:3},
  {q:"Henry is equivalent to",o:["Weber/Ampere","Volt·sec/Ampere","Ohm·sec","All of the above"],a:3},
  {q:"In an AC generator, the brush is made of",o:["Copper","Iron","Aluminum","Carbon"],a:3}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_7")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

      <button class="btn" onclick="location.reload()">Retake Test</button>
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
