<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> ray optics and optical Instruments</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"The refractive index of glass is 1.5. The speed of light in glass is",o:["2 x 10⁸ m/s","3 x 10⁸ m/s","1.5 x 10⁸ m/s","2.5 x 10⁸ m/s"],a:0},
  {q:"A convex lens of focal length 20 cm is placed in contact with a concave lens of focal length 40 cm. The power of the combination is",o:["+2.5 D","+5.0 D","-2.5 D","-5.0 D"],a:0},
  {q:"Total internal reflection occurs when light travels from",o:["Rarer to denser medium","Denser to rarer medium","One medium to another of same RI","Vacuum to any medium"],a:1},
  {q:"The critical angle for a medium is 30°. The refractive index of the medium is",o:["1","1.5","2","2.5"],a:2},
  {q:"A person cannot see objects clearly beyond 2 m. The disease he is suffering from is",o:["Hypermetropia","Presbyopia","Astigmatism","Myopia"],a:3},
  {q:"To correct myopia, a person should use a",o:["Concave lens","Convex lens","Cylindrical lens","Bifocal lens"],a:0},
  {q:"The focal length of a plane mirror is",o:["Zero","Infinity","Fixed but small","Negative"],a:1},
  {q:"For a thin prism of angle A and refractive index n, the angle of minimum deviation is",o:["(n-1)A","(n+1)A","A/n","n/A"],a:0},
  {q:"The magnifying power of a compound microscope is high if",o:["f_o and f_e are both small","f_o and f_e are both large","f_o is small and f_e is large","f_o is large and f_e is small"],a:0},
  {q:"The sky appears blue due to",o:["Scattering of light","Refraction of light","Dispersion of light","Total internal reflection"],a:0},
  {q:"The phenomenon used in optical fibers is",o:["Refraction","Scattering","Dispersion","Total internal reflection"],a:3},
  {q:"An object is placed at the focus of a convex lens. The image will be formed at",o:["Focus","Center of curvature","Between F and C","Infinity"],a:3},
  {q:"Which of the following colors of white light deviated the most by a prism?",o:["Red","Yellow","Violet","Green"],a:2},
  {q:"The power of a lens is -2.0 D. Its focal length is",o:["-50 cm","-20 cm","50 cm","20 cm"],a:0},
  {q:"Mirage is an optical phenomenon caused by",o:["Refraction only","Total internal reflection","Reflection only","Diffraction"],a:1},
  {q:"The image formed by an objective of a compound microscope is",o:["Virtual and magnified","Real and magnified","Real and diminished","Virtual and diminished"],a:1},
  {q:"The unit of power of a lens is",o:["Dioptre","Watt","Meter","Decibel"],a:0},
  {q:"A convex lens is dipped in a liquid whose refractive index is equal to that of the lens. It will act as a",o:["Plane glass sheet","Converging lens","Diverging lens","Mirror"],a:0},
  {q:"The length of an astronomical telescope in normal adjustment is",o:["f_o + f_e","f_o - f_e","f_o / f_e","f_o * f_e"],a:0},
  {q:"If a symmetrical convex lens of focal length f is cut into two equal parts along the principal axis, the focal length of each part will be",o:["f","2f","f/2","Infinity"],a:0},
  {q:"A point source of light is placed at the bottom of a water tank. The area of the surface through which light emerges depends on",o:["Refractive index of water","Depth of the source","Both A and B","Color of light only"],a:2},
  {q:"The angle of deviation produced by a prism is minimum when",o:["i = e","i > e","i < e","i + e = 90°"],a:0},
  {q:"In an astronomical telescope, the final image is",o:["Real and erect","Virtual and erect","Real and inverted","Virtual and inverted"],a:3},
  {q:"The primary rainbow is formed due to",o:["One TIR and two refractions","Two TIRs and two refractions","Scattering","Diffraction"],a:0},
  {q:"The secondary rainbow is fainter than the primary rainbow because of",o:["Multiple reflections","Single reflection","Absorption of light","Two total internal reflections"],a:3},
  {q:"If the wavelength of light increases, the refractive index of the medium",o:["Increases","Decreases","Remains same","First increases then decreases"],a:1},
  {q:"The near point of a normal human eye is",o:["25 cm","50 cm","100 cm","Infinity"],a:0},
  {q:"Linear magnification produced by a convex mirror is always",o:["Equal to 1","More than 1","Less than 1","Infinity"],a:2},
  {q:"The speed of light is maximum in",o:["Glass","Water","Diamond","Vacuum"],a:3},
  {q:"The brilliance of a diamond is mainly due to",o:["Refraction","Dispersion","Total internal reflection","Interference"],a:2},
  {q:"To increase the magnifying power of a telescope",o:["Increase f_o","Decrease f_e","Both A and B","Increase f_e"],a:2},
  {q:"A ray of light passes from glass to water. The critical angle is",o:["sin⁻¹(2/3)","sin⁻¹(3/4)","sin⁻¹(8/9)","sin⁻¹(1/2)"],a:2},
  {q:"When light is refracted, which of the following does not change?",o:["Wavelength","Frequency","Velocity","Amplitude"],a:1},
  {q:"The relation between focal length f and radius of curvature R of a spherical mirror is",o:["f = R","f = 2R","R = f/2","f = R/2"],a:3},
  {q:"The limit of resolution of the human eye is about",o:["1 minute","1 second","1 degree","0.1 degree"],a:0}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_9")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
