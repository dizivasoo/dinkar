<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> 3d geometary </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">

</audio>

<audio id="wrongSound">

</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "If a line makes angles α, β, γ with the positive direction of coordinate axes, then sin²α + sin²β + sin²γ is", o: ["2 (33%)", "1 (17%)", "3 (33%)", "0 (17%)"], a: 0},
  {q: "The distance of the point P(a, b, c) from the x-axis is", o: ["√(b² + c²) (33%)", "a (17%)", "√(a² + b²) (33%)", "√(a² + c²) (17%)"], a: 0},
  {q: "The direction cosines of the y-axis are", o: ["(0, 1, 0) (33%)", "(1, 0, 0) (17%)", "(0, 0, 1) (33%)", "(1, 1, 1) (17%)"], a: 0},
  {q: "If the direction cosines of a line are k, k, k, then", o: ["k = 1/√3 (33%)", "k = 1/3 (17%)", "k = ±1/√3 (33%)", "k = 1 (17%)"], a: 2},
  {q: "The equation of the xz-plane is", o: ["y = 0 (33%)", "x = 0 (17%)", "z = 0 (33%)", "x + z = 0 (17%)"], a: 0},
  {q: "The distance between the points (2, 3, 5) and (4, 3, 1) is", o: ["√20 (33%)", "2 (17%)", "4 (33%)", "√24 (17%)"], a: 0},
  {q: "The angle between the lines with direction ratios (1, 1, 2) and (√3-1, -√3-1, 4) is", o: ["π/3 (33%)", "π/4 (17%)", "π/6 (33%)", "π/2 (17%)"], a: 0},
  {q: "Two lines with direction ratios a1, b1, c1 and a2, b2, c2 are perpendicular if", o: ["a1a2 + b1b2 + c1c2 = 0 (33%)", "a1/a2 = b1/b2 (17%)", "a1a2 + b1b2 + c1c2 = 1 (33%)", "None (17%)"], a: 0},
  {q: "The vector equation of a line passing through the point (5, 2, -4) and parallel to the vector 3i + 2j - 8k is", o: ["r = (5i + 2j - 4k) + λ(3i + 2j - 8k) (33%)", "r = (3i + 2j - 8k) + λ(5i + 2j - 4k) (17%)", "r = (5i + 2j - 4k) + (3i + 2j - 8k) (33%)", "None (17%)"], a: 0},
  {q: "The Cartesian equation of a line is (x-5)/3 = (y+4)/7 = (z-6)/2. Its direction ratios are", o: ["3, 7, 2 (33%)", "5, -4, 6 (17%)", "3, 7, 2 (33%)", "-5, 4, -6 (17%)"], a: 2},
  {q: "The shortest distance between two parallel lines r = a1 + λb and r = a2 + μb is", o: ["|(b × (a2-a1))/|b|| (33%)", "|b · (a2-a1)| (17%)", "|(b × (a2-a1))/|b|| (33%)", "0 (17%)"], a: 2},
  {q: "The coordinates of the foot of the perpendicular from the origin to the plane 2x - 3y + 4z - 6 = 0 is", o: ["(12/29, -18/29, 24/29) (33%)", "(2, -3, 4) (17%)", "(12/29, -18/29, 24/29) (33%)", "(6, 6, 6) (17%)"], a: 2},
  {q: "The reflection of the point (α, β, γ) in the xy-plane is", o: ["(α, β, -γ) (33%)", "(-α, -β, γ) (17%)", "(α, β, -γ) (33%)", "(0, 0, γ) (17%)"], a: 2},
  {q: "If a line makes angles 90°, 60°, and 30° with x, y, and z axes respectively, its direction cosines are", o: ["0, 1/2, √3/2 (33%)", "1, 1/2, √3/2 (17%)", "0, 1/2, √3/2 (33%)", "0, √3/2, 1/2 (17%)"], a: 2},
  {q: "The distance of the point (2, 5, -3) from the plane r · (6i - 3j + 2k) = 4 is", o: ["13/7 (33%)", "13 (17%)", "13/7 (33%)", "2 (17%)"], a: 2},
  {q: "Equation of the plane passing through the point (1, 1, 1) and perpendicular to the z-axis is", o: ["z = 1 (33%)", "x + y + z = 3 (17%)", "z = 1 (33%)", "x = 1 (17%)"], a: 2},
  {q: "The intercept form of the equation of a plane is", o: ["x/a + y/b + z/c = 1 (33%)", "ax + by + cz = d (17%)", "x/a + y/b + z/c = 1 (33%)", "x+y+z = abc (17%)"], a: 2},
  {q: "The angle between the planes 2x - y + z = 6 and x + y + 2z = 7 is", o: ["π/3 (33%)", "π/2 (17%)", "π/3 (33%)", "π/4 (17%)"], a: 2},
  {q: "The direction ratios of the normal to the plane 7x + 4y - 2z + 5 = 0 are", o: ["7, 4, -2 (33%)", "7, 4, 2 (17%)", "7, 4, -2 (33%)", "0, 0, 0 (17%)"], a: 2},
  {q: "A line passes through (1, 2, 3) and has direction ratios (1, 1, 1). The point on the line at distance √3 is", o: ["(2, 3, 4) (33%)", "(0, 1, 2) (17%)", "(2, 3, 4) (33%)", "(1, 1, 1) (17%)"], a: 2},
  {q: "If a line has direction ratios (2, -1, -2), its direction cosines are", o: ["2/3, -1/3, -2/3 (33%)", "2, -1, -2 (17%)", "2/3, -1/3, -2/3 (33%)", "1/3, 1/3, 1/3 (17%)"], a: 2},
  {q: "The plane 2x - 3y + 6z - 11 = 0 makes an angle sin⁻¹(α) with the x-axis. Then α is", o: ["2/7 (33%)", "3/7 (17%)", "2/7 (33%)", "6/7 (17%)"], a: 2},
  {q: "The points (1, 2, 3), (-2, 3, 5) and (7, 0, -1) are", o: ["Collinear (33%)", "Vertices of equilateral triangle (17%)", "Collinear (33%)", "None (17%)"], a: 2},
  {q: "Distance between parallel planes 2x + 3y + 4z = 4 and 4x + 6y + 8z = 12 is", o: ["2/√29 (33%)", "4/√29 (17%)", "2/√29 (33%)", "8/29 (17%)"], a: 2},
  {q: "Direction cosines of a line equally inclined to the axes are", o: ["±1/√3, ±1/√3, ±1/√3 (33%)", "1, 1, 1 (17%)", "±1/√3, ±1/√3, ±1/√3 (33%)", "0, 0, 0 (17%)"], a: 2},
  {q: "The equation of the plane through (2, 3, 4) and parallel to the plane x + 2y + 4z = 5 is", o: ["x + 2y + 4z = 24 (33%)", "x + 2y + 4z = 5 (17%)", "x + 2y + 4z = 24 (33%)", "x + 2y + 4z = 0 (17%)"], a: 2},
  {q: "The distance of the point (2, 3, 4) from the plane 3x - 6y + 2z + 11 = 0 is", o: ["1 (33%)", "0 (17%)", "1 (33%)", "2 (17%)"], a: 2},
  {q: "The angle between the line r = a + λb and the plane r · n = d is given by sin θ =", o: ["(b · n) / (|b||n|) (33%)", "b · n (17%)", "(b · n) / (|b||n|) (33%)", "0 (17%)"], a: 2},
  {q: "The coordinates of a point which divides the join of (5, 4, 2) and (-1, -2, 4) in the ratio 2:3 is", o: ["(13/5, 8/5, 14/5) (33%)", "(2, 1, 3) (17%)", "(13/5, 8/5, 14/5) (33%)", "(7/5, 2/5, 16/5) (17%)"], a: 2},
  {q: "The equation of the line passing through (1, 2, 3) and parallel to the y-axis is", o: ["(x-1)/0 = (y-2)/1 = (z-3)/0 (33%)", "x=1, z=3 (17%)", "x=1, z=3 (33%)", "y=2 (17%)"], a: 2},
  {q: "If the planes ax + by + cz + d = 0 and a'x + b'y + c'z + d' = 0 are parallel, then", o: ["a/a' = b/b' = c/c' (33%)", "aa' + bb' + cc' = 0 (17%)", "a/a' = b/b' = c/c' (33%)", "None (17%)"], a: 2},
  {q: "A line makes an angle of 45° with both x and y axes. The angle it makes with the z axis is", o: ["90° (33%)", "45° (17%)", "90° (33%)", "60° (17%)"], a: 2},
  {q: "The center of the sphere (x-2)² + (y+3)² + (z-4)² = 25 is", o: ["(2, -3, 4) (33%)", "(2, 3, 4) (17%)", "(2, -3, 4) (33%)", "(-2, 3, -4) (17%)"], a: 2},
  {q: "The distance of the point (1, 0, 0) from the yz-plane is", o: ["1 (33%)", "0 (17%)", "1 (33%)", "√2 (17%)"], a: 2},
  {q: "The direction ratios of a line passing through (2, 3, 5) and (4, 6, 8) are", o: ["2, 3, 3 (33%)", "6, 9, 13 (17%)", "2, 3, 3 (33%)", "1, 1, 1 (17%)"], a: 2}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_10")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

  
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
