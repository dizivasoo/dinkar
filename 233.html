<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Aldehydes , ketones & Carboxylic acid </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35 </div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"Which of the following is most reactive towards nucleophilic addition?",o:["Formaldehyde","Acetaldehyde","Acetone","Diethyl ketone"],a:0},
  {q:"The IUPAC name of Mesityl oxide is:",o:["4-Methylpent-3-en-2-one","3-Methylpent-2-en-4-one","4-Methylpent-4-en-2-one","None of these"],a:0},
  {q:"Which of the following does not give Fehling's test?",o:["Benzaldehyde","Acetaldehyde","Propanal","Ethanal"],a:0},
  {q:"The oxidation of toluene to benzaldehyde by chromyl chloride is called:",o:["Etard reaction","Stephen reaction","Cannizzaro reaction","Rosenmund reduction"],a:0},
  {q:"Which of the following is used as a formalin solution?",o:["40% HCHO","10% CH3CHO","40% CH3OH","None of these"],a:0},
  {q:"The product of the reaction between an aldehyde and a primary amine is:",o:["Schiff's base","Oxime","Hydrazone","Semicarbazone"],a:0},
  {q:"Dry distillation of calcium acetate gives:",o:["Acetone","Acetaldehyde","Formaldehyde","Acetic acid"],a:0},
  {q:"Which carboxylic acid has the lowest pKa value?",o:["Trichloroacetic acid","Dichloroacetic acid","Chloroacetic acid","Acetic acid"],a:0},
  {q:"The reagent used in the Stephen reduction is:",o:["SnCl2 / HCl","H2 / Pd-BaSO4","LiAlH4","NaBH4"],a:0},
  {q:"Which of the following is known as oil of bitter almonds?",o:["Benzaldehyde","Acetophenone","Benzophenone","Benzoic acid"],a:0},
  {q:"Rosenmund reduction is used for the preparation of:",o:["Aldehydes","Ketones","Alcohols","Acids"],a:1},
  {q:"Which of the following will undergo Cannizzaro reaction?",o:["Trimethyl acetaldehyde","Acetaldehyde","Propanal","Butanal"],a:1},
  {q:"Reaction of carbonyl compounds with NH2NH2 and KOH in glycol is:",o:["Wolff-Kishner reduction","Clemmensen reduction","Stephen's reduction","Etard reaction"],a:1},
  {q:"Aldehydes are isomeric with:",o:["Ketones","Alcohols","Ethers","Esters"],a:1},
  {q:"Tollen’s reagent is:",o:["Ammoniacal silver nitrate","Ammoniacal cuprous chloride","Alkaline KMnO4","Fehling's solution"],a:1},
  {q:"HVZ reaction is used for the preparation of:",o:["alpha-halo acids","beta-halo acids","Alkanes","Acid chlorides"],a:1},
  {q:"Which of the following reduces Tollen’s reagent?",o:["Methanoic acid","Ethanoic acid","Propanoic acid","Benzoic acid"],a:1},
  {q:"The formation of cyanohydrin from a ketone is an example of:",o:["Nucleophilic addition","Electrophilic addition","Nucleophilic substitution","Electrophilic substitution"],a:0},
  {q:"Which test is used to distinguish between aldehydes and ketones?",o:["Fehling's test","Iodoform test","Beilstein test","Molisch test"],a:0},
  {q:"Treatment of acetaldehyde with dilute NaOH gives:",o:["Aldol","Crotonaldehyde","Sodium acetate","Ethanol"],a:2},
  {q:"Urotropine is formed by the action of ammonia on:",o:["Formaldehyde","Acetaldehyde","Acetone","Benzaldehyde"],a:2},
  {q:"Which of the following gives iodoform test?",o:["Pentan-2-one","Pentan-3-one","Benzophenone","Propanoic acid"],a:0},
  {q:"Clemmensen reduction involves the use of:",o:["Zn-Hg / conc. HCl","LiAlH4","Na / Ethanol","NH2NH2 / KOH"],a:0},
  {q:"The product of Aldol condensation of two molecules of acetone is:",o:["4-Hydroxy-4-methylpentan-2-one","3-Hydroxybutanal","Diacetone alcohol","Both A and C"],a:3},
  {q:"The starting material for the manufacture of Vinegar is:",o:["Ethanol","Methanol","Formaldehyde","Ethanal"],a:0},
  {q:"Which of the following is the strongest acid?",o:["Formic acid","Acetic acid","Propionic acid","Butyric acid"],a:0},
  {q:"Benzoic acid can be converted into Benzyl alcohol by using:",o:["LiAlH4","NaBH4","H2 / Ni","Na / C2H5OH"],a:0},
  {q:"The functional group present in ketones is:",o:["-CO-","–CHO","–COOH","–OH"],a:0},
  {q:"Decarboxylation of sodium acetate with soda lime gives:",o:["Methane","Ethane","Propane","Butane"],a:0},
  {q:"Which of the following does not contain an -OH group?",o:["Methyl acetate","Acetic acid","Phenol","Ethanol"],a:0},
  {q:"Aldol condensation is given by aldehydes and ketones having:",o:["Alpha-hydrogen","Beta-hydrogen","Gamma-hydrogen","No hydrogen"],a:0},
  {q:"Reaction of Benzene with CO and HCl in presence of AlCl3 gives:",o:["Benzaldehyde","Acetophenone","Benzoic acid","Benzyl chloride"],a:0},
  {q:"Which of the following reagent reacts with both HCHO and CH3COCH3?",o:["HCN","Tollen's reagent","Fehling's solution","Schiff's reagent"],a:0},
  {q:"Gattermann-Koch reaction is used to prepare:",o:["Benzaldehyde","Toluene","Benzophenone","Chlorobenzene"],a:0},
  {q:"Calcium formate on heating gives:",o:["HCHO","CH3CHO","CH3COCH3","HCOOH"],a:0}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_12")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>


<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
