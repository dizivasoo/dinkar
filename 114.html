<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> moving charges and magnetism  </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"The magnetic field produced by a moving charge is called",o:["Electric field","Magnetic field","Gravitational field","None"],a:1},
  {q:"The SI unit of magnetic induction (B) is",o:["Weber","Tesla","Gauss","Maxwell"],a:1},
  {q:"A stationary charge produces",o:["Only electric field","Only magnetic field","Both fields","No field"],a:0},
  {q:"The force on a charge 'q' moving with velocity 'v' in magnetic field 'B' is",o:["q(v.B)","q(v x B)","v(q x B)","B(q x v)"],a:1},
  {q:"The magnetic field at the center of a circular current-carrying loop is",o:["μ₀I/2r","μ₀I/2πr","μ₀I/r","Zero"],a:0},
  {q:"A cyclotron is used to accelerate",o:["Electrons","Neutrons","Positive ions","All of these"],a:2},
  {q:"The work done by a magnetic field on a moving charge is",o:["Positive","Negative","Zero","Infinite"],a:2},
  {q:"Two parallel wires carrying current in the same direction ______ each other",o:["Repel","Attract","Rotate","Do nothing"],a:1},
  {q:"The SI unit of magnetic flux is",o:["Tesla","Ohm","Weber","Henry"],a:2},
  {q:"The path of a charged particle entering a magnetic field perpendicularly is",o:["Straight line","Parabola","Circle","Helix"],a:2},
  {q:"The magnetic field inside a long straight solenoid is",o:["Zero","Decreasing","Uniform","Infinite"],a:2},
  {q:"The principle of a moving coil galvanometer is based on",o:["Heating effect","Chemical effect","Torque on a current loop","Electrolysis"],a:2},
  {q:"To convert a galvanometer into a voltmeter, we connect",o:["Low resistance in parallel","High resistance in series","Low resistance in series","High resistance in parallel"],a:1},
  {q:"The magnetic moment of a current loop (I) with area (A) is",o:["I/A","IA","A/I","I²A"],a:1},
  {q:"The sensitivity of a galvanometer increases if the magnetic field is",o:["Decreased","Increased","Kept zero","Made variable"],a:1},
  {q:"Biot-Savart Law is analogous to which law in electrostatics?",o:["Gauss's Law","Coulomb's Law","Ohm's Law","Faraday's Law"],a:1},
  {q:"The force between two parallel currents is used to define",o:["Volt","Ohm","Ampere","Candela"],a:2},
  {q:"A toroid is essentially a solenoid bent into the shape of a",o:["Square","Triangle","Circle","Helix"],a:2},
  {q:"Magnetic field due to a straight very long current-carrying wire is",o:["μ₀I/2r","μ₀I/2πr","μ₀I/4πr","Zero"],a:1},
  {q:"Lorentz force formula is",o:["F = qE","F = q(v x B)","F = q[E + (v x B)]","F = ma"],a:2},
  {q:"The magnetic field lines around a straight wire are",o:["Straight","Concentric circles","Elliptical","Parabolic"],a:1},
  {q:"If a charge enters a magnetic field at an angle of 0°, the force is",o:["Maximum","Minimum (Zero)","q v B","Infinite"],a:1},
  {q:"The resistance of an ideal ammeter is",o:["Infinite","Zero","High","One Ohm"],a:1},
  {q:"A shunt is a ______ resistance",o:["High","Low","Variable","Zero"],a:1},
  {q:"The direction of magnetic force is given by",o:["Ohm's Law","Fleming's Left Hand Rule","Lenz's Law","Ampere's Law"],a:1},
  {q:"The radius of the circular path of a charge in 'B' is proportional to",o:["Mass","Velocity","Both 0 and 1","Field"],a:2},
  {q:"The torque on a current loop in a magnetic field is $\tau = $",o:["MB sinθ","MB cosθ","MB tanθ","Zero"],a:0},
  {q:"Current sensitivity of a galvanometer is defined as",o:["$\alpha/I$","$I/\alpha$","$\alpha/V$","$V/\alpha$"],a:0},
  {q:"Ampere’s Circuital Law is $\oint B \cdot dl = $",o:["μ₀I","I/μ₀","Zero","ε₀I"],a:0},
  {q:"In a cyclotron, the frequency of revolution is independent of",o:["Mass","Charge","Velocity","Magnetic Field"],a:2},
  {q:"Magnetic field lines ______ form closed loops",o:["Always","Never","Sometimes","Rarely"],a:0},
  {q:"The gyro-magnetic ratio of an electron is",o:["e/m","e/2m","2e/m","m/e"],a:1},
  {q:"A charge 'q' moves parallel to a magnetic field. The force on it is",o:["qvB","Zero","Infinite","None"],a:1},
  {q:"Which of the following is NOT a vector?",o:["Magnetic Field","Magnetic Flux","Magnetic Moment","Current Density"],a:1},
  {q:"The deflection in a galvanometer is ______ to the current",o:["Inversely proportional","Directly proportional","Equal","Independent"],a:1}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 10`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 10 - score;
  const degree = (correct / 10) * 360;
localStorage.getItem("physics_chapter_4")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

      <button class="btn" onclick="location.reload()">Retake Test</button>
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
