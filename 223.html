<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> solutions </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  { q: "Which of the following units is independent of temperature?", o: ["Molarity", "Normality", "Formality", "Molality"], a: 3 },
  { q: "The sum of mole fractions of all components in a solution is always:", o: ["0", "1", "100", "Variable"], a: 1 },
  { q: "An example of a solid-in-solid solution is:", o: ["Amalgam", "Brass", "Gemstones", "Both B and C"], a: 3 },
  { q: "Henry's law constant (KH) depends on:", o: ["Nature of gas", "Nature of solvent", "Temperature", "All of these"], a: 3 },
  { q: "Which gas is more soluble in water at a given pressure?", o: ["He", "O2", "N2", "NH3"], a: 3 },
  { q: "For an ideal solution, the enthalpy of mixing (ΔH_mix) is:", o: ["Positive", "Negative", "Zero", "Infinity"], a: 2 },
  { q: "Azeotropic mixtures are:", o: ["Constant boiling mixtures", "Binary mixtures", "Separable by distillation", "Both A and B"], a: 3 },
  { q: "Relative lowering of vapour pressure is equal to:", o: ["Mole fraction of solvent", "Mole fraction of solute", "Molarity", "Molality"], a: 1 },
  { q: "The osmotic pressure of a solution can be increased by:", o: ["Increasing temperature", "Decreasing temperature", "Decreasing concentration", "None"], a: 0 },
  { q: "Isotonic solutions have the same:", o: ["Density", "Molar concentration", "Normality", "None of these"], a: 1 },
  { q: "The Van't Hoff factor (i) for a dilute solution of NaCl is approximately:", o: ["1", "2", "3", "0.5"], a: 1 },
  { q: "Which colligative property is best used for determining the molar mass of polymers?", o: ["BP elevation", "FP depression", "Osmotic pressure", "RLVP"], a: 2 },
  { q: "When a non-volatile solute is added to a solvent, the vapour pressure:", o: ["Increases", "Decreases", "Remains same", "Fluctuates"], a: 1 },
  { q: "The value of Van't Hoff factor (i) for dissociation is always:", o: ["i < 1", "i = 1", "i > 1", "i = 0"], a: 2 },
  { q: "Which of the following shows a positive deviation from Raoult's law?", o: ["Acetone + Chloroform", "Water + HCl", "Ethanol + Acetone", "Phenol + Aniline"], a: 2 },
  { q: "At high altitudes, the boiling point of water decreases because:", o: ["Atmospheric pressure is low", "Atmospheric pressure is high", "Temperature is low", "None"], a: 0 },
  { q: "The unit of ebullioscopic constant (Kb) is:", o: ["K kg mol^-1", "mol kg^-1", "K mol kg^-1", "Unitless"], a: 0 },
  { q: "A solution of NaCl in water behaves as:", o: ["Ideal solution", "Non-ideal solution", "Azeotrope", "None"], a: 1 },
  { q: "Reverse osmosis is used in:", o: ["Water softening", "Water purification", "Concentrating juices", "Both B and C"], a: 3 },
  { q: "If i = 1, it means the solute undergoes:", o: ["Association", "Dissociation", "Neither association nor dissociation", "Both"], a: 2 },
  { q: "Camphor in Nitrogen gas is an example of:", o: ["Solid in gas solution", "Gas in solid solution", "Liquid in gas solution", "Gas in gas solution"], a: 0 },
  { q: "The plant cell will shrink when placed in:", o: ["Hypotonic solution", "Hypertonic solution", "Isotonic solution", "Pure water"], a: 1 },
  { q: "Which has the highest boiling point at 1 atm?", o: ["0.1 M Glucose", "0.1 M NaCl", "0.1 M BaCl2", "0.1 M Urea"], a: 2 },
  { q: "The solubility of gases in liquids generally ______ with increase in temperature.", o: ["Increases", "Decreases", "Remains constant", "None"], a: 1 },
  { q: "The law which relates the solubility of a gas to its pressure is:", o: ["Raoult's Law", "Henry's Law", "Hess's Law", "Ostwald's Law"], a: 1 },
  { q: "Cryoscopic constant depends on:", o: ["Nature of solute", "Nature of solvent", "Concentration", "Pressure"], a: 1 },
  { q: "Maximum boiling azeotropes are formed by solutions showing:", o: ["Positive deviation", "Negative deviation", "No deviation", "None"], a: 1 },
  { q: "Pressure applied to stop the flow of solvent through a semi-permeable membrane is:", o: ["Atmospheric pressure", "Vapour pressure", "Osmotic pressure", "Hydrostatic pressure"], a: 2 },
  { q: "Blood cells are isotonic with:", o: ["0.9% NaCl solution", "5% NaCl solution", "10% NaCl solution", "0.1% NaCl solution"], a: 0 },
  { q: "Binary liquid mixtures having the same composition in liquid and vapour phase are:", o: ["Ideal solutions", "Azeotropes", "Saturated solutions", "None"], a: 1 },
  { q: "Mole fraction of benzene in a solution containing 30% by mass in carbon tetrachloride is:", o: ["0.459", "0.501", "0.231", "0.320"], a: 3 },
  { q: "Which relationship is correct for an ideal solution?", o: ["ΔV_mix = 0", "ΔH_mix = 0", "Raoult's law is obeyed", "All of the above"], a: 3 },
  { q: "Colligative properties depend on:", o: ["Nature of solute", "Number of solute particles", "Physical properties of solute", "Nature of solvent"], a: 1 },
  { q: "The osmotic pressure (π) is given by the equation:", o: ["π = MRT", "π = nRT", "π = CRT", "Both A and C"], a: 3 },
  { q: "If molality of a solution is doubled, the value of Kf will be:", o: ["Doubled", "Halved", "Unchanged", "Tripled"], a: 2 }
];



let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_2")

  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>


<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
