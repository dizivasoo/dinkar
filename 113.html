<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

  <div class="question" id="questionText"></div>

<script>
/* QUESTIONS */
const questions = [
  {q:"The SI unit of electric current is",o:["Volt","Ohm","Ampere","Watt"],a:2},
  {q:"The flow of electric charge per unit time is called",o:["Potential","Resistance","Current","Conductance"],a:2},
  {q:"Ohm's law is valid only when ______ remains constant",o:["Current","Voltage","Temperature","Length"],a:2},
  {q:"The resistance of a conductor is inversely proportional to its",o:["Length","Area of cross-section","Temperature","Density"],a:1},
  {q:"The SI unit of resistivity is",o:["Ohm","Ohm-meter","Ohm/meter","Mho"],a:1},
  {q:"As temperature increases, the resistance of a semiconductor",o:["Increases","Decreases","Remains same","Becomes zero"],a:1},
  {q:"The drift velocity of electrons is of the order of",o:["10^8 m/s","10^-4 m/s","3 x 10^10 m/s","100 m/s"],a:1},
  {q:"Kirchhoff’s First Law (Junction Rule) is based on conservation of",o:["Energy","Momentum","Mass","Charge"],a:3},
  {q:"Kirchhoff’s Second Law (Loop Rule) is based on conservation of",o:["Charge","Energy","Power","Voltage"],a:1},
  {q:"A wire of resistance R is stretched to double its length. Its new resistance is",o:["2R","4R","R/2","R/4"],a:1},
  {q:"The reciprocal of resistance is called",o:["Resistivity","Conductance","Conductivity","Inductance"],a:1},
  {q:"In a Wheatstone bridge, the bridge is balanced when the current through galvanometer is",o:["Maximum","Minimum","Zero","Infinite"],a:2},
  {q:"The internal resistance of an ideal cell is",o:["Zero","Infinite","One","Variable"],a:0},
  {q:"Terminal potential difference of a cell is greater than its EMF when it is",o:["Discharging","Charging","Open circuit","Short circuited"],a:1},
  {q:"Which material is used for making standard resistors due to low temperature coefficient?",o:["Copper","Aluminum","Manganin","Silicon"],a:2},
  {q:"The power dissipated in a resistor is given by",o:["VI","I²R","V²/R","All of these"],a:3},
  {q:"Potentiometer is preferred over voltmeter for measuring EMF because",o:["It is cheaper","It draws no current from cell","It is more portable","It has high resistance"],a:1},
  {q:"The SI unit of electrical conductivity is",o:["Ohm-m","Siemen/meter","Volt/m","Ampere/m"],a:1},
  {q:"Three resistors of 2Ω, 4Ω, and 6Ω are in series. Total resistance is",o:["12Ω","1.2Ω","2Ω","0.5Ω"],a:0},
  {q:"If 'n' identical cells of EMF 'e' are connected in series, total EMF is",o:["e","e/n","ne","n²e"],a:2},
  {q:"The color code for a resistor with 5% tolerance is",o:["Gold","Silver","Red","Brown"],a:0},
  {q:"Electric energy is measured in",o:["Watt","Kilowatt-hour","Joule/second","Ampere-volt"],a:1},
  {q:"A cell of EMF 'E' and internal resistance 'r' is connected to external 'R'. Current is",o:["E/(R+r)","E/R","E/r","ER/r"],a:0},
  {q:"Drift velocity is proportional to",o:["Electric field (E)","E²","1/E","√E"],a:0},
  {q:"Mobility of charge carriers is defined as",o:["v_d / E","E / v_d","v_d * E","v_d² / E"],a:0},
  {q:"The resistance of a human body (dry) is roughly",o:["10 Ω","100 Ω","100,000 Ω","1 Ω"],a:2},
  {q:"Two bulbs 40W and 60W are in series. Which bulb glows brighter?",o:["40W","60W","Both same","Neither"],a:0},
  {q:"In a meter bridge, the wire is usually made of",o:["Copper","Constantan","Iron","Silver"],a:1},
  {q:"Superconductors have resistivity equal to",o:["Maximum","Infinity","Zero","Variable"],a:2},
  {q:"The potential gradient of a potentiometer wire increases if",o:["Current increases","Length increases","Wire radius increases","Current decreases"],a:0},
  {q:"The fuse wire should have",o:["High melting point","Low melting point","Zero resistance","Infinite length"],a:1},
  {q:"The heat produced in a conductor is proportional to",o:["Current","Square of current","Time","Both 1 & 2"],a:3},
  {q:"A high resistance connected in series with a galvanometer makes it a",o:["Ammeter","Voltmeter","Wattmeter","Ohmmeter"],a:1},
  {q:"To convert a galvanometer into an ammeter, we connect a",o:["High resistance in series","Low resistance in parallel","Low resistance in series","High resistance in parallel"],a:1},
  {q:"The relaxation time in a conductor ______ with increase in temperature",o:["Increases","Decreases","Remains constant","Fluctuates"],a:1}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 10`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 10 - score;
  const degree = (correct / 10) * 360;
localStorage.getItem("physics_chapter_3")
 
document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 10
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

      <button class="btn" onclick="location.reload()">Retake Test</button>
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>
