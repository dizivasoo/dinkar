<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>application of derivatives </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "The rate of change of the area of a circle with respect to its radius r at r = 6 cm is", o: ["12π (23%)", "10π (43%)", "8π (21%)", "11π (13%)"], a: 0},
  {q: "The total revenue in Rupees received from the sale of x units of a product is given by R(x) = 3x² + 36x + 5. The marginal revenue when x = 15 is", o: ["116 (23%)", "126 (43%)", "96 (21%)", "136 (13%)"], a: 1},
  {q: "The function f(x) = x² - 4x + 6 is strictly increasing in the interval", o: ["(-∞, 2) (23%)", "R (43%)", "(2, ∞) (21%)", "(-2, 2) (13%)"], a: 2},
  {q: "The slope of the tangent to the curve y = x³ - x at x = 2 is", o: ["12 (23%)", "10 (43%)", "13 (21%)", "11 (13%)"], a: 0},
  {q: "The line y = x + 1 is a tangent to the curve y² = 4x if the value of x is", o: ["0 (23%)", "2 (43%)", "3 (21%)", "1 (13%)"], a: 3},
  {q: "The maximum value of f(x) = sin x + cos x is", o: ["1 (23%)", "√2 (43%)", "2 (21%)", "1/√2 (13%)"], a: 1},
  {q: "The interval in which y = x² e⁻ˣ is increasing is", o: ["(0, 2) (23%)", "(-∞, ∞) (43%)", "(2, ∞) (21%)", "(-2, 0) (13%)"], a: 0},
  {q: "The slope of the normal to the curve y = 2x² + 3 sin x at x = 0 is", o: ["3 (23%)", "1/3 (43%)", "-1/3 (21%)", "-3 (13%)"], a: 2},
  {q: "If f(x) = x³ - 6x² + 9x + 15, then the local maximum value occurs at x =", o: ["1 (23%)", "3 (43%)", "2 (21%)", "0 (13%)"], a: 0},
  {q: "The point on the curve x² = 2y which is nearest to the point (0, 5) is", o: ["(2, 2) (23%)", "(0, 0) (43%)", "(2, 4) (21%)", "(2√2, 4) (13%)"], a: 3},
  {q: "The rate of change of volume of a sphere with respect to its surface area when radius is 2 cm is", o: ["2 (23%)", "3 (43%)", "1 (21%)", "4 (13%)"], a: 2},
  {q: "If the radius of a sphere is measured as 9 cm with an error of 0.03 cm, the error in volume is", o: ["1.24π (23%)", "9.72π (43%)", "3.24π (21%)", "5.12π (13%)"], a: 1},
  {q: "The function f(x) = tan x - x", o: ["Always increases (23%)", "Always decreases (43%)", "Increases in (-π/2, 0) (21%)", "Decreases in (0, π/2) (13%)"], a: 0},
  {q: "The curves y = eˣ and y = e⁻ˣ intersect at an angle", o: ["π/2 (23%)", "π/4 (43%)", "0 (21%)", "tan⁻¹(2) (13%)"], a: 3},
  {q: "A particle moves along the curve 6y = x³ + 2. The point at which y-coord changes 8 times as fast as x-coord is", o: ["(2, 2) (23%)", "(4, 11) (43%)", "(3, 5) (21%)", "(1, 1/2) (13%)"], a: 1},
  {q: "The normal to the curve x² = 4y passing through (1, 2) is", o: ["x + y = 3 (23%)", "x - y = 3 (43%)", "y - x = 3 (21%)", "x + y = 1 (13%)"], a: 0},
  {q: "The maximum value of [x(x-1)+1]^(1/3), 0 ≤ x ≤ 1 is", o: ["(1/3)^(1/3) (23%)", "0 (43%)", "(1/2)^(1/3) (21%)", "1 (13%)"], a: 3},
  {q: "The function f(x) = log(sin x) is strictly decreasing on", o: ["(0, π/2) (23%)", "(π/2, π) (43%)", "(0, π) (21%)", "(-π/2, π/2) (13%)"], a: 1},
  {q: "The minimum value of f(x) = 2x³ - 21x² + 36x - 20 is", o: ["-120 (23%)", "-126 (43%)", "-128 (21%)", "-130 (13%)"], a: 2},
  {q: "The angle of intersection of the curves y² = x and x² = y at (1, 1) is", o: ["tan⁻¹(3/4) (23%)", "tan⁻¹(1/2) (43%)", "π/2 (21%)", "π/4 (13%)"], a: 0},
  {q: "At what point on the curve y = x² does the tangent make an angle of 45° with x-axis?", o: ["(1, 1) (23%)", "(1/4, 1/16) (43%)", "(1/2, 1/4) (21%)", "(0, 0) (13%)"], a: 2},
  {q: "The least value of 'a' such that f(x) = x² + ax + 1 is strictly increasing on (1, 2) is", o: ["-2 (23%)", "1 (43%)", "2 (21%)", "-1 (13%)"], a: 0},
  {q: "The slope of the tangent to the curve x = t² + 3t - 8, y = 2t² - 2t - 5 at t = 2 is", o: ["6/7 (23%)", "7/6 (43%)", "1 (21%)", "2/3 (13%)"], a: 0},
  {q: "If the curves y = x² and xy = k cut at right angles, then 8k² is", o: ["2 (23%)", "3 (43%)", "4 (21%)", "1 (13%)"], a: 3},
  {q: "The function f(x) = x + 1/x (x ≠ 0) has a local maximum at x =", o: ["1 (23%)", "0 (43%)", "2 (21%)", "-1 (13%)"], a: 3},
  {q: "The absolute maximum value of f(x) = x³ on [-2, 2] is", o: ["8 (23%)", "4 (43%)", "2 (21%)", "0 (13%)"], a: 0},
  {q: "The area of a right-angled triangle of given hypotenuse is maximum when it is", o: ["Scalene (23%)", "Isosceles (43%)", "Equilateral (21%)", "None (13%)"], a: 1},
  {q: "If x + y = 10, the maximum value of xy is", o: ["25 (23%)", "20 (43%)", "24 (21%)", "10 (13%)"], a: 0},
  {q: "The slope of tangent to the curve y = ∫ (t²-1) dt from 0 to x, at x = 1 is", o: ["1 (23%)", "0 (43%)", "-1 (21%)", "2 (13%)"], a: 1},
  {q: "For the curve y = 5x - 2x³, if x increases at 2 units/sec, then at x = 3 the slope of curve changes at", o: ["-72 units/sec (23%)", "-36 units/sec (43%)", "-18 units/sec (21%)", "-54 units/sec (13%)"], a: 0},
  {q: "The distance 's' moved by a particle is s = t³ - 3t² + 2t. The velocity when acceleration is zero is", o: ["1 (23%)", "0 (43%)", "-1 (21%)", "2 (13%)"], a: 2},
  {q: "The normal to the curve x = a(cos θ + θ sin θ), y = a(sin θ - θ cos θ) is at constant distance from", o: ["Origin (23%)", "X-axis (43%)", "Y-axis (21%)", "The line y=x (13%)"], a: 0},
  {q: "The maximum value of (1/x)^x is", o: ["e (23%)", "e^e (43%)", "(1/e)^e (21%)", "e^(1/e) (13%)"], a: 3},
  {q: "The rate of change of area of a square is equal to the rate of change of its perimeter when side is", o: ["4 units (23%)", "2 units (43%)", "1 unit (21%)", "0.5 unit (13%)"], a: 1},
  {q: "If f(x) = kx - sin x is monotonically increasing, then", o: ["k < 1 (23%)", "k > 1 (43%)", "k < -1 (21%)", "k = 0 (13%)"], a: 1}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_5")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
