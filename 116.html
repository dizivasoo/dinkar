<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> alternating current </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"The peak value of AC voltage is 440V. Its RMS value is",o:["311V","440V","220V","622V"],a:0},
  {q:"In a purely inductive circuit, the phase difference between current and voltage is",o:["0","π","π/4","π/2"],a:3},
  {q:"The power factor of a purely resistive AC circuit is",o:["1","0","0.5","Infinity"],a:0},
  {q:"The unit of inductive reactance is",o:["Henry","Weber","Ohm","Tesla"],a:2},
  {q:"A capacitor blocks",o:["AC","Both AC and DC","Neither AC nor DC","DC"],a:3},
  {q:"In an LCR series circuit, resonance occurs when",o:["XL = XC","XL > XC","XL < XC","R = 0"],a:0},
  {q:"The average power dissipated in a pure inductor is",o:["VI","Zero","1/2 LI²","V²/R"],a:1},
  {q:"The ratio of RMS current to peak current is",o:["1/√2","√2","2","1/2"],a:0},
  {q:"A transformer is used to change the values of",o:["Voltage","Frequency","Power Factor","Resistance"],a:0},
  {q:"The frequency of AC mains in India is",o:["50 Hz","60 Hz","100 Hz","220 Hz"],a:0},
  {q:"To reduce eddy current loss, the core of a transformer is",o:["Solid","Laminated","Made of copper","None of these"],a:1},
  {q:"The impedance of an AC circuit containing only a resistor is",o:["R","√(R²+XL²)","XL","Zero"],a:0},
  {q:"In a series LCR circuit at resonance, the current is",o:["Maximum","Minimum","Zero","Infinite"],a:0},
  {q:"Which of the following has the unit 'second'?",o:["RC","R/L","1/LC","C/L"],a:0},
  {q:"The power factor of an LCR circuit at resonance is",o:["0","0.5","1","√3/2"],a:2},
  {q:"Wattless current flows in a circuit containing",o:["Pure resistor","Pure inductor","Both R and L","Both R and C"],a:1},
  {q:"The Q-factor of an LCR circuit is given by",o:["(1/R)√(L/C)","(1/L)√(R/C)","R√(L/C)","L√(R/C)"],a:0},
  {q:"A step-up transformer increases",o:["Current","Voltage","Power","Frequency"],a:1},
  {q:"The instantaneous value of AC is given by I = I₀ sin(ωt). The RMS value is",o:["I₀/√2","I₀/2","2I₀/π","I₀"],a:0},
  {q:"In a capacitive circuit, the current",o:["Lags voltage by π/2","Leads voltage by π/2","Is in phase","Lags voltage by π"],a:1},
  {q:"The core of a transformer is made of",o:["Steel","Alnico","Soft Iron","Copper"],a:2},
  {q:"The heat produced in a resistor by AC is independent of",o:["Current direction","Resistance","Time","Magnitude of current"],a:0},
  {q:"A choke coil is used to control",o:["DC","AC","Both","Neither"],a:1},
  {q:"If the frequency of AC increases, the capacitive reactance",o:["Increases","Decreases","Remains same","Becomes zero"],a:1},
  {q:"The physical quantity measured in Volt-Ampere is",o:["Resistance","Inductance","Apparent Power","Capacitance"],a:2},
  {q:"Which of the following does not use electromagnetic induction?",o:["Transformer","AC Generator","Room Heater","Choke Coil"],a:2},
  {q:"The phase difference between V and I in a purely resistive circuit is",o:["π/2","π","Zero","π/4"],a:2},
  {q:"At high frequencies, a capacitor acts as a",o:["Open circuit","Insulator","Conductor","Resistor"],a:2},
  {q:"The resonance frequency of LCR circuit is f. If L is doubled and C is halved, f will",o:["Be doubled","Be halved","Remain same","Increase 4 times"],a:2},
  {q:"The average value of AC over a complete cycle is",o:["I₀","I₀/√2","2I₀/π","Zero"],a:3},
  {q:"The sharpness of resonance depends on",o:["Resistance","Inductance","Capacitance","All of these"],a:0},
  {q:"In an AC circuit, the work done per cycle is",o:["Zero in pure L","Zero in pure C","Maximum in pure R","All of these"],a:3},
  {q:"Magnetic flux leakage in a transformer is reduced by",o:["Laminating core","Winding coils over each other","Using thick wires","Using soft iron"],a:1},
  {q:"The power factor varies between",o:["-1 to 1","0 to 1","0 to π","0 to Infinity"],a:1},
  {q:"Which is used to step down DC voltage?",o:["Transformer","Choke coil","Inductor","None of these"],a:3}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_6")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

      <button class="btn" onclick="location.reload()">Retake Test</button>
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
