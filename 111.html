<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>electric charges and fields</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"Electric charge is quantified in",o:["Coulomb","Ampere","Volt","Ohm"],a:0},
  {q:"Like charges",o:["Attract","Repel","Neutralize","Disappear"],a:1},
  {q:"SI unit of electric field is",o:["N/C","V","J/C","W"],a:0},
  {q:"Coulomb’s law depends on",o:["Charge","Distance","Medium","All"],a:3},
  {q:"Electric field inside conductor is",o:["Zero","Maximum","Infinite","Constant"],a:0},
  {q:"The charge on an electron is",o:["1.6 x 10^-19 C","-1.6 x 10^-19 C","1.6 x 10^-18 C","9.1 x 10^-31 C"],a:1},
  {q:"Electric field lines always start from",o:["Negative charge","Positive charge","Neutral point","Infinity"],a:1},
  {q:"The torque on a dipole is maximum when the angle with the field is",o:["0°","45°","90°","180°"],a:2},
  {q:"SI unit of electric flux is",o:["V/m","N/C","Nm²/C","C/m"],a:2},
  {q:"Gauss's Law is valid for",o:["Open surfaces","Any closed surface","Only spheres","Only cubes"],a:1},
  {q:"A glass rod rubbed with silk acquires",o:["Positive charge","Negative charge","No charge","Variable charge"],a:0},
  {q:"Direction of an electric dipole moment is",o:["Positive to negative","Negative to positive","Vertical","Circular"],a:1},
  {q:"If the distance between two charges is doubled, the force becomes",o:["Double","Half","Four times","One-fourth"],a:3},
  {q:"The net charge on an electric dipole is",o:["q","2q","Zero","-q"],a:2},
  {q:"Electric field due to a point charge 'q' at distance 'r' is proportional to",o:["r","1/r","r²","1/r²"],a:3},
  {q:"Quantization of charge is represented by the formula",o:["Q = I/t","Q = ne","Q = CV","Q = W/V"],a:1},
  {q:"The permittivity of free space ($\epsilon_0$) is",o:["8.854 x 10^-12","9 x 10^9","1.6 x 10^-19","1"],a:0},
  {q:"The force between two charges is 10N. If a dielectric of $K=2$ is inserted, the force is",o:["20N","10N","5N","2.5N"],a:2},
  {q:"Stable equilibrium of a dipole occurs when the angle is",o:["0°","90°","180°","270°"],a:0},
  {q:"Surface charge density is defined as",o:["Charge/Length","Charge/Area","Charge/Volume","Work/Charge"],a:1},
  {q:"Electric field at an axial point of a dipole is proportional to",o:["1/r","1/r²","1/r³","1/r⁴"],a:2},
  {q:"Which of the following cannot be the value of a charge?",o:["1.6 x 10^-19 C","3.2 x 10^-19 C","2.4 x 10^-19 C","4.8 x 10^-19 C"],a:2},
  {q:"Metal shields are used for protection against electric fields because of",o:["Earthing","Induction","Electrostatic Shielding","Polarization"],a:2},
  {q:"Number of electrons in 1 Coulomb of charge is",o:["6.25 x 10^18","1.6 x 10^19","6.25 x 10^17","1"],a:0},
  {q:"Electric field lines",o:["Form closed loops","Never intersect","Are scalar","Are always straight"],a:1},
  {q:"Linear charge density has the unit",o:["C/m","C/m²","C/m³","C"],a:0},
  {q:"Electric flux through a cube of side 'a' containing charge 'q' is",o:["q/$\epsilon_0$","q/6$\epsilon_0$","Zero","6q/$\epsilon_0$"],a:0},
  {q:"Work done in moving a charge on an equipotential surface is",o:["Positive","Negative","Zero","Infinite"],a:2},
  {q:"Dimension of electric charge is",o:["[M L T]","[A T]","[M L T A]","[A]"],a:1},
  {q:"Electric field due to a thin infinite plane sheet of charge is",o:["$\sigma/\epsilon_0$","$\sigma/2\epsilon_0$","Zero","2$\sigma/\epsilon_0$"],a:1},
  {q:"The dipole moment of a water molecule is",o:["Zero","Non-zero","Infinite","Negative"],a:1},
  {q:"Mass of a body decreases slightly when it is",o:["Negatively charged","Positively charged","Neutralized","Heated"],a:1},
  {q:"A soap bubble is given a negative charge. Its radius",o:["Decreases","Increases","Remains same","Vanishes"],a:1},
  {q:"The electric field at a very far point on the axis of a dipole is $E$. At the same distance on the equator, it is",o:["E","2E","E/2","E/4"],a:2},
  {q:"Force per unit charge is called",o:["Potential","Flux","Electric Field","Current"],a:2}
];



let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 10`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 10 - score;
  const degree = (correct / 10) * 360;
localStorage.getItem("physics_chapter_1")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

      <button class="btn" onclick="location.reload()">Retake Test</button>
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>


    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
