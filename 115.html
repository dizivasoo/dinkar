<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> matter and magnetism </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"The relation between relative permeability (μr) and susceptibility (χ) is", o:["μr = 1 - χ","μr = 1 + χ","μr = χ - 1","μr = 1/χ"], a:1}, // B
  {q:"At the magnetic equator, the angle of dip is", o:["0°","90°","45°","180°"], a:0}, // A
  {q:"Which of the following materials has the highest permeability?", o:["Diamagnetic","Paramagnetic","Ferromagnetic","Non-magnetic"], a:2}, // C
  {q:"The Curie temperature is the temperature above which", o:["A paramagnetic material becomes diamagnetic","A ferromagnetic material becomes paramagnetic","A ferromagnetic material becomes diamagnetic","A paramagnetic material becomes ferromagnetic"], a:1}, // B
  {q:"Soft iron is used to make electromagnets because it has", o:["Low retentivity and high coercivity","High retentivity and high coercivity","High retentivity and low coercivity","Low retentivity and low coercivity"], a:2}, // C
  {q:"The magnetic lines of force inside a bar magnet run from", o:["North to South","South to North","Side to Side","Center to Poles"], a:1}, // B
  {q:"The horizontal component of Earth's magnetic field is zero at", o:["Magnetic Equator","Geographic Equator","Magnetic Poles","45 degree latitude"], a:2}, // C
  {q:"Magnetic meridian is a", o:["Point","Line","Vertical plane","Horizontal plane"], a:2}, // C
  {q:"Which of the following is NOT an element of Earth's magnetic field?", o:["Magnetic Declination","Magnetic Inclination","Magnetic Flux","Horizontal Component"], a:2}, // C
  {q:"The SI unit of magnetic flux is", o:["Tesla","Weber","Gauss","Oersted"], a:1}, // B
  {q:"Permanent magnets are usually made of", o:["Soft iron","Copper","Steel (Alnico)","Aluminum"], a:2}, // C
  {q:"The sensitivity of a moving coil galvanometer can be increased by", o:["Decreasing the number of turns","Increasing the magnetic field","Decreasing the area of the coil","Increasing the spring constant"], a:1}, // B
  {q:"The work done in rotating a magnet of magnetic moment M in field B through 180° from the field direction is", o:["MB","Zero","2MB","1/2 MB"], a:2}, // C
  {q:"If a bar magnet is cut into two equal halves along its length, the pole strength", o:["Is doubled","Is halved","Remains same","Becomes zero"], a:1}, // B
  {q:"A circular loop of area A carries a current I. Its magnetic dipole moment is", o:["I/A","I²A","IA","I/A²"], a:2}, // C
  {q:"According to Gauss’s law in magnetism, the net magnetic flux through any closed surface is", o:["Positive","Negative","Zero","Infinite"], a:2}, // C
  {q:"Materials which are weakly repelled by magnets are called", o:["Ferromagnetic","Paramagnetic","Diamagnetic","Superconductors"], a:2}, // C
  {q:"The magnetic susceptibility of a vacuum is", o:["1","Infinity","Zero","-1"], a:2}, // C
  {q:"The SI unit of Magnetization (M) is", o:["Am²","A/m","Tesla","Weber/m"], a:1}, // B
  {q:"Which of the following is a diamagnetic substance?", o:["Iron","Aluminum","Water","Cobalt"], a:2}, // C
  {q:"The vertical component of Earth's magnetic field is maximum at", o:["Equator","Poles","45 degree latitude","None of these"], a:1}, // B
  {q:"Liquid oxygen is", o:["Diamagnetic","Paramagnetic","Ferromagnetic","Non-magnetic"], a:1}, // B
  {q:"The tendency of a magnetic material to retain its magnetism even after the removal of the external field is", o:["Coercivity","Retentivity","Permeability","Susceptibility"], a:1}, // B
  {q:"In a Hysteresis loop, the area represents", o:["Magnetic field","Magnetic flux","Energy loss per unit volume","Permeability"], a:2}, // C
  {q:"A superconductor exhibits perfect", o:["Paramagnetism","Diamagnetism","Ferromagnetism","Electromagnetism"], a:1}, // B
  {q:"Magnetic susceptibility of a paramagnetic material varies with temperature (T) as", o:["1/T²","1/T","T","T²"], a:1}, // B
  {q:"The force between two magnetic poles separated by a distance r follows", o:["Inverse square law","Inverse cube law","Direct square law","Linear law"], a:0}, // A
  {q:"The magnetic field lines form", o:["Closed loops","Open loops","Straight lines","Discontinuous curves"], a:0}, // A
  {q:"The neutral point is a point where the net magnetic field is", o:["Maximum","Minimum","Zero","Infinite"], a:2}, // C
  {q:"Steel is preferred for making permanent magnets over soft iron because it has", o:["High retentivity","High coercivity","Low coercivity","Low retentivity"], a:1}, // B
  {q:"The direction of magnetic moment is from", o:["South to North pole","North to South pole","East to West","West to East"], a:0}  // A
];
  

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_5")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

      <button class="btn" onclick="location.reload()">Retake Test</button>
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
