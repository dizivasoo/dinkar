<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>continuity and derivative  </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "The function f(x) = |x| is", o: ["Continuous but not differentiable at x=0 (11%)", "Discontinuous at x=0 (32%)", "Differentiable at x=0 (32%)", "None of these (25%)"], a: 0},
  {q: "If f(x) = sin(x²), then f'(x) is", o: ["cos(x²) (11%)", "2x cos(x²) (32%)", "2x sin(x²) (32%)", "-2x cos(x²) (25%)"], a: 1},
  {q: "A function f is continuous at x = c if lim (x→c) f(x) is equal to", o: ["f(0) (11%)", "f(c) (32%)", "1 (32%)", "0 (25%)"], a: 1},
  {q: "The derivative of cos⁻¹(x) with respect to x is", o: ["1/√(1-x²) (11%)", "1/(1+x²) (32%)", "-1/√(1-x²) (32%)", "-1/(1+x²) (25%)"], a: 2},
  {q: "If y = log(sin x), then dy/dx is", o: ["tan x (11%)", "sec x (32%)", "cot x (32%)", "cosec x (25%)"], a: 2},
  {q: "The function f(x) = [x] (greatest integer function) is discontinuous at", o: ["x = 0.5 (11%)", "All real numbers (32%)", "All integers (32%)", "Only x = 0 (25%)"], a: 2},
  {q: "If f(x) = eˣ, then f'''(x) is", o: ["eˣ (11%)", "3eˣ (32%)", "e³ˣ (32%)", "x³eˣ (25%)"], a: 0},
  {q: "Derivative of log(log x) with respect to x is", o: ["1/x (11%)", "1/(x log x) (32%)", "1/log x (32%)", "(log x)/x (25%)"], a: 1},
  {q: "If x = a cos θ, y = a sin θ, then dy/dx is", o: ["tan θ (11%)", "-cot θ (32%)", "cot θ (32%)", "-tan θ (25%)"], a: 1},
  {q: "If y = tan⁻¹x, then d²y/dx² is", o: ["1/(1+x²) (11%)", "-2x/(1+x²) (32%)", "-2x/(1+x²)² (32%)", "2x/(1+x²)² (25%)"], a: 2},
  {q: "The derivative of e^(sin x) is", o: ["e^(sin x) (11%)", "cos x · e^(sin x) (32%)", "sin x · e^(cos x) (32%)", "e^(cos x) (25%)"], a: 1},
  {q: "If f(x) = kx + 1 is continuous at x=5, and f(5) = 21, then k is", o: ["3 (11%)", "5 (32%)", "4 (32%)", "2 (25%)"], a: 2},
  {q: "The derivative of √x is", o: ["1/x (11%)", "1/(2√x) (32%)", "2√x (32%)", "x/2 (25%)"], a: 1},
  {q: "If y = xˣ, then dy/dx is", o: ["x·xˣ⁻¹ (11%)", "xˣ(1 + log x) (32%)", "xˣ log x (32%)", "1 + log x (25%)"], a: 1},
  {q: "Every differentiable function is", o: ["Always continuous (11%)", "Sometimes continuous (32%)", "Always discontinuous (32%)", "None of these (25%)"], a: 0},
  {q: "The derivative of sin⁻¹(2x√(1-x²)) is", o: ["2/√(1-x²) (11%)", "1/√(1-x²) (32%)", "2/√(1-x²) (32%)", "None (25%)"], a: 2},
  {q: "If f(x) = |x - 1|, then f'(1) is", o: ["1 (11%)", "-1 (32%)", "Does not exist (32%)", "0 (25%)"], a: 2},
  {q: "If y = sin⁻¹x + cos⁻¹x, then dy/dx is", o: ["π/2 (11%)", "1 (32%)", "0 (32%)", "-1 (25%)"], a: 2},
  {q: "The derivative of a constant function is", o: ["The constant itself (11%)", "0 (32%)", "1 (32%)", "Not defined (25%)"], a: 1},
  {q: "If y = 2^x, then dy/dx is", o: ["x · 2ˣ⁻¹ (11%)", "2ˣ log 2 (32%)", "2ˣ (32%)", "log 2 (25%)"], a: 1},
  {q: "The derivative of tan x is", o: ["sec x (11%)", "sec² x (32%)", "cot x (32%)", "-sec² x (25%)"], a: 1},
  {q: "Which of the following functions is not differentiable at x = 0?", o: ["x² (11%)", "eˣ (32%)", "sin x (32%)", "x^(1/3) (25%)"], a: 3},
  {q: "If y = log(x²), then dy/dx is", o: ["1/x² (11%)", "2/x (32%)", "2/x (32%)", "x/2 (25%)"], a: 2},
  {q: "If f(x) = 2x, then the derivative of f⁻¹(x) is", o: ["2 (11%)", "1/2 (32%)", "1/2 (32%)", "x (25%)"], a: 2},
  {q: "The function f(x) = sin |x| is differentiable at", o: ["x = 0 (11%)", "x = π (32%)", "x = π (32%)", "All real x (25%)"], a: 2},
  {q: "If y = cos(sin x), then dy/dx is", o: ["-sin(sin x) (11%)", "-sin(sin x) · cos x (32%)", "cos(cos x) (32%)", "sin(cos x) (25%)"], a: 1},
  {q: "Rolle's Theorem is applicable for f(x) = x² in [-1, 1] because", o: ["f(-1) = f(1) (11%)", "f(x) is polynomial (32%)", "f(x) is polynomial (32%)", "All of these (25%)"], a: 3},
  {q: "Mean Value Theorem states there exists 'c' such that f'(c) =", o: ["0 (11%)", "(f(b)-f(a))/(b-a) (32%)", "(f(b)-f(a))/(b-a) (32%)", "f(b)-f(a) (25%)"], a: 2},
  {q: "Derivative of log₁₀ x is", o: ["1/x (11%)", "1/(x log₁₀ e) (32%)", "1/(x logₑ 10) (32%)", "log₁₀ x (25%)"], a: 2},
  {q: "If y = aˣ, then d²y/dx² is", o: ["aˣ (11%)", "aˣ (log a)² (32%)", "aˣ log a (32%)", "x aˣ⁻¹ (25%)"], a: 1},
  {q: "Derivative of e^x³ is", o: ["e^x³ (11%)", "3x² e^x³ (32%)", "x³ e^x² (32%)", "3x e^x³ (25%)"], a: 1},
  {q: "If y = √(sin x), then dy/dx is", o: ["cos x / √(sin x) (11%)", "cos x / (2√(sin x)) (32%)", "1 / (2√(sin x)) (32%)", "-cos x / (2√(sin x)) (25%)"], a: 1},
  {q: "The derivative of |x|³ at x = 0 is", o: ["3 (11%)", "0 (32%)", "0 (32%)", "Does not exist (25%)"], a: 2},
  {q: "If f(x) = x|x|, then f'(0) is", o: ["0 (11%)", "1 (32%)", "1 (32%)", "Does not exist (25%)"], a: 3},
  {q: "If y = 5 cos x - 3 sin x, then d²y/dx² is", o: ["-y (11%)", "y (32%)", "-y (32%)", "0 (25%)"], a: 2},
  {q: "If f(x) = sin x, then f(x) is differentiable", o: ["Everywhere (11%)", "Only at 0 (32%)", "Everywhere (32%)", "Except at integers (25%)"], a: 2},
  {q: "If f(x) = (x+1) tan⁻¹(e⁻²ˣ), then f'(0) is", o: ["-1 (11%)", "π/4 - 1 (32%)", "π/4 - 1 (32%)", "π/2 (25%)"], a: 2}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_14")

  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

  
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
