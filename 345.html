<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>  matrics </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "If a matrix has 8 elements, what are the possible orders it can have?", o: ["4 (25%)", "3 (30%)", "2 (15%)", "5 (30%)"], a: 0},
  {q: "A matrix A = [aij]m×n is a square matrix if", o: ["m < n (25%)", "m = n (30%)", "m > n (15%)", "m = 1 (30%)"], a: 1},
  {q: "The total number of all possible matrices of order 3 × 3 with each entry 0 or 1 is", o: ["27 (25%)", "18 (30%)", "81 (15%)", "512 (30%)"], a: 3},
  {q: "If A and B are symmetric matrices of the same order, then AB – BA is a", o: ["Skew symmetric matrix (25%)", "Symmetric matrix (30%)", "Zero matrix (15%)", "Identity matrix (30%)"], a: 0},
  {q: "If A is a square matrix such that A² = A, then (I + A)³ – 7A is equal to", o: ["A (25%)", "I (30%)", "I - A (15%)", "3A (30%)"], a: 1},
  {q: "If A = [cos α  -sin α; sin α  cos α], and A + A' = I, then the value of α is", o: ["π/6 (25%)", "π/3 (30%)", "π (15%)", "3π/2 (30%)"], a: 1},
  {q: "Matrices A and B will be inverse of each other only if", o: ["AB = BA (25%)", "AB = BA = 0 (30%)", "AB = 0, BA = I (15%)", "AB = BA = I (30%)"], a: 3},
  {q: "If A is a matrix of order m × n and B is a matrix such that AB' and B'A are both defined, then order of matrix B is", o: ["m × n (25%)", "n × m (30%)", "n × n (15%)", "m × m (30%)"], a: 0},
  {q: "If A is a square matrix, then A + A' is always a", o: ["Identity matrix (25%)", "Symmetric matrix (30%)", "Skew-symmetric matrix (15%)", "Diagonal matrix (30%)"], a: 1},
  {q: "The number of arbitrary constants in a scalar matrix of order n × n is", o: ["n (25%)", "1 (30%)", "n² (15%)", "0 (30%)"], a: 1},
  {q: "If A = [0 2; 3 -4] and kA = [0 3a; 2b 24], then the values of k, a, b are", o: ["-6, -4, -9 (25%)", "-6, 4, 9 (30%)", "-6, -4, 9 (15%)", "6, 4, 9 (30%)"], a: 2},
  {q: "If A and B are square matrices of the same order, then (AB)' is equal to", o: ["A'B' (25%)", "B'A' (30%)", "AB' (15%)", "BA' (30%)"], a: 1},
  {q: "A diagonal matrix in which all diagonal elements are equal is called a", o: ["Unit matrix (25%)", "Scalar matrix (30%)", "Null matrix (15%)", "Square matrix (30%)"], a: 1},
  {q: "If A is skew-symmetric matrix, then A' is equal to", o: ["A (25%)", "I (30%)", "-A (15%)", "0 (30%)"], a: 2},
  {q: "If A = [1 2 3], then the order of matrix A is", o: ["3 × 1 (25%)", "1 × 3 (30%)", "1 × 1 (15%)", "3 × 3 (30%)"], a: 1},
  {q: "The elements of the main diagonal of a skew-symmetric matrix are all", o: ["1 (25%)", "Zero (30%)", "Different (15%)", "Negative (30%)"], a: 1},
  {q: "If A is a 2 × 3 matrix and B is a 3 × 4 matrix, the order of AB is", o: ["2 × 4 (25%)", "4 × 2 (30%)", "3 × 3 (15%)", "2 × 3 (30%)"], a: 0},
  {q: "For any square matrix A with real number entries, A - A' is a", o: ["Symmetric matrix (25%)", "Diagonal matrix (30%)", "Skew-symmetric matrix (15%)", "Scalar matrix (30%)"], a: 2},
  {q: "If A = [1 0; 0 1], then A⁴ is", o: ["I (25%)", "4I (30%)", "0 (15%)", "A² (30%)"], a: 0},
  {q: "If A and B are symmetric matrices, then AB is symmetric if and only if", o: ["AB = BA (25%)", "A + B = 0 (30%)", "AB = 0 (15%)", "A = B (30%)"], a: 0},
  {q: "A square matrix A is called idempotent if", o: ["A² = I (25%)", "A² = 0 (30%)", "A² = A (15%)", "A' = A (30%)"], a: 2},
  {q: "In a lower triangular matrix A = [aij]n×n, aij = 0 when", o: ["i > j (25%)", "i < j (30%)", "i = j (15%)", "i + j = n (30%)"], a: 1},
  {q: "If A = [1 2; 3 4], then A + A' is", o: ["Symmetric (25%)", "Skew-symmetric (30%)", "Zero (15%)", "Identity (30%)"], a: 0},
  {q: "If matrix A is both symmetric and skew-symmetric, then A is a", o: ["Scalar matrix (25%)", "Diagonal matrix (30%)", "Zero matrix (15%)", "Unit matrix (30%)"], a: 2},
  {q: "The product of a non-zero matrix A and its transpose A' is always", o: ["Symmetric (25%)", "Skew-symmetric (30%)", "Identity (15%)", "Singular (30%)"], a: 0},
  {q: "If A is a square matrix of order 3 and |A| = 5, then |3A| is", o: ["15 (25%)", "135 (30%)", "45 (15%)", "75 (30%)"], a: 1},
  {q: "If A = [λ 1; 0 1] and B = [4 1; 0 1] and A² = B, then λ is", o: ["2 (25%)", "-2 (30%)", "±2 (15%)", "No real value (30%)"], a: 3},
  {q: "Two matrices are said to be equal if they have the same", o: ["Order (25%)", "Order and corresponding elements (30%)", "Number of elements (15%)", "Determinant (30%)"], a: 1},
  {q: "If A is an m × n matrix, then kA is a matrix of order", o: ["m × n (25%)", "km × n (30%)", "m × kn (15%)", "k²(m × n) (30%)"], a: 0},
  {q: "Transpose of a column matrix is a", o: ["Column matrix (25%)", "Row matrix (30%)", "Square matrix (15%)", "Zero matrix (30%)"], a: 1},
  {q: "The inverse of a diagonal matrix is a", o: ["Scalar matrix (25%)", "Zero matrix (30%)", "Diagonal matrix (15%)", "Row matrix (30%)"], a: 2},
  {q: "If A is a symmetric matrix, then Aⁿ (where n is a positive integer) is", o: ["Symmetric (25%)", "Skew-symmetric (30%)", "Diagonal (15%)", "None (30%)"], a: 0},
  {q: "If A is a square matrix of order n, then kA = [bij] where bij is", o: ["k + aij (25%)", "k * aij (30%)", "aij/k (15%)", "k² * aij (30%)"], a: 1},
  {q: "If A is an orthogonal matrix, then |A| is", o: ["0 (25%)", "±1 (30%)", "Any real number (15%)", "2 (30%)"], a: 1},
  {q: "If A = [1 1; 1 1], then A² is", o: ["A (25%)", "2A (30%)", "4A (15%)", "I (30%)"], a: 1}
];
let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_13")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>


<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
