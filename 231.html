<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Haloalkanes & Haloarenes</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 /35 </div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"Which of the following is a primary halide?",o:["Isopropyl chloride","sec-Butyl chloride","neopentyl chloride","tert-Butyl chloride"],a:2},
  {q:"The IUPAC name of CH3CH(Cl)CH3 is:",o:["2-Chloropropane","1-Chloropropane","Isopropyl chloride","Chloropropene"],a:0},
  {q:"Which of the following has the highest boiling point?",o:["n-Butyl chloride","Isobutyl chloride","tert-Butyl chloride","sec-Butyl chloride"],a:0},
  {q:"Haloalkanes are more reactive than haloarenes towards nucleophilic substitution due to:",o:["Resonance effect","sp2 hybridisation","Partial double bond character","Steric hindrance"],a:0},
  {q:"The conversion of an alkyl halide into an alcohol is a:",o:["Substitution reaction","Addition reaction","Elimination reaction","Dehydrohalogenation"],a:0},
  {q:"Which of the following will undergo SN1 reaction fastest?",o:["tert-Butyl bromide","n-Butyl bromide","sec-Butyl bromide","Isobutyl bromide"],a:0},
  {q:"The reaction of methyl bromide with silver fluoride to give methyl fluoride is called:",o:["Swarts reaction","Finkelstein reaction","Wurtz reaction","Sandmeyer reaction"],a:0},
  {q:"Alkyl iodides are often prepared by the reaction of alkyl chlorides/bromides with NaI in acetone. This is:",o:["Finkelstein reaction","Swarts reaction","Etard reaction","Wurtz reaction"],a:0},
  {q:"In SN2 reactions, the order of reactivity of halides is:",o:["CH3X > 1° > 2° > 3°","3° > 2° > 1° > CH3X","1° > 3° > 2° > CH3X","All react at same rate"],a:0},
  {q:"Phosgene is a common name for:",o:["Carbonyl chloride","Phosphine","Phosphorus trichloride","Carbon tetrachloride"],a:0},
  {q:"Which of the following is an example of a gem-dihalide?",o:["1,2-Dichloroethane","Ethylidene chloride","Ethylene dichloride","Allyl chloride"],a:1},
  {q:"Reaction of ethyl chloride with aqueous KOH gives:",o:["Ethene","Ethanol","Ethane","Ethyl alcohol"],a:1},
  {q:"A chiral molecule is one which is:",o:["Symmetrical","Non-superimposable on its mirror image","Planar","Superimposable on its mirror image"],a:1},
  {q:"The reaction: 2RX + 2Na -> R-R + 2NaX is:",o:["Fittig reaction","Wurtz reaction","Frankland reaction","Sandmeyer reaction"],a:1},
  {q:"Which reagent is used in the Sandmeyer reaction?",o:["Cu2Cl2 / HCl","Cu powder / HCl","AgF / H2O","NaI / Acetone"],a:1},
  {q:"The nature of C-X bond in haloalkanes is:",o:["Non-polar","Polar covalent","Ionic","Purely covalent"],a:1},
  {q:"Chloroform is stored in dark colored bottles because:",o:["It is volatile","It oxidizes to poisonous Phosgene","It reacts with glass","It evaporates easily"],a:1},
  {q:"Ambident nucleophiles like KCN react with alkyl halides to primarily form:",o:["Isocyanides","Nitrites","Alkyl cyanides","Nitroalkanes"],a:2},
  {q:"The catalyst used in the Friedel-Crafts alkylation of benzene is:",o:["Anhydrous AlCl3","FeCl3","Conc. H2SO4","ZnCl2"],a:0},
  {q:"Which compound is used as a refrigerant (Freon)?",o:["CF2Cl2","CHCl3","CH2Cl2","CCl4"],a:0},
  {q:"Optical isomerism is shown by:",o:["2-Chlorobutane","1-Chlorobutane","n-Butyl chloride","2-Chloropropane"],a:0},
  {q:"SN2 reaction proceeds with:",o:["Racemisation","Retention of configuration","Inversion of configuration","None of these"],a:2},
  {q:"Which of the following is a polyhalogen compound?",o:["Vinyl chloride","Isopropyl chloride","Carbon tetrachloride","Ethyl bromide"],a:2},
  {q:"The major product of the reaction between 2-bromobutane and alcoholic KOH is:",o:["1-Butene","2-Butanol","2-Butene","Butane"],a:2},
  {q:"DDT is prepared by the reaction of chlorobenzene with:",o:["Chloral","Chloroform","Carbon tetrachloride","Chlorine"],a:0},
  {q:"Reaction of chlorobenzene with sodium in dry ether to give diphenyl is:",o:["Wurtz reaction","Wurtz-Fittig reaction","Fittig reaction","Sandmeyer reaction"],a:2},
  {q:"Which has the highest dipole moment?",o:["CH3Cl","CH3F","CH3Br","CH3I"],a:0},
  {q:"Grignard reagent is prepared by the reaction of alkyl halide with:",o:["Sodium","Zinc","Magnesium","Calcium"],a:2},
  {q:"Alkyl halides are insoluble in water because:",o:["They are non-polar","They cannot form hydrogen bonds","They are lighter than water","They form a separate layer"],a:1},
  {q:"Identify the allylic halide among the following:",o:["3-Chloroprop-1-ene","Chlorobenzene","1-Chloropropene","2-Chloropropane"],a:0},
  {q:"The commercial name of CCl4 is:",o:["Pyrene","Freon","Teflon","Chloral"],a:3},
  {q:"Which of the following is used in fire extinguishers?",o:["Chloroform","Iodoform","Freon","Pyrene (CCl4)"],a:3},
  {q:"Pure chloroform can be tested by:",o:["AgNO3 solution","FeCl3 solution","Schiff's reagent","Benedict's solution"],a:0},
  {q:"The major product formed when ethyl bromide reacts with AgCN is:",o:["Ethyl cyanide","Ethyl bromide","Ethyl alcohol","Ethyl isocyanide"],a:3},
  {q:"Which halide will be most reactive towards SN1?",o:["Benzyl chloride","Vinyl chloride","Chlorobenzene","Ethyl chloride"],a:0}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_10")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
