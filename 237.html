<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> chemistry in everyday life </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"Which of the following is an analgesic?",o:["Aspirin","Penicillin","Chloramphenicol","Quinine"],a:0},
  {q:"Drugs that bind to the receptor site and inhibit its natural function are called:",o:["Antagonists","Agonists","Target molecules","Enzymes"],a:0},
  {q:"Aspirin is chemically:",o:["Acetylsalicylic acid","Methyl salicylate","Ethyl salicylate","Salicylic acid"],a:0},
  {q:"Which of the following is a narrow spectrum antibiotic?",o:["Penicillin G","Ampicillin","Amoxicillin","Chloramphenicol"],a:0},
  {q:"The drug used to reduce fever is called:",o:["Antipyretic","Analgesic","Antibiotic","Tranquilizer"],a:0},
  {q:"Which of the following is used as a morning-after pill?",o:["Mifepristone","Ethinylestradiol","Norethindrone","Bithionol"],a:0},
  {q:"Salvarsan was first used for the treatment of:",o:["Syphilis","Typhoid","Malaria","Cholera"],a:0},
  {q:"Which of the following is a tranquilizer?",o:["Equanil","Paracetamol","Morphine","Bithionol"],a:0},
  {q:"The chemical used to kill or prevent the growth of microorganisms on living tissues is:",o:["Antiseptic","Disinfectant","Antibiotic","Analgesic"],a:0},
  {q:"Tincture of iodine is:",o:["2-3% solution of iodine in alcohol-water","Solution of iodoform","Solution of iodine in KI","Liquid iodine"],a:0},
  {q:"Which of the following is a cationic detergent?",o:["Cetyltrimethylammonium bromide","Sodium dodecylbenzene sulphonate","Sodium lauryl sulphate","Glyceryl oleate"],a:0},
  {q:"Artificial sweetener that is stable only under cold conditions is:",o:["Aspartame","Alitame","Saccharin","Sucralose"],a:0},
  {q:"Which of the following is used as an antioxidant in food?",o:["BHA (Butylated Hydroxy Anisole)","Saccharin","Sucralose","Soap"],a:0},
  {q:"Bithionol is added to soap to impart:",o:["Antiseptic properties","Color","Fragrance","Softness"],a:1},
  {q:"Which of the following is a non-narcotic analgesic?",o:["Paracetamol","Morphine","Heroin","Codeine"],a:1},
  {q:"The sweetener that has the highest sweetness value is:",o:["Alitame","Saccharin","Aspartame","Sucralose"],a:1},
  {q:"A 0.2 percent solution of phenol acts as a/an:",o:["Antiseptic","Disinfectant","Anesthetic","Antibiotic"],a:1},
  {q:"Which part of the soap molecule is 'hydrophilic'?",o:["The ionic head","The hydrocarbon tail","The whole molecule","None of these"],a:1},
  {q:"Saponification involves the hydrolysis of fats/oils by:",o:["NaOH","HCl","Water","Alcohol"],a:1},
  {q:"Which of the following is a broad spectrum antibiotic?",o:["Chloramphenicol","Penicillin G","Phenelzine","Terpineol"],a:0},
  {q:"Polyethylene glycols are used in the preparation of which type of detergents?",o:["Non-ionic","Cationic","Anionic","Soaps"],a:0},
  {q:"A medicine which promotes the secretion of urine is called:",o:["Diuretic","Antipyretic","Analgesic","Sedative"],a:2},
  {q:"Which of the following is an example of an antacid?",o:["Ranitidine","Brompheniramine","Seldane","Codeine"],a:2},
  {q:"Which gas is responsible for the 'puffed-up' appearance of dough in baking?",o:["CO2","O2","SO2","NO2"],a:2},
  {q:"Iodoform is used as a/an:",o:["Antiseptic","Antipyretic","Tranquilizer","Anaesthetic"],a:0},
  {q:"Dettol is a mixture of:",o:["Chloroxylenol and Terpineol","Phenol and Iodine","Alcohol and Water","Bithionol and Soap"],a:3},
  {q:"Which of the following is a neutral detergent?",o:["Liquid dishwashers","Toothpaste","Hair conditioners","Laundry soap"],a:3},
  {q:"Which of the following substances is used as a food preservative?",o:["Sodium benzoate","Sodium chloride","Sugar","All of these"],a:3},
  {q:"The function of glycerol in shaving soap is:",o:["To prevent rapid drying","To increase lather","To impart scent","To kill germs"],a:3},
  {q:"Synthetic detergents are better than soaps because:",o:["They work in hard water","They are biodegradable","They are cheaper","They are natural"],a:3},
  {q:"The site where the substrate binds to the enzyme is called:",o:["Active site","Allosteric site","Inhibitor site","Passive site"],a:3},
  {q:"Which of the following is used to treat acidity by blocking histamine receptors?",o:["Cimetidine","Aspirin","Valium","Veronal"],a:3},
  {q:"Which of the following is a narcotic analgesic?",o:["Morphine","Naproxen","Ibuprofen","Diclofenac"],a:3},
  {q:"Non-biodegradable detergents contain:",o:["Highly branched hydrocarbon chains","Straight hydrocarbon chains","Aromatic rings only","No hydrocarbon chains"],a:3},
  {q:"Hard water does not form lather with soap due to the presence of:",o:["Calcium and Magnesium ions","Sodium and Potassium ions","Iron and Copper ions","Chloride and Nitrate ions"],a:3}
];
let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_14")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

     
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
