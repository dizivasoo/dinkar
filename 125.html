<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> coomunication system </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">

</audio>

<audio id="wrongSound">

</audio>

<script>
/* QUESTIONS */
const questions = [
  { q: "The range of frequencies used for speech signals in telephony is:", o: ["10 kHz to 20 kHz", "300 Hz to 3100 Hz", "5 MHz to 10 MHz", "1 GHz to 2 GHz"], a: 1 },
  { q: "Which of the following layers of atmosphere is crucial for sky wave propagation?", o: ["Troposphere", "Stratosphere", "Ionosphere", "Mesosphere"], a: 2 },
  { q: "The process of superimposing a low-frequency signal on a high-frequency carrier is:", o: ["Demodulation", "Modulation", "Attenuation", "Amplification"], a: 1 },
  { q: "In a communication system, noise most likely affects the signal in the:", o: ["Transmitter", "Receiver", "Channel", "Source"], a: 2 },
  { q: "A device that converts sound energy into electrical energy is a:", o: ["Loudspeaker", "Transducer (Microphone)", "Amplifier", "Antenna"], a: 1 },
  { q: "The maximum distance up to which a TV transmission can be received depends on:", o: ["Height of antenna", "Power of transmitter", "Both A and B", "None of these"], a: 2 },
  { q: "Which frequency range is generally used for satellite communication?", o: ["30 to 300 kHz", "3 to 30 MHz", "3 to 30 GHz", "100 to 200 Hz"], a: 2 },
  { q: "Ground wave propagation is effective for frequencies:", o: ["Less than 2 MHz", "Greater than 30 MHz", "Exactly 100 MHz", "Above 1 GHz"], a: 0 },
  { q: "The modulation index 'm' for an AM wave is kept such that:", o: ["m > 1", "m = 0", "0 < m <= 1", "m = infinity"], a: 2 },
  { q: "Which mode of propagation is used for line-of-sight (LOS) communication?", o: ["Sky wave", "Space wave", "Ground wave", "Surface wave"], a: 1 },
  { q: "Optical fiber communication works on the principle of:", o: ["Reflection", "Refraction", "Total Internal Reflection", "Scattering"], a: 2 },
  { q: "The loss of strength of a signal while propagating through a medium is called:", o: ["Distortion", "Attenuation", "Noise", "Reception"], a: 1 },
  { q: "A repeater is a combination of:", o: ["Filter and Mixer", "Receiver and Transmitter", "Amplifier and Attenuator", "Modulator and Demodulator"], a: 1 },
  { q: "In Frequency Modulation (FM):", o: ["Amplitude varies", "Phase varies", "Frequency varies with signal", "Everything is constant"], a: 2 },
  { q: "The bandwidth of a video signal is approximately:", o: ["20 kHz", "4.2 MHz", "100 MHz", "2 GHz"], a: 1 },
  { q: "Digital signals are usually:", o: ["Continuous", "Discrete", "Random", "None of these"], a: 1 },
  { q: "Sky wave propagation is NOT possible for frequencies above 30 MHz because:", o: ["Waves are absorbed", "Ionosphere cannot reflect them", "Antenna size becomes too large", "Earth's curvature prevents it"], a: 1 },
  { q: "The height of a TV tower is 100m. The coverage range is (R=6400km):", o: ["~36 km", "~50 km", "~64 km", "~100 km"], a: 0 },
  { q: "Which device is used to increase the power of a transmitted signal?", o: ["Rectifier", "Amplifier", "Transducer", "Detector"], a: 1 },
  { q: "FAX is used for the transmission of:", o: ["Live video", "Voice only", "Static documents/images", "Only binary numbers"], a: 2 },
  { q: "The range of a signal can be increased by using:", o: ["Low frequency", "High power transmitter", "Repeaters", "Both B and C"], a: 2 },
  { q: "An antenna acts as a:", o: ["Resistor", "Transducer", "Capacitor", "Inductor"], a: 1 },
  { q: "The wavelength of a 100 MHz electromagnetic wave is:", o: ["0.3 m", "3 m", "30 m", "300 m"], a: 1 },
  { q: "Modulation is necessary for:", o: ["Short antenna length", "High power transmission", "Reduced interference", "All of the above"], a: 2 },
  { q: "A modem is a device used for:", o: ["Modulation only", "Demodulation only", "Both Modulation/Demodulation", "Encryption"], a: 2 },
  { q: "Which of the following is an example of point-to-point communication?", o: ["Radio", "Television", "Telephony", "Public address system"], a: 2 },
  { q: "The core of an optical fiber has a refractive index that is:", o: ["Lower than cladding", "Higher than cladding", "Same as cladding", "Zero"], a: 1 },
  { q: "In AM, the bandwidth is equal to:", o: ["fm", "2 * fm", "3 * fm", "fm / 2"], a: 1 },
  { q: "The critical frequency for a layer in the ionosphere depends on:", o: ["Transmitter power", "Antenna height", "Electron density", "Distance from tower"], a: 2 },
  { q: "Which is a 'Broadcast' type communication?", o: ["Mobile phone", "Walkie-talkie", "Radio transmission", "Email"], a: 2 },
  { q: "The 'length' of a dipole antenna is ideally:", o: ["lambda", "lambda / 2", "lambda / 4", "2 * lambda"], a: 1 },
  { q: "A signal $A \sin(\omega t)$ is a:", o: ["Digital signal", "Analog signal", "Pulse signal", "Noise signal"], a: 1 },
  { q: "Frequencies in the UHF range normally propagate by means of:", o: ["Ground waves", "Sky waves", "Space waves", "Surface waves"], a: 2 },
  { q: "The process of extracting information from a modulated carrier is:", o: ["Transduction", "Modulation", "Demodulation", "Rectification"], a: 2 },
  { q: "Information in a communication system can be:", o: ["Analog only", "Digital only", "Both Analog and Digital", "None of these"], a: 2 }
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_15")

  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>
