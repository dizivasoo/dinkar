<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual nature of radiation and matter </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"The minimum energy required to remove an electron from a metal surface is called", o:["Work function", "Binding energy", "Ionization energy", "Threshold energy"], a:0},
  {q:"The phenomenon of photoelectric effect was explained by Einstein using", o:["Wave theory", "Quantum theory", "Electromagnetic theory", "Special relativity"], a:1},
  {q:"The maximum kinetic energy of photoelectrons depends upon the", o:["Frequency of incident light", "Intensity of incident light", "Time of exposure", "Velocity of source"], a:0},
  {q:"If the frequency of incident light is less than threshold frequency, then", o:["Electrons are emitted with low speed", "Photocurrent is maximum", "No photoelectrons are emitted", "Saturation current increases"], a:2},
  {q:"According to de-Broglie, the wavelength associated with a particle of mass m and velocity v is", o:["h/mv", "hmv", "mv/h", "h/m²v"], a:0},
  {q:"The stopping potential in a photoelectric experiment is a measure of", o:["Maximum kinetic energy", "Average kinetic energy", "Minimum kinetic energy", "Total energy"], a:0},
  {q:"The slope of the graph between stopping potential and frequency of incident radiation is", o:["h/e", "e/h", "h", "e"], a:0},
  {q:"In the photoelectric effect, the number of photoelectrons emitted per second is proportional to", o:["Intensity of incident radiation", "Frequency of incident radiation", "Wavelength of incident radiation", "Work function of the metal"], a:0},
  {q:"Davisson-Germer experiment demonstrated the", o:["Particle nature of light", "Wave nature of electrons", "Particle nature of electrons", "Transverse nature of light"], a:1},
  {q:"A photon of frequency ν has momentum equal to", o:["hν/c", "hν/c²", "hν", "mc²"], a:0},
  {q:"The rest mass of a photon is", o:["Infinite", "m₀", "hν/c²", "Zero"], a:3},
  {q:"Which of the following has the smallest de-Broglie wavelength (all moving with same velocity)?", o:["Electron", "Proton", "Alpha particle", "Neutron"], a:2},
  {q:"The strength of photoelectric current depends upon", o:["Intensity of incident radiation", "Frequency of incident radiation", "Angle of incidence", "Distance between plates"], a:0},
  {q:"The de-Broglie wavelength of an electron accelerated through a potential difference V is approximately", o:["12.27/√V Å", "1.227/√V Å", "122.7/√V Å", "0.1227/√V Å"], a:0},
  {q:"Photoelectric effect supports the", o:["Wave nature of light", "Quantum nature of light", "Dual nature of light", "Longitudinal nature of light"], a:1},
  {q:"When the intensity of light is increased, the stopping potential", o:["Increases", "Decreases", "Remains unchanged", "Becomes zero"], a:2},
  {q:"The work function of a metal depends on", o:["Nature of metal", "Frequency of light", "Intensity of light", "Angle of incidence"], a:0},
  {q:"If an electron and a proton have the same kinetic energy, which one has a shorter de-Broglie wavelength?", o:["Electron", "Proton", "Both have same", "Cannot be determined"], a:1},
  {q:"The threshold frequency for a metal is f₀. When light of frequency 2f₀ is incident, the max KE is K. If frequency is 5f₀, max KE will be", o:["4K", "3K", "5K", "10K"], a:0},
  {q:"An increase in the frequency of incident radiation increases the", o:["Photoelectric current", "Stopping potential", "Threshold frequency", "Saturation current"], a:1},
  {q:"The momentum of a photon of wavelength λ is", o:["h/λ", "λ/h", "hλ", "h/cλ"], a:0},
  {q:"The maximum velocity of photoelectrons is v. If the frequency is doubled, the new maximum velocity will be", o:["More than √2v", "Less than √2v", "Exactly 2v", "v/2"], a:3},
  {q:"Cathode rays consist of", o:["Photons", "Protons", "Electrons", "α-particles"], a:2},
  {q:"Which of the following is NOT a property of a photon?", o:["Zero rest mass", "Travels with speed c", "Has charge", "Energy is hν"], a:2},
  {q:"In Einstein's photoelectric equation, hν = Φ + K.max, Φ represents", o:["Photon energy", "Kinetic energy", "Work function", "Threshold frequency"], a:2},
  {q:"If light of wavelength λ is incident on a metal, the stopping potential is V. If 2λ is used, the stopping potential will be", o:["V/2", "2V", "More than V/2", "Less than V/2"], a:3},
  {q:"Matter waves are", o:["Electromagnetic waves", "Mechanical waves", "Probability waves", "Transverse waves"], a:3},
  {q:"The saturation current in a photocell can be increased by", o:["Increasing frequency", "Increasing intensity", "Decreasing distance between electrodes", "Both B and C"], a:3},
  {q:"Emission of electrons from a metal surface by heating it is called", o:["Photoelectric emission", "Secondary emission", "Field emission", "Thermionic emission"], a:3},
  {q:"Which of these can be used as a material for a photoelectric cell working with visible light?", o:["Zinc", "Magnesium", "Cadmium", "Cesium"], a:3},
  {q:"A particle with zero rest mass and non-zero energy/momentum must travel at", o:["Speed of sound", "Speed of light", "Zero speed", "Infinite speed"], a:3},
  {q:"The photoelectric effect occurs when the time lag between incidence and emission is", o:["10⁻³ s", "10⁻⁶ s", "10⁻⁹ s or less", "1 s"], a:2},
  {q:"If we consider the wave nature of light, then the photoelectric effect", o:["Can be explained easily", "Cannot explain why there is no time lag", "Can explain threshold frequency", "Can explain stopping potential"], a:3},
  {q:"Light of a certain frequency strikes a metal. If the intensity is halved, the maximum kinetic energy of electrons", o:["Is halved", "Is doubled", "Is quartered", "Remains same"], a:3},
  {q:"What happens to the de-Broglie wavelength of a particle if its momentum is tripled?", o:["Triples", "Remains same", "Becomes one-third", "Becomes nine times"], a:3}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_11")

  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
