<head>
<meta charset="UTF-8">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<script>
/* QUESTIONS */
const questions = [
  {q:"Which of the following transition metals shows the maximum number of oxidation states?",o:["Manganese","Iron","Chromium","Titanium"],a:0},
  {q:"The electronic configuration of Cu (Z=29) is:",o:["[Ar] 3d10 4s1","[Ar] 3d9 4s2","[Ar] 3d10 4s2","[Ar] 4s1 3d9"],a:0},
  {q:"Transition elements are colored due to:",o:["d-d transition","p-p transition","Charge transfer","Unpaired s-electrons"],a:0},
  {q:"Which of the following ions is diamagnetic?",o:["Zn2+","Fe2+","Cu2+","Ni2+"],a:0},
  {q:"The common oxidation state of Lanthanoids is:",o:["+3","+2","+4","+5"],a:0},
  {q:"Potassium permanganate (KMnO4) acts as an oxidant in:",o:["All of these","Acidic medium","Basic medium","Neutral medium"],a:0},
  {q:"Which element is not considered a transition element?",o:["Zinc","Silver","Gold","Copper"],a:0},
  {q:"Interstitial compounds are formed when small atoms like H, C, or N are trapped inside:",o:["Crystal lattice of metals","Voids of non-metals","Molecular orbitals","Ionic bonds"],a:1},
  {q:"The magnetic moment of an ion with 3 unpaired electrons is approximately:",o:["3.87 BM","1.73 BM","2.83 BM","4.90 BM"],a:1},
  {q:"Which transition metal is used as a catalyst in the manufacture of Ammonia?",o:["Iron","Vanadium","Nickel","Platinum"],a:1},
  {q:"The cause of Lanthanoid contraction is:",o:["Poor shielding by 4f electrons","High shielding by 4f electrons","Increase in atomic number","Decrease in nuclear charge"],a:1},
  {q:"Which of the following has the highest melting point?",o:["Chromium","Zinc","Copper","Silver"],a:1},
  {q:"Mischmetall is an alloy consisting mainly of:",o:["Lanthanoid metals","Actinoid metals","Alkali metals","Transition metals"],a:1},
  {q:"The oxidation state of Cr in K2Cr2O7 is:",o:["+6","+3","+7","+4"],a:1},
  {q:"Which ion has the highest magnetic moment?",o:["Fe3+","Mn2+","Cr3+","Co2+"],a:1},
  {q:"In the preparation of KMnO4, pyrolusite ore is fused with:",o:["KOH and O2","NaOH and HCl","K2CO3 only","H2SO4"],a:1},
  {q:"The 'spin-only' magnetic moment formula is:",o:["sqrt(n(n+2))","n(n+1)","sqrt(n+2)","2n+1"],a:1},
  {q:"Which of the following is a liquid at room temperature?",o:["Mercury","Zinc","Cadmium","Gallium"],a:2},
  {q:"The basic character of hydroxides of Lanthanoids:",o:["Decreases across the series","Increases across the series","Remains constant","First increases then decreases"],a:2},
  {q:"Which of the following oxidation states is most stable for Actinoids?",o:["+3","+4","+6","+2"],a:2},
  {q:"The catalyst used in the hydrogenation of oils is:",o:["Nickel","Iron","Platinum","Molybdenum"],a:2},
  {q:"The color of K2Cr2O7 solution changes from orange to yellow on adding:",o:["Alkali","Acid","Water","Alcohol"],a:2},
  {q:"Which element shows the +7 oxidation state?",o:["Manganese","Technetium","Both A and B","None of these"],a:2},
  {q:"The general electronic configuration of d-block elements is:",o:["(n-1)d 1-10 ns 1-2","(n-1)d 10 ns 2","(n-1)d 1-5 ns 1","nd 1-10 ns 0-2"],a:2},
  {q:"Chromyl chloride test is used for the detection of:",o:["Chloride ions","Chromium ions","Sulphate ions","Nitrate ions"],a:2},
  {q:"Which of the following belongs to the 5d series?",o:["Platinum","Iron","Copper","Silver"],a:2},
  {q:"The most stable oxidation state of Iron in aqueous solution is:",o:["+3","+2","+4","+6"],a:3},
  {q:"Which ion is colorless in water?",o:["Sc3+","Ti3+","V3+","Cr3+"],a:3},
  {q:"The number of unpaired electrons in Gadinolium (Z=64) is:",o:["8","7","0","4"],a:3},
  {q:"Which actinoid is used in the manufacture of gas mantles?",o:["Thorium","Uranium","Curium","Neptunium"],a:3},
  {q:"Alloy of Cu and Zn is called:",o:["Brass","Bronze","German Silver","Steel"],a:3},
  {q:"V2O5 is used as a catalyst in:",o:["Contact process","Haber's process","Ostwald process","Lead chamber process"],a:3},
  {q:"Which of the following is a radioactive element?",o:["Promethium","Europium","Gadolinium","Terbium"],a:3},
  {q:"The ionic radii of Zr and Hf are almost similar due to:",o:["Lanthanoid contraction","Diagonal relationship","Isomorphism","Shielding effect"],a:3},
  {q:"Transition metals form complex compounds because of:",o:["Small size and high charge","Availability of vacant d-orbitals","Both A and B","None of these"],a:3}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_8")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>
