<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>coordination compound </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"The central atom in a coordination compound acts as a:",o:["Lewis Acid","Lewis Base","Neutral atom","Ligand"],a:0},
  {q:"The oxidation state of Ni in [Ni(CO)4] is:",o:["0","+2","+4","-2"],a:0},
  {q:"Which of the following is an example of a bidentate ligand?",o:["Oxalate ion","Ammonia","Water","Cyanide ion"],a:0},
  {q:"The coordination number of Cr in [Cr(en)3]Cl3 is:",o:["6","3","4","2"],a:0},
  {q:"According to Werner's theory, secondary valency corresponds to:",o:["Coordination number","Oxidation state","Ionizable valency","Number of anions"],a:0},
  {q:"EDTA is a:",o:["Hexadentate ligand","Bidentate ligand","Tridentate ligand","Tetradentate ligand"],a:0},
  {q:"Ambidentate ligands like NO2- can coordinate through:",o:["Two different atoms","One atom only","Oxygen only","Nitrogen only"],a:0},
  {q:"Which ligand is known as a 'pi-acid' ligand?",o:["Carbon monoxide (CO)","Ammonia","Water","Ethylenediamine"],a:0},
  {q:"The complex [Co(NH3)5SO4]Br and [Co(NH3)5Br]SO4 are:",o:["Ionization isomers","Linkage isomers","Coordination isomers","Geometrical isomers"],a:0},
  {q:"Which of the following is a homoleptic complex?",o:["[Co(NH3)6]3+","[Co(NH3)4Cl2]+","[Ni(NH3)4Cl2]","[Fe(H2O)5(NO)]2+"],a:0},
  {q:"The IUPAC name of K3[Fe(CN)6] is:",o:["Potassium hexacyanoferrate(III)","Potassium hexacyanoferrate(II)","Potassium ferricyanide","Potassium cyanoiron(III)"],a:1},
  {q:"The number of ions produced from [Co(NH3)6]Cl3 in solution is:",o:["4","3","2","6"],a:1},
  {q:"The IUPAC name of [Pt(NH3)2Cl2] is:",o:["Diamminedichloridoplatinum(II)","Diamminedichloridoplatinum(IV)","Dichloridodiammineplatinum(II)","Platinumdiamminechloride"],a:1},
  {q:"Which geometry is associated with sp3d2 hybridization?",o:["Octahedral","Tetrahedral","Square planar","Trigonal bipyramidal"],a:1},
  {q:"The primary valency of iron in K4[Fe(CN)6] is:",o:["2","6","4","0"],a:1},
  {q:"Which of the following is a chelating ligand?",o:["Oxalate","Chloride","Cyanide","Ammonia"],a:1},
  {q:"A complex with 3 unpaired electrons will have a magnetic moment of:",o:["3.87 BM","1.73 BM","2.82 BM","4.90 BM"],a:1},
  {q:"In the complex [Fe(CN)6]4-, the iron atom is:",o:["d2sp3 hybridized","sp3d2 hybridized","sp3 hybridized","dsp2 hybridized"],a:2},
  {q:"The color of coordination compounds is usually due to:",o:["d-d transitions","p-p transitions","s-d transitions","Charge transfer only"],a:2},
  {q:"Which of the following is an inner orbital complex?",o:["[Co(NH3)6]3+","[Ni(NH3)6]2+","[Fe(CN)6]3-","[MnCl6]3-"],a:2},
  {q:"Optical isomerism is most commonly shown by:",o:["Octahedral complexes","Square planar complexes","Linear complexes","Tetrahedral complexes"],a:2},
  {q:"The splitting of d-orbital energies in a crystal field is called:",o:["Crystal Field Splitting","Jahn-Teller Effect","Zeeman Effect","Synergic Bonding"],a:2},
  {q:"The most stable complex among the following is:",o:["[Fe(C2O4)3]3-","[Fe(H2O)6]3+","[Fe(Cl)6]3-","[Fe(NH3)6]3+"],a:2},
  {q:"Which of the following ligands is at the top of the spectrochemical series?",o:["CN-","Cl-","F-","OH-"],a:2},
  {q:"In an octahedral field, the d-orbitals split into:",o:["t2g and eg levels","e and t2 levels","sp3 and d2 levels","None of these"],a:2},
  {q:"The Effective Atomic Number (EAN) of Ni in [Ni(CO)4] is:",o:["36","34","35","28"],a:2},
  {q:"[Fe(H2O)6]3+ is strongly paramagnetic whereas [Fe(CN)6]3- is weakly paramagnetic because:",o:["CN- is a strong field ligand","H2O is a strong field ligand","Fe is in different oxidation states","H2O causes pairing"],a:2},
  {q:"Fac-mer isomerism is associated with complexes of the type:",o:["[Ma3b3]","[Ma4b2]","[Ma2b4]","[Ma5b]"],a:3},
  {q:"Which of the following will not show geometrical isomerism?",o:["[Ma3b]","[Ma2b2]","[Ma4b2]","[Mabcd]"],a:3},
  {q:"The IUPAC name of [NiCl4]2- is:",o:["Tetrachloridonickelate(II) ion","Tetrachloronickel(II)","Nickel tetrachloride","Tetrachloronickelate(0)"],a:3},
  {q:"Which of the following is a neutral ligand?",o:["Carbon monoxide","Chloride","Oxalate","Nitrito"],a:3},
  {q:"In the Brown Ring complex [Fe(H2O)5(NO)]SO4, the oxidation state of Fe is:",o:["+1","+2","+3","0"],a:3},
  {q:"Synergic bonding involves:",o:["Both sigma and pi bonding","Only sigma bonding","Only pi bonding","Ionic bonding"],a:3},
  {q:"The number of geometrical isomers for [Pt(NH3)2Cl2] is:",o:["2","3","4","1"],a:3},
  {q:"Wilkinson's catalyst is a coordination compound of:",o:["Rhodium","Iron","Cobalt","Platinum"],a:3}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_9")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
