<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>  relations , fuctions & binary operations </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "If A = {1, 2, 3}, the number of relations containing (1, 2) and (1, 3) which are reflexive and symmetric but not transitive is", o: ["1 (23%)", "2 (43%)", "3 (21%)", "4 (13%)"], a: 0},
  {q: "Let R be a relation on the set L of all lines in a plane defined by R = {(L1, L2) : L1 ⊥ L2}. Then R is", o: ["Reflexive (23%)", "Symmetric (43%)", "Transitive (21%)", "Equivalence (13%)"], a: 1},
  {q: "The function f: R → R defined by f(x) = 2x is", o: ["One-one onto (23%)", "Onto not one-one (43%)", "One-one not onto (21%)", "Neither (13%)"], a: 0},
  {q: "A relation R on set A is called identity relation if R is", o: ["{(a, a) : a ∈ A} (23%)", "{(a, b) : a, b ∈ A} (43%)", "{(a, a) : a ∉ A} (21%)", "None (13%)"], a: 0},
  {q: "The number of all one-to-one functions from set {1, 2, 3} to itself is", o: ["2 (23%)", "6 (43%)", "3 (21%)", "1 (13%)"], a: 1},
  {q: "Let f: R → R be defined by f(x) = x^4. Then f is", o: ["One-one onto (23%)", "Many-one onto (43%)", "One-one not onto (21%)", "Neither (13%)"], a: 3},
  {q: "The range of the function f(x) = |x| is", o: ["R (23%)", "[0, ∞) (43%)", "(-∞, 0] (21%)", "(0, ∞) (13%)"], a: 1},
  {q: "If f: R → R is given by f(x) = (3 - x^3)^(1/3), then f(f(x)) is", o: ["x^(1/3) (23%)", "x (43%)", "x^3 (21%)", "3 - x^3 (13%)"], a: 1},
  {q: "A relation R in set A is transitive if (a, b) ∈ R and (b, c) ∈ R implies", o: ["(b, a) ∈ R (23%)", "(a, c) ∈ R (43%)", "(c, a) ∈ R (21%)", "(b, b) ∈ R (13%)"], a: 1},
  {q: "If n(A) = p and n(B) = q, then the number of functions from A to B is", o: ["p^q (23%)", "q^p (43%)", "p*q (21%)", "2^(pq) (13%)"], a: 1},
  {q: "The smallest equivalence relation on set A = {1, 2, 3} is", o: ["{(1,1), (2,2), (3,3)} (23%)", "A × A (43%)", "{(1,2), (2,1)} (21%)", "Empty set (13%)"], a: 0},
  {q: "If f(x) = x + 7 and g(x) = x - 7, then fog(x) is", o: ["x + 14 (23%)", "x (43%)", "x - 14 (21%)", "7 (13%)"], a: 1},
  {q: "A function f: A → B is surjective if", o: ["Range = Codomain (23%)", "Range ⊂ Codomain (43%)", "Range ⊃ Codomain (21%)", "None (13%)"], a: 0},
  {q: "The relation 'is equal to' on the set of real numbers is", o: ["Reflexive only (23%)", "Equivalence (43%)", "Symmetric only (21%)", "Transitive only (13%)"], a: 1},
  {q: "If f(x) = sin x and g(x) = x^2, then gof(x) is", o: ["sin(x^2) (23%)", "sin^2(x) (43%)", "x^2 sin x (21%)", "None (13%)"], a: 1},
  {q: "An empty relation on a non-empty set A is", o: ["Symmetric & Transitive (23%)", "Reflexive (43%)", "Equivalence (21%)", "None (13%)"], a: 0},
  {q: "The number of reflexive relations on a set with n elements is", o: ["2^n (23%)", "2^(n^2 - n) (43%)", "2^(n^2) (21%)", "n^2 (13%)"], a: 1},
  {q: "If f: A → B is a bijection, then f inverse is", o: ["One-one only (23%)", "Bijective (43%)", "Onto only (21%)", "Not a function (13%)"], a: 1},
  {q: "Let A = {1, 2, 3}. The total number of equivalence relations on A is", o: ["2 (23%)", "5 (43%)", "3 (21%)", "8 (13%)"], a: 1},
  {q: "The function f(x) = e^x is", o: ["One-one (23%)", "Many-one (43%)", "Onto (21%)", "Constant (13%)"], a: 0},
  {q: "The greatest integer function f(x) = [x] is", o: ["One-one (23%)", "Neither one-one nor onto (43%)", "Onto (21%)", "Bijective (13%)"], a: 1},
  {q: "If R is symmetric, then R inverse is", o: ["Reflexive (23%)", "Symmetric (43%)", "Transitive (21%)", "None (13%)"], a: 1},
  {q: "The composition of two bijections is", o: ["One-one only (23%)", "A bijection (43%)", "Onto only (21%)", "Many-one (13%)"], a: 1},
  {q: "If f(x) = 8x^3 and g(x) = x^(1/3), then fog(x) is", o: ["2x (23%)", "8x (43%)", "x (21%)", "8x^3 (13%)"], a: 1},
  {q: "The relation R = {(1,2), (2,1)} on {1, 2, 3} is", o: ["Reflexive (23%)", "Symmetric (43%)", "Transitive (21%)", "Equivalence (13%)"], a: 1},
  {q: "Let f: N → N be f(n) = n + 1. Then f is", o: ["Onto (23%)", "One-one but not onto (43%)", "Many-one (21%)", "Bijective (13%)"], a: 1},
  {q: "A relation R on A is reflexive if (a, a) ∈ R for", o: ["Every a ∈ A (23%)", "Some a ∈ A (43%)", "No a ∈ A (21%)", "a = 0 (13%)"], a: 0},
  {q: "If A = {1, 2}, number of binary operations on A is", o: ["8 (23%)", "16 (43%)", "4 (21%)", "2 (13%)"], a: 1},
  {q: "The domain of f(x) = 1/x is", o: ["R (23%)", "R - {0} (43%)", "(0, ∞) (21%)", "Integers (13%)"], a: 1},
  {q: "A constant function f(x) = k is", o: ["One-one (23%)", "Many-one (43%)", "Onto (21%)", "None (13%)"], a: 1},
  {q: "If f is invertible, then f must be", o: ["One-one only (23%)", "Bijective (43%)", "Onto only (21%)", "Identity (13%)"], a: 1},
  {q: "The range of f(x) = cos x is", o: ["R (23%)", "[-1, 1] (43%)", "[0, 1] (21%)", "[-1, 0] (13%)"], a: 1},
  {q: "Number of onto functions from {1, 2} to {a, b, c} is", o: ["2 (23%)", "0 (43%)", "6 (21%)", "3 (13%)"], a: 1},
  {q: "If R is an equivalence relation, then R is", o: ["Reflexive only (23%)", "Ref, Sym, & Trans (43%)", "Symmetric only (21%)", "Transitive only (13%)"], a: 1},
  {q: "The inverse of f(x) = 3x - 5 is", o: ["(x-5)/3 (23%)", "(x+5)/3 (43%)", "3x+5 (21%)", "5x-3 (13%)"], a: 1}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_1")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

 
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
