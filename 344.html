<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>probability</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "If P(A) = 0.8, P(B) = 0.5 and P(B|A) = 0.4, then P(A ∩ B) is", o: ["0.32 (25%)", "0.25 (25%)", "0.40 (25%)", "0.50 (25%)"], a: 0},
  {q: "Two events A and B are independent if", o: ["P(A ∩ B) = 0 (25%)", "P(A ∩ B) = P(A)P(B) (25%)", "P(A) = P(B) (25%)", "P(A) + P(B) = 1 (25%)"], a: 1},
  {q: "If P(A) = 1/2, P(B) = 0, then P(A|B) is", o: ["0 (25%)", "1/2 (25%)", "Not defined (25%)", "1 (25%)"], a: 2},
  {q: "The probability of obtaining an even prime number on each die when a pair of dice is rolled is", o: ["1/6 (25%)", "1/4 (25%)", "1/12 (25%)", "1/36 (25%)"], a: 3},
  {q: "If A and B are two events such that P(A|B) = P(B|A), then", o: ["A ⊂ B (25%)", "A = B (25%)", "P(A) = P(B) (25%)", "A ∩ B = Φ (25%)"], a: 2},
  {q: "The mean of the numbers obtained on throwing a die having written 1 on three faces, 2 on two faces and 5 on one face is", o: ["1 (25%)", "2 (25%)", "5 (25%)", "8/3 (25%)"], a: 1},
  {q: "If A and B are independent events such that P(A) = 0.3 and P(B) = 0.4, then P(A ∩ B) is", o: ["0.7 (25%)", "0.12 (25%)", "0.1 (25%)", "0.5 (25%)"], a: 1},
  {q: "In a Bayes' Theorem problem, if E1 and E2 are partitions of sample space, then P(E1) + P(E2) is", o: ["0.5 (25%)", "0 (25%)", "1 (25%)", "2 (25%)"], a: 2},
  {q: "Probability of a leap year having 53 Tuesdays is", o: ["1/7 (25%)", "2/7 (25%)", "3/7 (25%)", "0 (25%)"], a: 1},
  {q: "If P(A) = 4/5 and P(A ∩ B) = 7/10, then P(B|A) is", o: ["1/10 (25%)", "1/8 (25%)", "7/8 (25%)", "17/20 (25%)"], a: 2},
  {q: "Let X represent the difference between the number of heads and tails when a coin is tossed 6 times. The possible values of X are", o: ["{0, 2, 4, 6} (25%)", "{1, 2, 3, 4, 5, 6} (25%)", "{0, 1, 2, 3, 4, 5, 6} (25%)", "{-6, -4, -2, 0, 2, 4, 6} (25%)"], a: 3},
  {q: "A card is picked at random from a pack of 52 playing cards. Given that the picked card is a queen, the probability of it being a spade is", o: ["1/3 (25%)", "4/13 (25%)", "1/4 (25%)", "1/2 (25%)"], a: 2},
  {q: "If P(A) = 1/2, P(B) = 1/3 and P(A ∩ B) = 1/4, then P(A' | B') is", o: ["1/4 (25%)", "3/4 (25%)", "5/8 (25%)", "1/2 (25%)"], a: 2},
  {q: "A die is thrown twice and the sum of the numbers appearing is observed to be 6. The conditional probability that the number 4 has appeared at least once is", o: ["1/3 (25%)", "2/5 (25%)", "1/5 (25%)", "5/36 (25%)"], a: 1},
  {q: "If P(A) = 0.4, P(B) = 0.8 and P(B|A) = 0.6, then P(A ∪ B) is", o: ["0.24 (25%)", "0.96 (25%)", "0.48 (25%)", "0.60 (25%)"], a: 1},
  {q: "The probability distribution of a random variable X is given. The sum of all probabilities P(X) must be", o: ["Infinity (25%)", "0 (25%)", "1 (25%)", "0.5 (25%)"], a: 2},
  {q: "Two events A and B are said to be mutually exclusive if", o: ["P(A ∩ B) = 1 (25%)", "P(A ∪ B) = 1 (25%)", "P(A ∩ B) = 0 (25%)", "P(A) = P(B) (25%)"], a: 2},
  {q: "If A and B are two events such that P(A) ≠ 0 and P(B|A) = 1, then", o: ["A ⊂ B (25%)", "B ⊂ A (25%)", "B = Φ (25%)", "A = Φ (25%)"], a: 0},
  {q: "The variance of a random variable X is given by", o: ["E(X²) + [E(X)]² (25%)", "E(X²) - [E(X)]² (25%)", "E(X) - E(X²) (25%)", "[E(X)]² (25%)"], a: 1},
  {q: "Probability that a number selected from 1 to 30 is prime is", o: ["1/3 (25%)", "1/5 (25%)", "1/6 (25%)", "3/10 (25%)"], a: 3},
  {q: "If P(A) = 3/8, P(B) = 1/2 and P(A ∩ B) = 1/4, then P(A|B) is", o: ["1/4 (25%)", "1/2 (25%)", "2/3 (25%)", "3/4 (25%)"], a: 1},
  {q: "Bayes' Theorem is used to find", o: ["Conditional probability (25%)", "Posterior probability (25%)", "Prior probability (25%)", "Both A and B (25%)"], a: 3},
  {q: "For a random variable X, E(X) is also known as", o: ["Variance (25%)", "Standard Deviation (25%)", "Mean (25%)", "Mode (25%)"], a: 2},
  {q: "A pair of coins is tossed. The probability of getting at least one head is", o: ["1/4 (25%)", "1/2 (25%)", "3/4 (25%)", "1 (25%)"], a: 2},
  {q: "If A and B are independent, then P(A' ∩ B') is", o: ["P(A')P(B') (25%)", "1 - P(A ∪ B) (25%)", "Both A and B (25%)", "Neither A nor B (25%)"], a: 2},
  {q: "The probability of an impossible event is", o: ["1 (25%)", "0.5 (25%)", "0 (25%)", "-1 (25%)"], a: 2},
  {q: "If E and F are independent events, then P(E|F) is", o: ["P(E) (25%)", "P(F) (25%)", "P(E ∩ F) (25%)", "0 (25%)"], a: 0},
  {q: "The number of ways to partition a sample space for Bayes' Theorem is", o: ["Always 2 (25%)", "At least 2 (25%)", "Infinite (25%)", "1 (25%)"], a: 1},
  {q: "If P(A) = 0.6, P(B) = 0.3 and P(A ∩ B) = 0.2, then P(A' ∩ B) is", o: ["0.1 (25%)", "0.4 (25%)", "0.3 (25%)", "0.2 (25%)"], a: 0},
  {q: "A bag contains 5 red and 3 blue balls. If 3 balls are drawn at random without replacement, the probability they are all red is", o: ["5/28 (25%)", "1/56 (25%)", "15/56 (25%)", "5/8 (25%)"], a: 0},
  {q: "The conditional probability P(A|A) is always", o: ["0 (25%)", "0.5 (25%)", "1 (25%)", "P(A) (25%)"], a: 2},
  {q: "If P(A) = 0.4, P(B) = p, and P(A ∪ B) = 0.6, for independent events, p is", o: ["1/2 (25%)", "1/3 (25%)", "1/4 (25%)", "1/5 (25%)"], a: 1},
  {q: "A random variable X has a mean 3 and variance 4. Then E(X²) is", o: ["7 (25%)", "12 (25%)", "13 (25%)", "25 (25%)"], a: 2},
  {q: "In 10 tosses of a fair coin, the probability of exactly 5 heads is", o: ["1/2 (25%)", "252/1024 (25%)", "1/10 (25%)", "5/10 (25%)"], a: 1},
  {q: "If A and B are mutually exclusive, P(A|B) is", o: ["1 (25%)", "P(A) (25%)", "0 (25%)", "0.5 (25%)"], a: 2}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_12")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

  
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
