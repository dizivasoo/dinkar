<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> application of integrals </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

  <div class="question" id="questionText"></div>

<script>

  {q: "Area of the region bounded by the curve x² = 4y and the line x = 2 is", o: ["1/3 (15%)", "2/3 (23%)", "1/2 (34%)", "1/4 (28%)"], a: 1},
  {q: "The area bounded by the curve y = x|x|, x-axis and the ordinates x = -1 and x = 1 is", o: ["0 (15%)", "1/3 (23%)", "2/3 (34%)", "1 (28%)"], a: 2},
  {q: "The area of the ellipse x²/a² + y²/b² = 1 is", o: ["πab (15%)", "2πab (23%)", "πa²b² (34%)", "4πab (28%)"], a: 0},
  {q: "Area of the region bounded by y = x², x-axis and the line x = 3 is", o: ["6 (15%)", "3 (23%)", "9 (34%)", "27 (28%)"], a: 2},
  {q: "The area of the region bounded by the curve y = sin x between x = 0 and x = 2π is", o: ["2 (15%)", "0 (23%)", "4 (34%)", "1 (28%)"], a: 2},
  {q: "The area bounded by the line y = x, x-axis and ordinates x = -1 to x = 2 is", o: ["3/2 (15%)", "5/2 (23%)", "2/5 (34%)", "1/2 (28%)"], a: 1},
  {q: "Area of the region bounded by y² = 4ax and its latus rectum is", o: ["2/3 a² (15%)", "4/3 a² (23%)", "8/3 a² (34%)", "a² (28%)"], a: 2},
  {q: "The area of the region bounded by the curve y = √x and y = x is", o: ["1/3 (15%)", "1/2 (23%)", "1/6 (34%)", "2/3 (28%)"], a: 2},
  {q: "Area of the region bounded by the curve y = eˣ, y-axis and the line y = e is", o: ["e (15%)", "1 (23%)", "e-1 (34%)", "e+1 (28%)"], a: 1},
  {q: "The area of the region bounded by the curve x = 2y - y² and the y-axis is", o: ["2/3 (15%)", "4/3 (23%)", "1/3 (34%)", "1 (28%)"], a: 1},

  {q: "The area of the region bounded by the curves y = √x and y = x² is", o: ["1/4 (15%)", "1/2 (23%)", "1/3 (34%)", "1/6 (28%)"], a: 2},
  {q: "Area of the region bounded by the line y = 3x + 2, the x-axis and the ordinates x = -1 and x = 1 is", o: ["13/3 (15%)", "10/3 (23%)", "4 (34%)", "5 (28%)"], a: 0},
  {q: "The area of the region bounded by y² = x, x = 0, y = 1 is", o: ["1/6 (15%)", "1/4 (23%)", "1/3 (34%)", "1/2 (28%)"], a: 2},
  {q: "The area bounded by the curve y = log x, x-axis and the ordinate x = e is", o: ["e (15%)", "e-1 (23%)", "1 (34%)", "2 (28%)"], a: 2},
  {q: "Area of the region bounded by y = |x-1| and y = 1 is", o: ["1 (15%)", "2 (23%)", "1/2 (34%)", "3 (28%)"], a: 0},
  {q: "The area bounded by y = sin x and y = cos x from x = 0 to x = π/4 is", o: ["√2-1 (15%)", "√2+1 (23%)", "1 (34%)", "√2 (28%)"], a: 0},
  {q: "Area of the parabola y² = 4x bounded by its latus rectum is", o: ["4/3 (15%)", "8/3 (23%)", "2/3 (34%)", "1 (28%)"], a: 1},
  {q: "Area bounded by y = x², y = 4 and the y-axis (1st quadrant) is", o: ["8/3 (15%)", "16/3 (23%)", "4/3 (34%)", "2 (28%)"], a: 1},
  {q: "The area of the region bounded by x² = 4y, y = 2, y = 4 and the y-axis in the first quadrant is", o: ["8√2-4 (15%)", "4√2 (23%)", "8/3(4√2-2) (34%)", "None (28%)"], a: 2},
  {q: "Area bounded by y = x⁴, x = 1, x = 5 and the x-axis is", o: ["624 (15%)", "624.8 (23%)", "624.8 (34%)", "3124/5 (28%)"], a: 3},
  {q: "Area of the region bounded by y = x and y = x³ is", o: ["1/2 (15%)", "1/4 (23%)", "1/2 (34%)", "1/8 (28%)"], a: 2},
  {q: "The area of the region bounded by the curve y = √a²-x² and x-axis is", o: ["πa²/4 (15%)", "πa²/2 (23%)", "πa² (34%)", "2πa² (28%)"], a: 1},
  {q: "Area between y = x² and y = x is", o: ["1/6 (15%)", "1/3 (23%)", "1/2 (34%)", "1/4 (28%)"], a: 0},
  {q: "The area bounded by y = cos x, x = 0, x = 2π is", o: ["2 (15%)", "1 (23%)", "4 (34%)", "0 (28%)"], a: 2},
  {q: "Area bounded by the curve y = x², x = -1, x = 2 and x-axis is", o: ["3 (15%)", "2 (23%)", "3 (34%)", "1 (28%)"], a: 2},
  {q: "The area of the region bounded by y = |x| is", o: ["Not defined (15%)", "Depends on limits (23%)", "Depends on limits (34%)", "0 (28%)"], a: 2},
  {q: "The area of the region bounded by y² = 4x and y = x is", o: ["8/3 (15%)", "4/3 (23%)", "2/3 (34%)", "1/3 (28%)"], a: 0},
  {q: "Area bounded by y = x³ and y = x in the first quadrant is", o: ["1/2 (15%)", "1/4 (23%)", "1/3 (34%)", "1/8 (28%)"], a: 1},
  {q: "Area of the circle x² + y² = 1 is", o: ["π (15%)", "2π (23%)", "π (34%)", "4π (28%)"], a: 2},
  {q: "Area of the region bounded by y = √x, x = 1 and x = 4 is", o: ["14/3 (15%)", "14/3 (23%)", "7/3 (34%)", "3/14 (28%)"], a: 0},
  {q: "The area of the region bounded by the curve y = x² - 1 and the x-axis is", o: ["4/3 (15%)", "2/3 (23%)", "4/3 (34%)", "1 (28%)"], a: 2}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_7")
  document.querySelector(".test-box").innerHTML = `

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">

      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

  
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>
