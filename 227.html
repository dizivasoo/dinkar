<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Metallurgy</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"Metallurgy is extraction of",o:["Non-metals","Metals","Alloys","Salts"],a:1},
  {q:"Ore is",o:["Impure metal","Pure metal","Mineral","Metal oxide"],a:0},
  {q:"Gangue is",o:["Impurity","Ore","Metal","Flux"],a:0},
  {q:"Which of the following is an oxide ore?",o:["Cassiterite","Galena","Zinc blende","Cinnabar"],a:0},
  {q:"Froth floatation process is used for the concentration of",o:["Oxide ores","Sulphide ores","Chloride ores","Carbonate ores"],a:1},
  {q:"The process of heating the ore in the absence of air below its melting point is",o:["Roasting","Smelting","Calcination","Refining"],a:2},
  {q:"The process of heating the ore in a regular supply of air is",o:["Roasting","Calcination","Reduction","Fluxing"],a:0},
  {q:"Cinnabar is an ore of which metal?",o:["Copper","Mercury","Iron","Zinc"],a:1},
  {q:"Which substance is used as a depressant in froth floatation to separate ZnS from PbS?",o:["NaCN","Xanthate","Aniline","Pine oil"],a:0},
  {q:"The method used for the refining of Zirconium is",o:["Liquation","Distillation","Mond process","Van Arkel method"],a:3},
  {q:"The mineral from which a metal can be extracted profitably is called",o:["Flux","Slag","Ore","Gangue"],a:2},
  {q:"Magnetic separation is used for the concentration of",o:["Magnetite","Haematite","Cassiterite","All of these"],a:3},
  {q:"In the extraction of Iron, the flux used is",o:["Silica","Limestone","Coke","Calcium silicate"],a:1},
  {q:"The purest form of commercial iron is",o:["Cast iron","Wrought iron","Pig iron","Steel"],a:1},
  {q:"Mond process is used for the refining of",o:["Ni","Zr","Ti","Zn"],a:0},
  {q:"In Hall-Heroult process, the cathode is made of",o:["Copper","Aluminium","Carbon (Graphite)","Platinum"],a:2},
  {q:"The role of cryolite in the metallurgy of aluminium is",o:["To lower melting point","To increase conductivity","Both A and B","To decrease solubility"],a:2},
  {q:"Hydrometallurgy is used for the extraction of",o:["Al","Fe","Ag","Mg"],a:2},
  {q:"Blast furnace is used to get which form of iron?",o:["Wrought iron","Pig iron","Steel","Pure iron"],a:1},
  {q:"The chemical formula of Malachite is",o:["CuCO3.Cu(OH)2","Cu2S","CuFeS2","Cu2O"],a:0},
  {q:"Zone refining is based on the principle of",o:["Fractional distillation","Differential solubility","Vapour pressure","Adsorption"],a:1},
  {q:"The common impurities present in bauxite are",o:["Fe2O3","SiO2","TiO2","All of these"],a:3},
  {q:"Which of the following is not a carbonate ore?",o:["Siderite","Calamine","Dolomite","Bauxite"],a:3},
  {q:"Self-reduction process is used for the extraction of",o:["Cu","Pb","Hg","All of these"],a:3},
  {q:"The slag formed during the extraction of Iron is",o:["FeSiO3","CaSiO3","MgSiO3","ZnSiO3"],a:1},
  {q:"Leaching is a process of",o:["Reduction","Concentration","Refining","Oxidation"],a:1},
  {q:"Cyanide process is used for the extraction of",o:["Ag and Au","Cu and Zn","Fe and Al","Ni and Co"],a:0},
  {q:"Which metal is refined by Distillation?",o:["Zinc","Copper","Iron","Nickel"],a:0},
  {q:"Ellingham diagram helps in the selection of",o:["Flux","Reducing agent","Oxidizing agent","Catalyst"],a:1},
  {q:"Liquation is used when",o:["Metal has high melting point","Impurities have lower melting point","Metal has low melting point","Metal is volatile"],a:2},
  {q:"Poling process is used for the refining of",o:["Aluminium","Copper","Iron","Sodium"],a:1},
  {q:"Which of the following is a halide ore?",o:["Cryolite","Haematite","Calamine","Galena"],a:0},
  {q:"The most abundant metal in the earth's crust is",o:["Iron","Aluminium","Calcium","Sodium"],a:1},
  {q:"The gas evolved during Roasting is usually",o:["CO2","SO2","N2","O2"],a:1},
  {q:"Bessemer converter is used in the metallurgy of",o:["Aluminium","Copper","Gold","Silver"],a:1}
];
let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_6")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>


<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
