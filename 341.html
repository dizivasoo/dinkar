<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> vector </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
/* QUESTIONS */
const questions = [
  {q: "The unit vector in the direction of vector a = i + j + 2k is", o: ["(i + j + 2k)/√6 (33%)", "(i + j + 2k)/6 (17%)", "(i + j + 2k)/√3 (33%)", "i + j + k (17%)"], a: 0},
  {q: "If a and b are two collinear vectors, then which of the following are incorrect?", o: ["b = λa (33%)", "a = ±b (17%)", "Both are unit vectors (33%)", "Components are proportional (17%)"], a: 2},
  {q: "The position vector of the midpoint of the line segment joining P(2, 3, 4) and Q(4, 1, -2) is", o: ["3i + 2j + k (33%)", "6i + 4j + 2k (17%)", "2i + 2j + 2k (33%)", "i + j + k (17%)"], a: 0},
  {q: "The scalar product of 5i - j - 3k and i + 3j - 5k is", o: ["15 (33%)", "17 (17%)", "10 (33%)", "0 (17%)"], a: 1},
  {q: "If |a| = √3, |b| = 2 and a·b = √6, then the angle between a and b is", o: ["π/6 (33%)", "π/3 (17%)", "π/4 (33%)", "π/2 (17%)"], a: 2},
  {q: "The projection of vector i + 3j + 7k on the vector 7i - j + 8k is", o: ["√114 (33%)", "60/√114 (17%)", "60 (33%)", "114 (17%)"], a: 2},
  {q: "If a is a unit vector and (x - a)·(x + a) = 8, then |x| is", o: ["3 (33%)", "√8 (17%)", "9 (33%)", "2 (17%)"], a: 0},
  {q: "The value of λ for which the vectors 2i - j + k, i + 2j - 3k and 3i + λj + 5k are coplanar is", o: ["-4 (33%)", "4 (17%)", "-8 (33%)", "8 (17%)"], a: 2},
  {q: "The magnitude of the vector product of a = i - 7j + 7k and b = 3i - 2j + 2k is", o: ["19√2 (33%)", "15√2 (17%)", "19 (33%)", "5 (17%)"], a: 0},
  {q: "Area of a parallelogram whose adjacent sides are given by the vectors a and b is", o: ["a·b (33%)", "|a × b| (17%)", "|a| |b| (33%)", "1/2 |a × b| (17%)"], a: 1},
  {q: "The angle between two vectors a and b with magnitudes √3 and 2 respectively, having a·b = 3 is", o: ["π/4 (33%)", "π/2 (17%)", "π/6 (33%)", "π/3 (17%)"], a: 2},
  {q: "If θ is the angle between two vectors a and b, then |a·b| = |a × b| when θ is", o: ["π/2 (33%)", "π (17%)", "π/4 (33%)", "0 (17%)"], a: 2},
  {q: "The value of i·(j × k) + j·(i × k) + k·(i × j) is", o: ["1 (33%)", "3 (17%)", "1 (33%)", "-1 (17%)"], a: 2},
  {q: "If a = 2i + j + 3k and b = 3i + 5j - 2k, then |a × b| is", o: ["√507 (33%)", "√400 (17%)", "√300 (33%)", "507 (17%)"], a: 0},
  {q: "The direction cosines of the vector i + 2j + 3k are", o: ["1/√14, 2/√14, 3/√14 (33%)", "1, 2, 3 (17%)", "1/6, 2/6, 3/6 (33%)", "None (17%)"], a: 0},
  {q: "If |a + b| = |a - b|, then the angle between a and b is", o: ["π/2 (33%)", "π/3 (17%)", "0 (33%)", "π/4 (17%)"], a: 0},
  {q: "The vectors 2i - 3j + 4k and -4i + 6j - 8k are", o: ["Perpendicular (33%)", "Collinear (17%)", "Equal (33%)", "Unit vectors (17%)"], a: 1},
  {q: "The scalar triple product [a b c] represents the volume of a", o: ["Tetrahedron (33%)", "Sphere (17%)", "Parallelepiped (33%)", "Pyramid (17%)"], a: 2},
  {q: "The area of a triangle with vertices (1, 1, 2), (2, 3, 5) and (1, 5, 5) is", o: ["√61/2 (33%)", "√61 (17%)", "61/2 (33%)", "√50/2 (17%)"], a: 0},
  {q: "If a = i + j + k and b = j - k, a vector c such that a × c = b and a·c = 3 is", o: ["5/3i + 2/3j + 2/3k (33%)", "i + j + k (17%)", "1/3(5i + 2j + 2k) (33%)", "2i - j (17%)"], a: 2},
  {q: "Vector projection of a on b is given by", o: ["(a·b)/|b|² * b (33%)", "a·b (17%)", "(a·b)/|b| (33%)", "|a| cos θ (17%)"], a: 0},
  {q: "If the angle between a and b is π/3, then |a × b| is", o: ["1/2 |a||b| (33%)", "√3/2 |a||b| (17%)", "|a||b| (33%)", "0 (17%)"], a: 1},
  {q: "The value of λ such that a = 2i + λj + k and b = i + 2j + 3k are perpendicular is", o: ["-5/2 (33%)", "5/2 (17%)", "-2 (33%)", "2 (17%)"], a: 0},
  {q: "The unit vector perpendicular to both i + j and j + k is", o: ["(i - j + k)/√3 (33%)", "i + j + k (17%)", "k (33%)", "j (17%)"], a: 0},
  {q: "Two vectors are equal if they have same", o: ["Magnitude (33%)", "Direction (17%)", "Magnitude and Direction (33%)", "Initial point (17%)"], a: 2},
  {q: "The sum of the vectors a = i - 2j + k, b = -2i + 4j + 5k and c = i - 6j - 7k is", o: ["-4j - k (33%)", "0 (17%)", "-4j + k (33%)", "i + j + k (17%)"], a: 0},
  {q: "If a is any vector, then (a·i)i + (a·j)j + (a·k)k is equal to", o: ["a (33%)", "2a (17%)", "0 (33%)", "3a (17%)"], a: 0},
  {q: "The projection of the vector i - j on the vector i + j is", o: ["0 (33%)", "1 (17%)", "2 (33%)", "-1 (17%)"], a: 0},
  {q: "The angle between the vectors i - 2j + 3k and 3i - 2j + k is", o: ["cos⁻¹(5/7) (33%)", "π/2 (17%)", "cos⁻¹(1/3) (33%)", "π/3 (17%)"], a: 0},
  {q: "If a, b, c are unit vectors such that a + b + c = 0, then a·b + b·c + c·a is", o: ["-3/2 (33%)", "3/2 (17%)", "0 (33%)", "1 (17%)"], a: 0},
  {q: "The vector in the direction of vector 5i - j + 2k which has magnitude 8 units is", o: ["8/√30 (5i - j + 2k) (33%)", "5i - j + 2k (17%)", "8(5i - j + 2k) (33%)", "1/√30 (17%)"], a: 0},
  {q: "If |a| = 10, |b| = 2 and a·b = 12, then |a × b| is", o: ["16 (33%)", "10 (17%)", "20 (33%)", "14 (17%)"], a: 0},
  {q: "Find the component of a = 2i + 3j along b = i + j", o: ["5/√2 (33%)", "5 (17%)", "2 (33%)", "3 (17%)"], a: 3},
  {q: "Direction ratios of the vector joining P(2, 3, 0) and Q(-1, -2, -4) are", o: ["-3, -5, -4 (33%)", "3, 5, 4 (17%)", "-3, -5, -4 (33%)", "1, 1, 4 (17%)"], a: 2},
  {q: "The distance of the point (2, 3, 4) from the origin is", o: ["√29 (33%)", "9 (17%)", "√29 (33%)", "5 (17%)"], a: 2}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_9")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

    
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
