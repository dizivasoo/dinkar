<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> determinant</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "If A is a square matrix of order 3 and |A| = 5, then |adj A| is", o: ["25 (29%)", "5 (21%)", "125 (22%)", "625 (28%)"], a: 0},
  {q: "The value of a determinant is zero if any two rows or columns are", o: ["Multiplied (29%)", "Identical (21%)", "Added (22%)", "Subtracted (28%)"], a: 1},
  {q: "If A is an invertible matrix of order 2, then det(A⁻¹) is equal to", o: ["det(A) (29%)", "1/det(A) (21%)", "1 (22%)", "0 (28%)"], a: 1},
  {q: "If the area of a triangle with vertices (2,-6), (5,4) and (k,4) is 35 sq units, k is", o: ["12, -2 (29%)", "-12, -2 (21%)", "12, 2 (22%)", "8, -2 (28%)"], a: 0},
  {q: "The cofactor of the element a21 in the determinant |1 2 3; 4 5 6; 7 8 9| is", o: ["6 (29%)", "3 (21%)", "6 (22%)", "-6 (28%)"], a: 2},
  {q: "If A is a square matrix of order n, then |kA| is equal to", o: ["k|A| (29%)", "k²|A| (21%)", "kⁿ|A| (22%)", "nk|A| (28%)"], a: 2},
  {q: "A square matrix A is singular if |A| is", o: ["1 (29%)", "Infinity (21%)", "Positive (22%)", "0 (28%)"], a: 3},
  {q: "If A is a non-singular matrix, then A⁻¹ is given by", o: ["adj A / |A| (29%)", "|A| adj A (21%)", "adj A (22%)", "1/adj A (28%)"], a: 0},
  {q: "The sum of products of elements of any row with their corresponding cofactors is", o: ["|A| (29%)", "0 (21%)", "1 (22%)", "adj A (28%)"], a: 0},
  {q: "The sum of products of elements of any row with cofactors of another row is", o: ["|A| (29%)", "0 (21%)", "1 (22%)", "-|A| (28%)"], a: 1},
  {q: "For a square matrix A, A(adj A) is equal to", o: ["|A|I (29%)", "I (21%)", "adj A (22%)", "|A| (28%)"], a: 0},
  {q: "If A is a square matrix of order 3, then |A . adj A| is", o: ["|A|² (29%)", "|A| (21%)", "|A|³ (22%)", "|A|⁴ (28%)"], a: 2},
  {q: "Minor of an element aij is the determinant obtained by deleting", o: ["i-th row (29%)", "j-th column (21%)", "i-th row and j-th column (22%)", "All rows (28%)"], a: 2},
  {q: "If A = [2 3; 1 4], then its determinant is", o: ["5 (29%)", "11 (21%)", "5 (22%)", "10 (28%)"], a: 2},
  {q: "Which property is used to solve a system of linear equations using matrices?", o: ["X = AB (29%)", "X = A⁻¹B (21%)", "X = B⁻¹A (22%)", "X = |A|B (28%)"], a: 1},
  {q: "If the determinant of a 3x3 matrix is 4, the determinant of its transpose is", o: ["4 (29%)", "-4 (21%)", "1/4 (22%)", "16 (28%)"], a: 0},
  {q: "If each element of a row is multiplied by k, the determinant is", o: ["Unchanged (29%)", "Multiplied by k (21%)", "Divided by k (22%)", "Multiplied by k² (28%)"], a: 1},
  {q: "The determinant of an identity matrix of any order is", o: ["0 (29%)", "n (21%)", "1 (22%)", "-1 (28%)"], a: 2},
  {q: "A system of equations AX=B is inconsistent if |A|=0 and", o: ["(adj A)B = 0 (29%)", "(adj A)B ≠ 0 (21%)", "B = 0 (22%)", "A = I (28%)"], a: 1},
  {q: "If A is a skew-symmetric matrix of odd order, then |A| is", o: ["1 (29%)", "-1 (21%)", "0 (22%)", "k (28%)"], a: 2},
  {q: "If A = [5 0; 0 5], then |A| is", o: ["25 (29%)", "10 (21%)", "5 (22%)", "0 (28%)"], a: 0},
  {q: "Cofactor Aij is related to Minor Mij by the formula", o: ["(-1)ⁱ⁺ʲ Mij (29%)", "Mij (21%)", "(-1)ⁱ Mij (22%)", "(-1)ʲ Mij (28%)"], a: 0},
  {q: "The value of |sin 10° -cos 10°; sin 80° cos 80°| is", o: ["0 (29%)", "1 (21%)", "-1 (22%)", "0.5 (28%)"], a: 1},
  {q: "If A and B are square matrices of order n, then |AB| is", o: ["|A|+|B| (29%)", "|A||B| (21%)", "|A|-|B| (22%)", "|A|/|B| (28%)"], a: 1},
  {q: "If A is a matrix of order 3x3 and |A|=2, then |adj(adj A)| is", o: ["16 (29%)", "8 (21%)", "4 (22%)", "2 (28%)"], a: 0},
  {q: "The determinant |x 2; 3 x| = 0 implies x is", o: ["±√6 (29%)", "6 (21%)", "0 (22%)", "±6 (28%)"], a: 0},
  {q: "Area of triangle with vertices (x1, y1), (x2, y2), (x3, y3) is 0 implies", o: ["Points are collinear (29%)", "Triangle is right-angled (21%)", "Points are on a circle (22%)", "Area is 1 (28%)"], a: 0},
  {q: "The adjoint of A = [a b; c d] is", o: ["[d -b; -c a] (29%)", "[a c; b d] (21%)", "[d b; c a] (22%)", "[-a -b; -c -d] (28%)"], a: 0},
  {q: "If A is a matrix of order 3 and |A|=3, then |2A| is", o: ["24 (29%)", "6 (21%)", "12 (22%)", "18 (28%)"], a: 0},
  {q: "If A is symmetric, then adj A is", o: ["Symmetric (29%)", "Skew-symmetric (21%)", "Diagonal (22%)", "Zero (28%)"], a: 0},
  {q: "If A is a non-singular matrix, then |A⁻¹| is", o: ["1/|A| (29%)", "|A| (21%)", "1 (22%)", "0 (28%)"], a: 0},
  {q: "Determinant |log a log b; log c log d| can be solved using", o: ["Product rule (29%)", "Difference of products (21%)", "Chain rule (22%)", "Sum rule (28%)"], a: 1},
  {q: "If A² - A + I = 0, then A⁻¹ is", o: ["A - I (29%)", "I - A (21%)", "A + I (22%)", "A (28%)"], a: 1},
  {q: "The maximum value of a 2x2 determinant with entries 0 or 1 is", o: ["1 (29%)", "2 (21%)", "0 (22%)", "0.5 (28%)"], a: 0},
  {q: "Consistency of equations is checked using", o: ["|A| (29%)", "adj A (21%)", "A² (22%)", "Trace(A) (28%)"], a: 0}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 10`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_15")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

    
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
