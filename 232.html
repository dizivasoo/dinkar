<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alcohol, Phenol & Ether</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"Which of the following is a trihydric alcohol?",o:["Glycerol","Ethylene glycol","Ethanol","Methanol"],a:0},
  {q:"The process of converting sugar into ethanol using yeast is called:",o:["Fermentation","Distillation","Oxidation","Hydrogenation"],a:0},
  {q:"Which of the following has the highest boiling point?",o:["Propan-1-ol","Propan-2-ol","Ethane","Dimethyl ether"],a:0},
  {q:"The dehydration of ethanol with concentrated H2SO4 at 443K yields:",o:["Ethene","Diethyl ether","Ethane","Ethyne"],a:0},
  {q:"Which alcohol is known as Wood Spirit?",o:["Methanol","Ethanol","Benzyl alcohol","Propanol"],a:0},
  {q:"Lucas reagent is a mixture of:",o:["Anhydrous ZnCl2 and conc. HCl","Anhydrous CaCl2 and conc. HCl","Anhydrous ZnCl2 and conc. HNO3","None of these"],a:0},
  {q:"Phenol is also known as:",o:["Carbolic acid","Carbonic acid","Salicylic acid","Picric acid"],a:0},
  {q:"Which of the following will react most easily with Lucas reagent?",o:["2-Methylpropan-2-ol","Butan-1-ol","Butan-2-ol","Ethanol"],a:0},
  {q:"Aspirin is prepared by the acetylation of:",o:["Salicylic acid","Phenol","Benzaldehyde","Benzoic acid"],a:0},
  {q:"The conversion of Phenol to Salicylaldehyde is known as:",o:["Reimer-Tiemann reaction","Kolbe's reaction","Friedel-Crafts reaction","Wurtz reaction"],a:0},
  {q:"Denatured alcohol contains small amounts of:",o:["Copper sulphate and Pyridine","Methanol only","Water only","Acetone only"],a:1},
  {q:"Phenol reacts with Zn dust to give:",o:["Benzene","Phenoxide","Cyclohexane","Zinc phenate"],a:1},
  {q:"The major product obtained when phenol reacts with Br2 in CS2 is:",o:["p-Bromophenol","2,4,6-Tribromophenol","m-Bromophenol","o-Bromophenol"],a:1},
  {q:"Ethers are isomeric with:",o:["Alcohols","Aldehydes","Ketones","Acids"],a:1},
  {q:"Diethyl ether can be prepared by heating ethyl bromide with:",o:["Dry silver oxide","Aqueous KOH","Moist silver oxide","Sodium metal"],a:1},
  {q:"Williamson synthesis is used to prepare:",o:["Ethers","Alcohols","Phenols","Aldehydes"],a:1},
  {q:"Which of the following is the most acidic?",o:["p-Nitrophenol","Phenol","p-Cresol","o-Cresol"],a:1},
  {q:"The boiling point of alcohols are higher than ethers due to:",o:["Intermolecular H-bonding","Intramolecular H-bonding","Van der Waals forces","Ion-dipole interaction"],a:0},
  {q:"The acid catalyzed dehydration of secondary alcohols follows:",o:["E1 mechanism","E2 mechanism","SN1 mechanism","SN2 mechanism"],a:1},
  {q:"Which reagent converts an alcohol directly into an alkyl chloride?",o:["SOCl2","HCl","NaCl","Cl2"],a:0},
  {q:"Primary alcohols on oxidation with PCC (Pyridinium chlorochromate) give:",o:["Aldehydes","Ketones","Carboxylic acids","Esters"],a:2},
  {q:"Heating phenol with sodium hydroxide and CO2 followed by acidification gives:",o:["Salicylic acid","Salicylaldehyde","Benzoic acid","Phthalic acid"],a:2},
  {q:"Cresol is a:",o:["Methyl phenol","Hydroxy benzaldehyde","Dihydroxy benzene","Ethyl phenol"],a:2},
  {q:"Which of the following will not form a blue color with FeCl3?",o:["Ethanol","Phenol","o-Cresol","Resorcinol"],a:2},
  {q:"Hydroboration-oxidation of propene gives:",o:["Propan-1-ol","Propan-2-ol","Propane","Propanone"],a:2},
  {q:"The bond angle C-O-H in alcohols is slightly:",o:["Less than tetrahedral angle","More than tetrahedral angle","Exactly 109.5°","180°"],a:2},
  {q:"Ethers are generally:",o:["Inert toward bases","Highly reactive toward acids","Low boiling liquids","Highly polar"],a:2},
  {q:"Which of the following is used as an antifreeze in automobile radiators?",o:["Ethylene glycol","Ethanol","Methanol","Nitroglycerine"],a:3},
  {q:"The C-O-C bond angle in ethers is approximately:",o:["110°","109.5°","180°","120°"],a:3},
  {q:"Phenol is less acidic than:",o:["o-Nitrophenol","Ethanol","Methanol","p-Methoxyphenol"],a:3},
  {q:"Identification of 1°, 2°, and 3° alcohols can be done by:",o:["Victor Meyer's test","Lucas test","Oxidation method","All of these"],a:3},
  {q:"Which of the following is Picric acid?",o:["2,4,6-Trinitrophenol","Trinitrotoluene","m-Nitrophenol","p-Nitrophenol"],a:3},
  {q:"The ether used as an anesthetic is:",o:["Diethyl ether","Dimethyl ether","Methyl ethyl ether","Dipropyl ether"],a:3},
  {q:"Cleavage of ethers by HI follows SN2 mechanism when:",o:["Alkyl groups are primary","Alkyl groups are secondary","Reaction is at high temp","One alkyl group is tertiary"],a:3},
  {q:"Reaction of Grignard reagent with Formaldehyde gives:",o:["Primary alcohol","Secondary alcohol","Tertiary alcohol","Ketone"],a:3}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_11")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
