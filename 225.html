<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> chemical kinetics </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  { q: "The rate of a chemical reaction tells us about:", o: ["The energy of the reaction", "The speed of the reaction", "The direction of the reaction", "The heat evolved"], a: 1 },
  { q: "The unit of rate of reaction is:", o: ["mol L^-1", "mol L^-1 s^-1", "L mol^-1 s^-1", "s^-1"], a: 1 },
  { q: "For a zero-order reaction, the unit of rate constant is:", o: ["s^-1", "L mol^-1 s^-1", "mol L^-1 s^-1", "mol L s^-1"], a: 2 },
  { q: "The overall order of a reaction for which rate = k[A]^(1/2) [B]^(3/2) is:", o: ["1", "1.5", "2", "3"], a: 2 },
  { q: "A catalyst increases the rate of reaction by:", o: ["Increasing activation energy", "Increasing enthalpy", "Decreasing activation energy", "Decreasing enthalpy"], a: 2 },
  { q: "The half-life of a first-order reaction is:", o: ["Dependent on initial concentration", "0.693/k", "k/0.693", "2k/0.693"], a: 1 },
  { q: "In a pseudo-first-order reaction, one of the reactants is present in:", o: ["Small amount", "Catalytic amount", "Excess amount", "Equal amount"], a: 2 },
  { q: "The temperature coefficient of most reactions lies between:", o: ["1 and 2", "2 and 3", "3 and 4", "1 and 4"], a: 1 },
  { q: "Which of the following does not affect the rate of reaction?", o: ["Concentration", "Temperature", "Enthalpy of reaction", "Catalyst"], a: 2 },
  { q: "The minimum energy required by a molecule to react is called:", o: ["Kinetic energy", "Potential energy", "Threshold energy", "Activation energy"], a: 2 },
  { q: "For a first-order reaction, the plot of ln[A] vs t is a straight line with slope:", o: ["k", "-k", "0.693", "log k"], a: 1 },
  { q: "The rate constant of a reaction depends on:", o: ["Concentration", "Time", "Temperature", "Pressure"], a: 2 },
  { q: "The order of a reaction can be:", o: ["Zero", "Fractional", "Integer", "All of these"], a: 3 },
  { q: "A photochemical reaction is usually of order:", o: ["First", "Second", "Zero", "Third"], a: 2 },
  { q: "The number of reacting species taking part in an elementary reaction is called:", o: ["Order", "Half-life", "Molecularity", "Rate"], a: 2 },
  { q: "Arrhenius equation is represented as:", o: ["k = Ae^(Ea/RT)", "k = Ae^(-Ea/RT)", "k = Ae^(RT/Ea)", "k = ln A - Ea/RT"], a: 1 },
  { q: "If the concentration of reactant is doubled and rate remains same, the order is:", o: ["1", "2", "0", "0.5"], a: 2 },
  { q: "Which of the following is correct for a first-order reaction?", o: ["t1/2 ∝ a", "t1/2 ∝ 1/a", "t1/2 is independent of a", "t1/2 ∝ a^2"], a: 2 },
  { q: "The value of rate constant for a zero-order reaction is k. The time for completion is:", o: ["k/a", "a/2k", "a/k", "0.693/k"], a: 2 },
  { q: "Activation energy is calculated using:", o: ["Nernst equation", "Van't Hoff equation", "Arrhenius equation", "Raoult's Law"], a: 2 },
  { q: "The rate of a gaseous reaction depends on:", o: ["Volume", "Nature of container", "Partial pressure", "Humidity"], a: 2 },
  { q: "Collision theory is applicable to:", o: ["Unimolecular reactions", "Bimolecular reactions", "Zero-order reactions", "All reactions"], a: 1 },
  { q: "The slope of a graph between log k and 1/T is:", o: ["Ea/2.303R", "-Ea/R", "-Ea/2.303R", "2.303R/Ea"], a: 2 },
  { q: "Decomposition of NH3 on platinum surface is a:", o: ["First-order reaction", "Second-order reaction", "Zero-order reaction", "Third-order reaction"], a: 2 },
  { q: "For a reaction A + B → C, if [A] is doubled, rate doubles. If [B] is doubled, rate quadruples. Rate law is:", o: ["k[A][B]", "k[A]^2[B]", "k[A][B]^2", "k[A]^2[B]^2"], a: 2 },
  { q: "Molecularity of a reaction can never be:", o: ["1", "2", "0", "3"], a: 2 },
  { q: "Hydrolysis of ethyl acetate in acidic medium is:", o: ["First-order", "Second-order", "Pseudo-first-order", "Zero-order"], a: 2 },
  { q: "Effective collisions are those in which molecules have:", o: ["Threshold energy", "Proper orientation", "High velocity", "Both A and B"], a: 3 },
  { q: "The time taken for 75% completion of a first-order reaction is:", o: ["t1/2", "3 * t1/2", "2 * t1/2", "1.5 * t1/2"], a: 2 },
  { q: "Specific reaction rate is another name for:", o: ["Rate of reaction", "Average rate", "Rate constant", "Molecularity"], a: 2 },
  { q: "Unit of rate constant for a second-order reaction is:", o: ["s^-1", "mol L^-1 s^-1", "L mol^-1 s^-1", "L^2 mol^-2 s^-1"], a: 2 },
  { q: "For a reaction A → B, the rate law is rate = k[A]. If 50% reacts in 10 min, 75% reacts in:", o: ["15 min", "25 min", "20 min", "40 min"], a: 2 },
  { q: "The energy of activation is zero. The rate constant k is equal to:", o: ["Zero", "Frequency factor (A)", "Infinity", "ln A"], a: 1 },
  { q: "Which of the following is an endothermic reaction?", o: ["Combustion", "Neutralization", "Photosynthesis", "Respiration"], a: 2 },
  { q: "In the expression Rate = k[A]^n, if n is negative, the rate _________ as [A] increases.", o: ["Increases", "Remains same", "Decreases", "Becomes zero"], a: 2 }
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_4")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>


<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
