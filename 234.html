<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> amines </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35 </div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"Which of the following is the strongest base in aqueous solution?",o:["Diethylamine","Ethylamine","Triethylamine","Ammonia"],a:0},
  {q:"Hinsberg's reagent is:",o:["Benzene sulphonyl chloride","Benzene sulphonic acid","Phenyl isocyanide","Benzene amide"],a:0},
  {q:"The reduction of nitrobenzene with Sn/HCl gives:",o:["Aniline","Azobenzene","Hydrazobenzene","Nitrosobenzene"],a:0},
  {q:"The IUPAC name of C6H5NH2 is:",o:["Aniline","Benzeneamine","Amino benzene","All of these"],a:0},
  {q:"Which of the following will give Carbylamine test?",o:["Primary amines","Secondary amines","Tertiary amines","All of these"],a:0},
  {q:"The correct order of basic strength of methyl substituted amines in gaseous phase is:",o:["3° > 2° > 1° > NH3","NH3 > 1° > 2° > 3°","2° > 1° > 3° > NH3","2° > 3° > 1° > NH3"],a:0},
  {q:"Mendius reaction involves the reduction of alkyl cyanides with:",o:["Na / C2H5OH","LiAlH4","Sn / HCl","Zn / HCl"],a:0},
  {q:"Aniline on treatment with bromine water gives a white precipitate of:",o:["2,4,6-Tribromoaniline","o-Bromoaniline","p-Bromoaniline","m-Bromoaniline"],a:0},
  {q:"Which of the following reacts with Hinsberg reagent to give a product insoluble in alkali?",o:["Secondary amine","Primary amine","Tertiary amine","Quaternary salt"],a:0},
  {q:"The hybridisation of nitrogen in amines is:",o:["sp3","sp2","sp","dsp2"],a:0},
  {q:"Hoffmann Bromamide degradation reaction is used to prepare:",o:["Primary amines","Secondary amines","Tertiary amines","Amides"],a:0},
  {q:"The foul-smelling substance produced in the carbylamine test is:",o:["Alkyl isocyanide","Alkyl cyanide","Alkyl nitrite","Nitroalkane"],a:0},
  {q:"Gabriel Phthalimide synthesis is used for the preparation of:",o:["Pure primary aliphatic amines","Secondary amines","Aromatic amines","Tertiary amines"],a:0},
  {q:"Electrophilic substitution of aniline usually occurs at:",o:["Ortho and Para","Meta","Only Para","Only Meta"],a:1},
  {q:"Which of the following is most basic?",o:["Benzylamine","Aniline","p-Nitroaniline","m-Nitroaniline"],a:1},
  {q:"Aniline reacts with conc. HNO3 and conc. H2SO4 to give a significant amount of:",o:["m-Nitroaniline","p-Nitroaniline","o-Nitroaniline","Nitrobenzene"],a:1},
  {q:"The test used to distinguish between primary, secondary and tertiary amines is:",o:["Hinsberg's test","Fehling's test","Iodoform test","Tollen's test"],a:1},
  {q:"Benzene diazunium chloride reacts with phenol in basic medium to give:",o:["p-Hydroxyazobenzene","Aniline","Chlorobenzene","Benzene"],a:1},
  {q:"Acetylation of aniline with acetic anhydride gives:",o:["Acetanilide","N-Methylaniline","Nitrobenzene","Benzamide"],a:1},
  {q:"Coupling reaction of diazonium salts is an example of:",o:["Electrophilic substitution","Nucleophilic substitution","Addition","Elimination"],a:1},
  {q:"Nitrous acid (NaNO2 + HCl) reacts with primary aliphatic amines to give:",o:["Alcohols","Nitroalkanes","Nitrites","Cyanides"],a:1},
  {q:"Which of the following cannot be prepared by Gabriel Phthalimide synthesis?",o:["Aniline","Methylamine","Ethylamine","Isopropylamine"],a:2},
  {q:"Direct nitration of aniline is difficult because:",o:["The amino group is oxidized","Aniline is highly stable","The NH2 group gets protonated to meta-directing group","It reacts with water"],a:2},
  {q:"In the reaction C6H5NH2 + CHCl3 + KOH, the product is:",o:["C6H5NC","C6H5CN","C6H5Cl","C6H5OH"],a:2},
  {q:"Sandmeyer reaction is used to prepare:",o:["Chlorobenzene","Bromobenzene","Both A and B","Iodobenzene"],a:2},
  {q:"Which of the following amines does not react with nitrous acid to form nitrogen gas?",o:["Trimethylamine","Ethylamine","Aniline","Isopropylamine"],a:3},
  {q:"The starting material for the preparation of p-aminoazobenzene is:",o:["Aniline","Nitrobenzene","Phenol","Benzene diazonium chloride"],a:3},
  {q:"Reduction of alkyl isocyanides with sodium and ethanol gives:",o:["Secondary amines","Primary amines","Tertiary amines","Amides"],a:0},
  {q:"Aniline is less basic than ammonia because of:",o:["Resonance effect","Inductive effect","Electromeric effect","None of these"],a:3},
  {q:"The boiling point of amines follows the order:",o:["1° > 2° > 3°","3° > 2° > 1°","2° > 1° > 3°","1° > 3° > 2°"],a:3},
  {q:"Which reagent converts an amide into an amine with the same number of carbons?",o:["LiAlH4","Br2 / KOH","PCl5","SOCl2"],a:3},
  {q:"Aromatic diazonium salts are stable at:",o:["0-5 °C","Room temperature","100 °C","50 °C"],a:3},
  {q:"Aniline on heating with fuming sulphuric acid gives:",o:["Sulphanilic acid","Benzene sulphonic acid","o-Nitroaniline","m-Nitroaniline"],a:3},
  {q:"The nitrogen atom in amines is:",o:["Trivalent","Tetravalent","Divalent","Monovalent"],a:3},
  {q:"Which of the following will not undergo coupling with diazonium salt?",o:["Nitrobenzene","Phenol","Aniline","N,N-Dimethylaniline"],a:3}
];
let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_33")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

  
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
