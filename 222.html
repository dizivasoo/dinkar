<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> solid state </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  { q: "Which of the following is an example of a covalent network solid semiconductor?", o: ["Aluminium", "Silicon", "Sodium Chloride", "Argon"], a: 1 },
  { q: "The conductivity of a semiconductor ________ with an increase in temperature.", o: ["Decreases", "Increases", "Remains constant", "First increases then decreases"], a: 1 },
  { q: "Doping Silicon with Boron (Group 13) leads to the formation of a/an:", o: ["n-type semiconductor", "p-type semiconductor", "Intrinsic semiconductor", "Insulator"], a: 1 },
  { q: "In n-type semiconductors, the majority charge carriers are:", o: ["Holes", "Electrons", "Ions", "Protons"], a: 1 },
  { q: "Which element acts as a donor impurity for Germanium?", o: ["Indium", "Boron", "Phosphorus", "Aluminium"], a: 2 },
  { q: "The forbidden energy gap in insulators is typically:", o: ["Very small", "Zero", "Very large (> 3eV)", "None of these"], a: 2 },
  { q: "F-centres in a crystal are an example of:", o: ["p-type doping", "Impurity defect", "Metal excess defect", "Stoichiometric defect"], a: 2 },
  { q: "Which of the following is a 12-16 compound semiconductor?", o: ["GaAs", "InSb", "ZnS", "SiC"], a: 2 },
  { q: "To get an n-type semiconductor from Silicon, it should be doped with a substance with valence electrons:", o: ["2", "3", "5", "1"], a: 2 },
  { q: "Pure Silicon and Germanium are examples of:", o: ["Extrinsic semiconductors", "Intrinsic semiconductors", "Superconductors", "Non-metals"], a: 1 },
  { q: "In a p-type semiconductor, the 'holes' are:", o: ["Positively charged ions", "Missing electrons in the lattice", "Protons", "Neutrons"], a: 1 },
  { q: "The gap between valence band and conduction band is called:", o: ["Fermi level", "Overlapping zone", "Band gap", "Conductive path"], a: 2 },
  { q: "Which of the following is a 13-15 compound semiconductor?", o: ["ZnO", "CdS", "GaAs", "NaCl"], a: 2 },
  { q: "Schottky defect is generally observed in:", o: ["Semiconductors", "Highly ionic compounds", "Non-polar solids", "Molecular solids"], a: 1 },
  { q: "Which defect increases the density of the crystal?", o: ["Frenkel defect", "Schottky defect", "Interstitial defect", "None of these"], a: 2 },
  { q: "An example of a metal deficiency defect is shown by:", o: ["NaCl", "FeO", "KCl", "ZnO"], a: 1 },
  { q: "The number of valence electrons in a Pentavalent impurity is:", o: ["3", "4", "5", "6"], a: 2 },
  { q: "Zinc Oxide (ZnO) turns yellow on heating due to:", o: ["Frenkel defect", "Metal deficiency defect", "Metal excess defect", "Schottky defect"], a: 2 },
  { q: "A hole in p-type semiconductor behaves like a:", o: ["Negative charge", "Positive charge", "Neutral particle", "Photon"], a: 1 },
  { q: "Electrical conductivity of semiconductors is in the range of (in $ohm^{-1} m^{-1}$):", o: ["$10^{-20}$ to $10^{-10}$", "$10^4$ to $10^7$", "$10^{-6}$ to $10^4$", "$10^{10}$ to $10^{15}$"], a: 2 },
  { q: "Which of the following is a paramagnetic solid?", o: ["$H_2O$", "$C_6H_6$", "$O_2$", "$NaCl$"], a: 2 },
  { q: "Doping is the process of:", o: ["Purifying a metal", "Adding a small amount of impurity", "Heating a crystal", "Cooling a crystal"], a: 1 },
  { q: "When $SrCl_2$ is added to $NaCl$ crystal, it creates:", o: ["Electron vacancies", "Cation vacancies", "Anion vacancies", "F-centres"], a: 1 },
  { q: "Gallium Arsenide is used in making:", o: ["Glass", "Fertilizers", "Photovoltaic cells", "Paints"], a: 2 },
  { q: "The band theory explains conductivity based on:", o: ["Nuclear size", "Molecular weight", "Overlapping of atomic orbitals", "Dipole moment"], a: 2 },
  { q: "Which of the following transition metal oxides shows electrical properties like metals?", o: ["$TiO$", "$CrO_2$", "$ReO_3$", "All of these"], a: 3 },
  { q: "In a semiconductor, the conduction band is:", o: ["Completely filled", "Empty or partially filled", "Below the valence band", "None of these"], a: 1 },
  { q: "Germanium doped with Aluminium is:", o: ["n-type", "p-type", "Intrinsic", "Insulator"], a: 1 },
  { q: "Which property is characteristic of Ferrimagnetic substances?", o: ["Parallel domains", "Anti-parallel domains", "Unequal parallel/anti-parallel domains", "No domains"], a: 2 },
  { q: "Which of the following is a Non-stoichiometric defect?", o: ["Schottky", "Frenkel", "Metal excess", "Interstitial"], a: 2 },
  { q: "Conductivity of Ge is increased by adding:", o: ["Cu", "Al", "As", "Both B and C"], a: 3 },
  { q: "Silicon is a:", o: ["Conductor", "Semiconductor", "Insulator", "None of these"], a: 1 },
  { q: "Which of the following are called 'holes'?", o: ["Negative vacancies", "Protons", "Electron vacancies", "Neutrons"], a: 2 },
  { q: "Semiconductors are used in:", o: ["Transistors", "Rectifiers", "Both A and B", "None"], a: 2 },
  { q: "What is the effect of doping on the resistance of a semiconductor?", o: ["Increases", "Decreases", "Remains same", "None"], a: 1 }
];



let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_1")

  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
