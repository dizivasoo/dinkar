<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> electrostatic potential and capacitance </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"The SI unit of electrostatic potential is",o:["Joule","Volt","Farad","Coulomb"],a:1},
  {q:"Work done in moving a charge between two points on an equipotential surface is",o:["Zero","Positive","Negative","Infinite"],a:0},
  {q:"The electrostatic potential at a point on the equator of an electric dipole is",o:["Maximum","Minimum","Zero","Constant"],a:2},
  {q:"The SI unit of capacitance is",o:["Ohm","Henry","Farad","Tesla"],a:2},
  {q:"If the distance between two plates of a parallel plate capacitor is doubled, its capacitance",o:["Doubles","Is halved","Remains same","Becomes zero"],a:1},
  {q:"Dielectric constant of a metal is",o:["Zero","One","Infinite","Negative"],a:2},
  {q:"Potential energy of a system of two charges is given by",o:["kq1q2/r","kq1q2/r²","1/2 CV²","Zero"],a:0},
  {q:"The capacity of a spherical conductor of radius R is",o:["4πε₀R","4πε₀/R","R/4πε₀","4πε₀R²"],a:0},
  {q:"The electric potential inside a hollow charged sphere is",o:["Zero","Uniform","Increasing","Decreasing"],a:1},
  {q:"Three capacitors of 3μF each are connected in series. The equivalent capacitance is",o:["9μF","1μF","3μF","0.33μF"],a:1},
  {q:"The energy stored in a capacitor of capacitance C and potential V is",o:["CV","1/2 CV²","C/V","V/C"],a:1},
  {q:"When a dielectric slab is introduced between plates of a capacitor, the capacitance",o:["Decreases","Increases","Remains same","Becomes zero"],a:1},
  {q:"The potential at a point due to a point charge 'q' at distance 'r' is proportional to",o:["r","1/r","r²","1/r²"],a:1},
  {q:"Direction of electric field is always ______ to the equipotential surface",o:["Parallel","Normal","At 45°","Opposite"],a:1},
  {q:"Van de Graaff generator is used to produce high",o:["Current","Voltage","Resistance","Power"],a:1},
  {q:"A capacitor blocks ______ current in steady state",o:["AC","DC","Both","Neither"],a:1},
  {q:"The equivalent capacitance of capacitors in parallel is",o:["C1+C2","1/C1+1/C2","C1-C2","C1*C2"],a:0},
  {q:"Polar molecules have a permanent",o:["Magnetic moment","Dipole moment","Charge","Volume"],a:1},
  {q:"Unit of dielectric strength is",o:["V/m","V-m","C/m","Farad"],a:0},
  {q:"If a capacitor is charged and then disconnected from a battery, the charge",o:["Increases","Decreases","Remains constant","Becomes zero"],a:2},
  {q:"The surface of a charged conductor is always",o:["An insulator","An equipotential surface","Non-linear","Positively charged"],a:1},
  {q:"Work done to rotate a dipole from 0° to 180° in a field E is",o:["pE","2pE","Zero","-pE"],a:1},
  {q:"Which of the following is a scalar quantity?",o:["Electric Field","Electric Potential","Force","Acceleration"],a:1},
  {q:"In a parallel plate capacitor, if area is doubled, capacitance is",o:["Halved","Doubled","Quadrupled","Same"],a:1},
  {q:"The potential at infinity is taken as",o:["Maximum","Infinite","Zero","One"],a:2},
  {q:"The ratio of charge to potential is called",o:["Resistance","Inductance","Capacitance","Current"],a:2},
  {q:"If three capacitors of 2μF are in parallel, total capacitance is",o:["6μF","2μF","0.66μF","1μF"],a:0},
  {q:"Potential gradient is equal to",o:["Electric Field","Flux","Charge","Work"],a:0},
  {q:"1 Volt is equivalent to",o:["1 J/C","1 C/J","1 N/C","1 J/s"],a:0},
  {q:"The force between plates of a parallel plate capacitor is",o:["q²/2Aε₀","q/Aε₀","Zero","qE"],a:0},
  {q:"Two capacitors are in series. They must have the same",o:["Voltage","Charge","Capacitance","Energy"],a:1},
  {q:"The electron-volt (eV) is a unit of",o:["Potential","Charge","Energy","Power"],a:2},
  {q:"Electric field is zero where potential is",o:["Zero","Constant","Maximum","Minimum"],a:1},
  {q:"The dimension of capacitance is",o:["[M⁻¹L⁻²T⁴A²]","[ML²T⁻³A⁻¹]","[MLT]","[A T]"],a:0},
  {q:"Sharing of charges between two conductors results in loss of",o:["Charge","Potential","Energy","Mass"],a:2}
];


let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 10`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 10 - score;
  const degree = (correct / 10) * 360;
localStorage.getItem("physics_chapter_2")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 10
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

      <button class="btn" onclick="location.reload()">Retake Test</button>
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
