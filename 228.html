<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> the p block </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

  <div class="question" id="questionText"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>

  </button>

<script>
/* QUESTIONS */
const questions = [
  {q:"Which of the following noble gases is used in weather balloons?",o:["Helium","Neon","Argon","Krypton"],a:0},
  {q:"The geometry of XeF4 is:",o:["Square planar","Tetrahedral","Octahedral","Pyramidal"],a:0},
  {q:"Which element has the highest electron gain enthalpy in Group 17?",o:["Chlorine","Fluorine","Bromine","Iodine"],a:0},
  {q:"In the Haber's process for ammonia, the catalyst used is:",o:["Iron","Copper","Nickel","Platinum"],a:0},
  {q:"The most abundant noble gas in the atmosphere is:",o:["Argon","Helium","Neon","Radon"],a:0},
  {q:"Which acid is known as the 'Oil of Vitriol'?",o:["Sulphuric acid","Nitric acid","Hydrochloric acid","Phosphoric acid"],a:0},
  {q:"The basicity of Orthophosphoric acid (H3PO4) is:",o:["3","1","2","4"],a:0},
  {q:"White phosphorus is stored in:",o:["Water","Kerosene","Alcohol","Ether"],a:0},
  {q:"Which of the following is the strongest oxidizing agent?",o:["Fluorine","Chlorine","Bromine","Iodine"],a:1},
  {q:"Brown ring test is used for the detection of:",o:["Nitrates","Nitrites","Chlorides","Sulphates"],a:1},
  {q:"The shape of ClF3 molecule is:",o:["T-shaped","Trigonal planar","Square pyramidal","Bent"],a:1},
  {q:"Which phosphorus allotrope is thermodynamically most stable?",o:["Black phosphorus","White phosphorus","Red phosphorus","Yellow phosphorus"],a:1},
  {q:"The oxidation state of Oxygen in OF2 is:",o:["+2","+1","-1","-2"],a:1},
  {q:"Which catalyst is used in the Contact Process for H2SO4?",o:["V2O5","Fe2O3","MnO2","Pt"],a:1},
  {q:"The hybridisation of Xenon in XeF2 is:",o:["sp3d","sp3","sp3d2","sp2"],a:1},
  {q:"Which of the following does not form hydrogen bonds?",o:["HCl","HF","NH3","H2O"],a:1},
  {q:"The mixture of conc. HCl and conc. HNO3 in 3:1 ratio is:",o:["Aqua regia","Vinegar","Oleum","Bleaching liquor"],a:1},
  {q:"Which p-block element shows the maximum number of oxidation states?",o:["Chlorine","Nitrogen","Phosphorus","Sulphur"],a:2},
  {q:"Hexametaphosphate is commonly known as:",o:["Calgon","Hypo","Bakelite","Borax"],a:2},
  {q:"The oxidation state of Phosphorus in H3PO3 is:",o:["+3","+1","+5","-3"],a:2},
  {q:"Which gas is released when Copper reacts with dilute HNO3?",o:["Nitric oxide (NO)","Nitrogen dioxide (NO2)","Nitrous oxide (N2O)","Hydrogen"],a:2},
  {q:"The bleaching action of Chlorine is due to:",o:["Oxidation","Reduction","Hydrogenation","Hydrolysis"],a:2},
  {q:"Which halogen is liquid at room temperature?",o:["Bromine","Fluorine","Chlorine","Iodine"],a:2},
  {q:"The anhydride of Nitric acid is:",o:["N2O5","NO2","N2O3","N2O"],a:2},
  {q:"What is the bond angle in PH3?",o:["Close to 90°","109.5°","120°","180°"],a:2},
  {q:"Which of the following is a neutral oxide?",o:["Nitrous oxide (N2O)","Nitrogen dioxide (NO2)","Phosphorus pentoxide","Sulphur dioxide"],a:2},
  {q:"The correct order of boiling points for Group 16 hydrides is:",o:["H2O > H2Te > H2Se > H2S","H2S > H2Se > H2Te > H2O","H2O > H2S > H2Se > H2Te","H2Te > H2Se > H2S > H2O"],a:2},
  {q:"Which element does not show allotropy?",o:["Nitrogen","Phosphorus","Sulphur","Arsenic"],a:3},
  {q:"The formula of Oleum is:",o:["H2S2O7","H2SO4","H2S2O8","H2SO5"],a:3},
  {q:"Which noble gas has the lowest boiling point?",o:["Helium","Neon","Argon","Xenon"],a:3},
  {q:"PCL5 exists in the solid state as:",o:["[PCl4]+ [PCl6]-","PCl5 molecules","[PCl3]+ [PCl7]-","None of these"],a:3},
  {q:"The bond dissociation enthalpy is lowest for:",o:["I2","F2","Cl2","Br2"],a:3},
  {q:"Deacon’s process is used for the manufacture of:",o:["Chlorine","Ammonia","Sulphuric acid","Nitric acid"],a:3},
  {q:"The tailing of mercury is due to the formation of:",o:["Hg2O","HgO","HgS","Hg(OH)2"],a:3},
  {q:"Which is the strongest acid among the following?",o:["HClO4","HClO3","HClO2","HClO"],a:3}
];




let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_7")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>
