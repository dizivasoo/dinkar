<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> electromagnetic waves </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">

<audio id="wrongSound">

</audio>

<script>
/* QUESTIONS */
const questions = [
  {q:"Which of the following has the shortest wavelength?",o:["Gamma rays","X-rays","Ultraviolet rays","Microwaves"],a:0},
  {q:"Electromagnetic waves are produced by",o:["A static charge","An accelerating charge","A charge moving with constant velocity","None of these"],a:1},
  {q:"The ratio of the amplitude of magnetic field to the amplitude of electric field for an electromagnetic wave propagating in vacuum is",o:["c","1/c","c²","1/c²"],a:1},
  {q:"The velocity of electromagnetic waves in a medium of permittivity ε and permeability μ is",o:["1/√(με)","√(μ/ε)","√(ε/μ)","√(με)"],a:0},
  {q:"The dimension of (1/μ₀ε₀) is same as that of",o:["Velocity","(Velocity)²","Force","Acceleration"],a:1},
  {q:"Which part of the electromagnetic spectrum is used in satellite communication?",o:["Radiowaves","Microwaves","Ultraviolet","Infrared"],a:1},
  {q:"The displacement current arises due to",o:["Flow of electrons","Flow of protons","Change in magnetic flux","Change in electric flux with time"],a:3},
  {q:"Greenhouse effect is caused by",o:["Ultraviolet rays","Infrared rays","X-rays","Gamma rays"],a:1},
  {q:"The source of energy for the sun is",o:["Nuclear fission","Nuclear fusion","Chemical reaction","Gravitational contraction"],a:0},
  {q:"Electromagnetic waves are",o:["Transverse in nature","Longitudinal in nature","Mechanical waves","None of these"],a:0},
  {q:"The ozone layer absorbs",o:["Infrared radiation","Microwaves","Ultraviolet radiation","Visible light"],a:2},
  {q:"Which of the following is used to investigate the structure of crystals?",o:["X-rays","UV rays","Infrared","Microwaves"],a:0},
  {q:"The waves used in 'night vision' cameras are",o:["X-rays","Microwaves","Infrared","Gamma rays"],a:2},
  {q:"The amplitude of electric and magnetic fields in an EM wave are related as",o:["E₀ = B₀/c","E₀ = cB₀","E₀ = c/B₀","E₀ = B₀"],a:1},
  {q:"According to Maxwell, a changing electric field produces",o:["Electric pressure","Magnetic field","Electric current","Radiation pressure"],a:1},
  {q:"The frequency of visible light is of the order of",o:["10¹⁵ Hz","10¹⁰ Hz","10⁸ Hz","10⁴ Hz"],a:0},
  {q:"Which electromagnetic wave is used in RADAR systems?",o:["Ultraviolet","Infrared","Microwaves","Gamma rays"],a:2},
  {q:"If E and B are the electric and magnetic field vectors of EM waves, then the direction of propagation of EM wave is along",o:["E","B","E × B","B × E"],a:2},
  {q:"The velocity of EM waves in vacuum is",o:["3 × 10⁸ m/s","3 × 10¹⁰ m/s","3 × 10⁶ m/s","Depends on frequency"],a:0},
  {q:"Which of the following is NOT an electromagnetic wave?",o:["X-rays","Sound waves","Gamma rays","Microwaves"],a:1},
  {q:"The physical quantity that remains same for all EM waves in vacuum is",o:["Wavelength","Frequency","Speed","Energy"],a:2},
  {q:"In an EM wave, the phase difference between electric and magnetic field vectors is",o:["0","π/2","π","π/4"],a:0},
  {q:"The wave with the highest frequency is",o:["Radio waves","Gamma rays","Microwaves","Visible light"],a:1},
  {q:"Maxwell's modified Ampere's Law is",o:["∮B·dl = μ₀I","∮B·dl = μ₀(I + I_d)","∮E·dA = Q/ε₀","∮B·dA = 0"],a:1},
  {q:"The pressure exerted by an electromagnetic wave on a surface is called",o:["Magnetic pressure","Radiation pressure","Electric pressure","Thermal pressure"],a:1},
  {q:"Water purifier mostly uses",o:["Infrared rays","Microwaves","Ultraviolet rays","X-rays"],a:2},
  {q:"If the wavelength of light is 4000Å, then its frequency is",o:["7.5 × 10¹⁴ Hz","5 × 10¹⁴ Hz","3 × 10¹⁴ Hz","6 × 10¹⁴ Hz"],a:0},
  {q:"Welders wear special glass goggles to protect their eyes from",o:["Infrared rays","Microwaves","X-rays","UV rays"],a:3},
  {q:"Which of the following travels with the speed of light?",o:["α-rays","β-rays","γ-rays","Cathode rays"],a:2},
  {q:"The value of displacement current is equal to",o:["ε₀(dΦ_E/dt)","μ₀(dΦ_B/dt)","(dΦ_E/dt)","ε₀E/t"],a:0},
  {q:"Electromagnetic waves carry",o:["Charge","Mass","Energy and Momentum","None of these"],a:2},
  {q:"Radio waves are reflected back to earth by the",o:["Troposphere","Stratosphere","Ionosphere","Mesosphere"],a:2},
  {q:"The wavelength of visible light ranges from",o:["400 nm to 750 nm","1 nm to 100 nm","1 mm to 1 m","10 m to 100 m"],a:0},
  {q:"Who first experimentally demonstrated the existence of EM waves?",o:["Maxwell","Hertz","Marconi","Ampere"],a:1},
  {q:"The energy of EM waves is divided",o:["Equally between E and B","More in E than B","More in B than E","Depends on wavelength"],a:0}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("physics_chapter_8")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>
