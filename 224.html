<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> electrochemistry </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 10</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  { q: "The unit of molar conductivity is:", o: ["S cm^2 mol^-1", "S cm^-1", "S cm^2 mol", "S cm^2"], a: 0 },
  { q: "Which of the following is a secondary cell?", o: ["Leclanche cell", "Mercury cell", "Lead storage battery", "Dry cell"], a: 2 },
  { q: "The standard electrode potential for Hydrogen electrode is:", o: ["1.0 V", "0.0 V", "0.5 V", "2.0 V"], a: 1 },
  { q: "Kohlrausch's law is applicable for:", o: ["Strong electrolytes", "Weak electrolytes", "Both strong and weak", "None"], a: 2 },
  { q: "The device that converts chemical energy into electrical energy is:", o: ["Galvanic cell", "Electrolytic cell", "Radiometer", "Voltmeter"], a: 0 },
  { q: "During the electrolysis of aqueous NaCl, the gas liberated at the cathode is:", o: ["Chlorine", "Oxygen", "Hydrogen", "Sodium vapor"], a: 2 },
  { q: "The electrode potential depends on:", o: ["Nature of metal", "Concentration of ions", "Temperature", "All of these"], a: 3 },
  { q: "Specific conductance (Kappa) increases with:", o: ["Increase in concentration", "Increase in dilution", "Decrease in temperature", "None"], a: 0 },
  { q: "A fuel cell converts the energy of combustion of fuels directly into:", o: ["Heat energy", "Mechanical energy", "Electrical energy", "Solar energy"], a: 2 },
  { q: "The quantity of charge required to obtain 1 mole of Aluminum from Al3+ is:", o: ["1 F", "2 F", "3 F", "4 F"], a: 2 },
  { q: "Rusting of iron is an example of:", o: ["Electrochemical phenomenon", "Reduction", "Photo-oxidation", "None"], a: 0 },
  { q: "In a Galvanic cell, the anode is:", o: ["Positive", "Negative", "Neutral", "None"], a: 1 },
  { q: "The salt bridge is used to:", o: ["Complete the circuit", "Maintain neutrality", "Both A and B", "Increase voltage"], a: 2 },
  { q: "Which of the following metals can displace Hydrogen from dilute acids?", o: ["Copper", "Silver", "Zinc", "Gold"], a: 2 },
  { q: "According to Faraday's first law, the mass deposited is proportional to:", o: ["Current density", "Charge", "Resistance", "Voltage"], a: 1 },
  { q: "For a spontaneous reaction, ΔG must be:", o: ["Positive", "Zero", "Negative", "One"], a: 2 },
  { q: "Molar conductivity of weak electrolytes _________ steeply with dilution.", o: ["Increases", "Decreases", "Remains constant", "First decreases then increases"], a: 0 },
  { q: "The potential of a cell under standard conditions is E° cell = :", o: ["E(left) - E(right)", "E(right) - E(left)", "E(anode) - E(cathode)", "None"], a: 1 },
  { q: "One Faraday is equal to approximately:", o: ["96500 C", "95600 C", "69500 C", "90000 C"], a: 0 },
  { q: "Which substance is used as an electrolyte in a dry cell?", o: ["H2SO4", "KOH", "NH4Cl + ZnCl2", "NaOH"], a: 2 },
  { q: "In electrolysis, oxidation takes place at:", o: ["Anode", "Cathode", "Both", "None"], a: 0 },
  { q: "The cell constant of a conductivity cell is:", o: ["l/A", "A/l", "R/l", "l*A"], a: 0 },
  { q: "The most powerful reducing agent among the following is:", o: ["F2", "Cl2", "Li", "Na"], a: 2 },
  { q: "Reduction potential of an element is 0.80V. It will act as a:", o: ["Strong reducing agent", "Strong oxidizing agent", "Weak oxidizing agent", "None"], a: 1 },
  { q: "Copper can be electroplated using a solution of:", o: ["NaCl", "CuSO4", "AgNO3", "ZnSO4"], a: 1 },
  { q: "The conductivity of electrolytic conductor is due to:", o: ["Flow of electrons", "Flow of ions", "Flow of atoms", "None"], a: 1 },
  { q: "The Nernst equation relates electrode potential with:", o: ["Concentration", "Pressure", "Mass", "Volume"], a: 0 },
  { q: "Which of the following is an insulator?", o: ["Graphite", "Copper", "Diamond", "Silver"], a: 2 },
  { q: "On increasing the temperature, the conductivity of an electrolytic solution:", o: ["Decreases", "Increases", "Remains same", "Fluctuates"], a: 1 },
  { q: "Protective coating of which metal is used in galvanization of iron?", o: ["Pb", "Cr", "Zn", "Sn"], a: 2 },
  { q: "The charge on 1 mole of electrons is:", o: ["1.6 x 10^-19 C", "96500 C", "6.023 x 10^23 C", "1 C"], a: 1 },
  { q: "The efficiency of a fuel cell is approximately:", o: ["40%", "100%", "70%", "10%"], a: 2 },
  { q: "Which of the following is not a colligative property?", o: ["Osmotic pressure", "Elevation in BP", "Electrode potential", "Depression in FP"], a: 2 },
  { q: "Standard EMF of a cell with spontaneous reaction is always:", o: ["Negative", "Zero", "Positive", "Infinite"], a: 2 },
  { q: "Mercury cell is used in:", o: ["Automobiles", "Hearing aids", "Solar panels", "Nuclear reactors"], a: 1 }
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35- score;
  const degree = (correct / 35) * 360;
localStorage.getItem("chemistry_chapter_3")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
