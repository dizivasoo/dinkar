<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> diffrential equation </title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

body{
  background:linear-gradient(135deg,#eef2ff,#ecfeff);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= TEST BOX ================= */
.test-box{
  width:95%;
  max-width:520px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.header{
  text-align:center;
  margin-bottom:16px;
}

.header h2{
  font-size:22px;
  font-weight:800;
}

.progress{
  font-size:14px;
  color:#555;
  margin-top:6px;
}

.question{
  font-size:18px;
  font-weight:600;
  margin:20px 0;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.option{
  padding:14px;
  border-radius:12px;
  background:#f1f5f9;
  border:1px solid #e5e7eb;
  cursor:pointer;
  transition:0.2s;
}

.option:hover{
  background:#e0e7ff;
}

.option.correct{
  background:#dcfce7;
  border-color:#22c55e;
  color:#166534;
  font-weight:600;
}

.option.wrong{
  background:#fee2e2;
  border-color:#ef4444;
  color:#7f1d1d;
  font-weight:600;
}

.btn{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:disabled{
  background:#9ca3af;
  cursor:not-allowed;
}

/* ================= RESULT SECTION ================= */
.result-card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(16px);
  border-radius:22px;
  padding:28px;
  box-shadow:0 18px 40px rgba(0,0,0,0.15);
  text-align:center;
}

.result-card h2{
  font-size:24px;
  font-weight:900;
}

/* Donut Chart */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  background:
    conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  position:relative;
  animation:fillDonut 1.2s ease-out;
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

@keyframes fillDonut{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }

}
/* Animated Donut */
.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:22px auto;
  position:relative;

  --angle: 0deg;

  background:conic-gradient(
    #22c55e 0deg,
    #22c55e var(--angle),
    #ef4444 var(--angle),
    #ef4444 360deg
  );

  animation: fillDonut 1.4s ease-out forwards;
}

@keyframes fillDonut{
  from{
    --angle: 0deg;
  }
  to{
    --angle: var(--target);
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  background:rgba(255,255,255,0.95);
  border-radius:50%;
}


@keyframes donutFill{
  from{
    background:conic-gradient(#e5e7eb 0deg,#e5e7eb 360deg);
  }
  to{
    background:conic-gradient(
      #22c55e 0deg,
      #22c55e var(--correct),
      #ef4444 var(--correct),
      #ef4444 360deg
    );
  }
}

.donut::after{
  content:'';
  position:absolute;
  inset:26px;
  border-radius:50%;
  background:rgba(255,255,255,0.95);
}

/* Retake Button */
.retake-btn{
  margin-top:22px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:0.2s;
}

.retake-btn:hover{
  background:#1d4ed8;
}

/* Score */
.result-score{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

.result-stats{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  padding:0 20px;
  font-size:15px;
  font-weight:700;
}
.result-actions{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.btn.secondary{
  background:rgba(255,255,255,0.35);
  color:#1f2937;
  border:1px solid rgba(255,255,255,0.5);
  backdrop-filter:blur(10px);
}

.btn.secondary:hover{
  background:rgba(255,255,255,0.55);
}

.correct-text{color:#16a34a}
.wrong-text{color:#dc2626}
</style>
</head>

<body>

<div class="test-box">
  <div class="header">
    <h2>Dinkar Test</h2>
    <div class="progress" id="progress">Question 1 / 35</div>
  </div>

  <div class="question" id="questionText"></div>
  <div class="options" id="optionsBox"></div>

  <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
    Next Question
  </button>
</div>

<!-- Sounds -->
<audio id="correctSound">
  <source src="C:\Users\MY-PC\Downloads\successed-295058.mp3">
</audio>

<audio id="wrongSound">
  <source src="C:\Users\MY-PC\Downloads\error-010-206498.mp3">
</audio>

<script>
/* QUESTIONS */
const questions = [
  {q: "The order of the differential equation (d²y/dx²)³ + (dy/dx)² + sin(dy/dx) + 1 = 0 is", o: ["3 (15%)", "2 (23%)", "1 (34%)", "Not defined (28%)"], a: 1},
  {q: "The degree of the differential equation [1 + (dy/dx)²]^(3/2) = d²y/dx² is", o: ["3 (15%)", "1 (23%)", "2 (34%)", "6 (28%)"], a: 2},
  {q: "The number of arbitrary constants in the general solution of a differential equation of fourth order is", o: ["0 (15%)", "2 (23%)", "4 (34%)", "3 (28%)"], a: 2},
  {q: "The number of arbitrary constants in the particular solution of a differential equation of third order is", o: ["3 (15%)", "0 (23%)", "1 (34%)", "2 (28%)"], a: 1},
  {q: "The integrating factor of the differential equation x(dy/dx) - y = 2x² is", o: ["e^-x (15%)", "log x (23%)", "1/x (34%)", "x (28%)"], a: 2},
  {q: "The solution of dy/dx = e^(x+y) is", o: ["e^x + e^y = C (15%)", "e^x - e^y = C (23%)", "e^x + e^-y = C (34%)", "e^-x + e^-y = C (28%)"], a: 2},
  {q: "A homogeneous differential equation of the form dx/dy = h(x/y) can be solved by making the substitution", o: ["y = vx (15%)", "v = xy (23%)", "x = vy (34%)", "x = v (28%)"], a: 2},
  {q: "The integrating factor of dy/dx + y sec x = tan x is", o: ["sec x + tan x (15%)", "sec x - tan x (23%)", "sec x (34%)", "tan x (28%)"], a: 0},
  {q: "The general solution of the differential equation dy/dx = y/x is", o: ["y = kx (15%)", "x = ky (23%)", "xy = k (34%)", "y = x + k (28%)"], a: 0},
  {q: "The degree of the differential equation d²y/dx² + (dy/dx)² + sin y = 0 is", o: ["2 (15%)", "3 (23%)", "1 (34%)", "Not defined (28%)"], a: 2},
  {q: "The solution of dy/dx + y = e^-x is", o: ["y = e^-x(x+C) (15%)", "y = e^x(x+C) (23%)", "y = e^-x + C (34%)", "ye^x = x + C (28%)"], a: 3},
  {q: "Which of the following is a homogeneous differential equation?", o: ["(4x+6y+5)dy - (3y+2x+4)dx = 0 (15%)", "xy dx - (x³+y³)dy = 0 (23%)", "(x³+2y²)dx + 2xy dy = 0 (34%)", "y² dx + (x²-xy-y²)dy = 0 (28%)"], a: 3},
  {q: "The order and degree of the differential equation √(d²y/dx²) = dy/dx + c are", o: ["2, 1 (15%)", "1, 2 (23%)", "2, 2 (34%)", "2, Not defined (28%)"], a: 0},
  {q: "The general solution of dy/dx = √(4-y²) is", o: ["sin^-1(y/2) = x + C (15%)", "cos^-1(y/2) = x + C (23%)", "y = 2 sin(x+C) (34%)", "y = sin(2x+C) (28%)"], a: 2},
  {q: "Integrating factor of (1-x²)dy/dx - xy = 1 is", o: ["√(1-x²) (15%)", "1/√(1-x²) (23%)", "1/(1-x²) (34%)", "√(x²-1) (28%)"], a: 0},
  {q: "Solution of dy/dx + y/x = x² is", o: ["4xy = x⁴ + C (15%)", "xy = x³/3 + C (23%)", "y = x³/4 + C/x (34%)", "y = x²/3 + C (28%)"], a: 2},
  {q: "Order of the differential equation of all circles of fixed radius 'r' is", o: ["1 (15%)", "2 (23%)", "3 (34%)", "4 (28%)"], a: 1},
  {q: "The differential equation y(dy/dx) + x = C represents", o: ["Family of hyperbolas (15%)", "Family of parabolas (23%)", "Family of circles (34%)", "Family of ellipses (28%)"], a: 2},
  {q: "The general solution of log(dy/dx) = ax + by is", o: ["e^ax/a + e^-by/b = C (15%)", "e^ax/a - e^by/b = C (23%)", "e^ax/a + e^by/b = C (34%)", "None (28%)"], a: 0},
  {q: "The order of the differential equation of all conics whose centre is at the origin is", o: ["2 (15%)", "3 (23%)", "4 (34%)", "5 (28%)"], a: 1},
  {q: "Integrating factor of cos²x (dy/dx) + y = tan x is", o: ["e^tan x (15%)", "tan x (23%)", "e^sec²x (34%)", "e^x (28%)"], a: 0},
  {q: "The solution of x dy - y dx = 0 represents", o: ["Parabola (15%)", "Circle (23%)", "Straight line through origin (34%)", "Rectangular hyperbola (28%)"], a: 2},
  {q: "Which of the following is the general solution of d²y/dx² - y = 0?", o: ["y = Ae^x + Be^-x (15%)", "y = A cos x + B sin x (23%)", "y = Ax + B (34%)", "y = e^x + C (28%)"], a: 0},
  {q: "Order of differential equation dy/dx + y = sin x is", o: ["0 (15%)", "1 (23%)", "2 (34%)", "Not defined (28%)"], a: 1},
  {q: "The general solution of e^x dy + (ye^x + 2x) dx = 0 is", o: ["ye^x + x² = C (15%)", "ye^x - x² = C (23%)", "y + x²e^-x = C (34%)", "None (28%)"], a: 0},
  {q: "The degree of (d³y/dx³) + 2(d²y/dx²)² - dy/dx + y = 0 is", o: ["3 (15%)", "2 (23%)", "1 (34%)", "4 (28%)"], a: 2},
  {q: "General solution of dy/dx = x/y is", o: ["x² - y² = C (15%)", "x² + y² = C (23%)", "y² - x² = C (34%)", "xy = C (28%)"], a: 2},
  {q: "Integrating factor of dy/dx + y/x log x = 1/x is", o: ["x (15%)", "log x (23%)", "log(log x) (34%)", "1/log x (28%)"], a: 1},
  {q: "Differential equation of y = mx is", o: ["dy/dx = y/x (15%)", "dy/dx = x/y (23%)", "dy/dx = m (34%)", "y dy = x dx (28%)"], a: 0},
  {q: "Degree of d²y/dx² + 3(dy/dx)² = x log(d²y/dx²) is", o: ["1 (15%)", "2 (23%)", "3 (34%)", "Not defined (28%)"], a: 3},
  {q: "Integrating factor of dy/dx + (2x/(1+x²))y = 4x²/(1+x²) is", o: ["log(1+x²) (15%)", "e^x (23%)", "1 + x² (34%)", "1/(1+x²) (28%)"], a: 2},
  {q: "The general solution of dy/dx = 1 + x + y + xy is", o: ["log|1+y| = x + x²/2 + C (15%)", "y = e^(x+x²/2) (23%)", "log|1+x| = y + y²/2 + C (34%)", "None (28%)"], a: 0},
  {q: "Number of arbitrary constants in the equation of family of parabolas y² = 4ax is", o: ["0 (15%)", "1 (23%)", "2 (34%)", "3 (28%)"], a: 1},
  {q: "The degree of (dy/dx)⁴ + 3y(d²y/dx²) = 0 is", o: ["4 (15%)", "3 (23%)", "1 (34%)", "2 (28%)"], a: 2},
  {q: "Integrating factor of dy/dx - y = cos x is", o: ["e^x (15%)", "e^-x (23%)", "e^sin x (34%)", "-e^x (28%)"], a: 1}
];

let index = 0;
let score = 0;
let answered = false;

const qText = document.getElementById("questionText");
const optionsBox = document.getElementById("optionsBox");
const nextBtn = document.getElementById("nextBtn");
const progress = document.getElementById("progress");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function loadQuestion(){
  answered = false;
  nextBtn.disabled = true;
  optionsBox.innerHTML = "";

  const q = questions[index];
  qText.textContent = q.q;
  progress.textContent = `Question ${index+1} / 35`;

  q.o.forEach((opt,i)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;

    div.onclick = () => {
      if(answered) return;
      answered = true;

      if(i === q.a){
        div.classList.add("correct");
        correctSound.currentTime = 0;
        correctSound.play();
        score++;
      } else {
        div.classList.add("wrong");
        wrongSound.currentTime = 0;
        wrongSound.play();
        optionsBox.children[q.a].classList.add("correct");
      }
      nextBtn.disabled = false;
    };

    optionsBox.appendChild(div);
  });
}
function goDashboard(){
  window.location.href = "dashboard.html";
}

function nextQuestion(){
  index++;
  if(index < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
}
function retakeTest(){
  index = 0;
  score = 0;
  loadQuestion();

  document.querySelector(".test-box").innerHTML = `
    <div class="header">
      <h2>Dinkar Test</h2>
      <div class="progress" id="progress"></div>
    </div>

    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>

    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
      Next Question
    </button>
  `;

  // Rebind elements
  qText = document.getElementById("questionText");
  optionsBox = document.getElementById("optionsBox");
  nextBtn = document.getElementById("nextBtn");
  progress = document.getElementById("progress");

  loadQuestion();
}

/* ===== RESULT FUNCTION (UPDATED ONLY) ===== */
function showResult(){
  const correct = score;
  const wrong = 35 - score;
  const degree = (correct / 35) * 360;
localStorage.getItem("maths_chapter_8")
  document.querySelector(".test-box").innerHTML = `
    <div class="result-card">
      <h2>Test Completed 🎉</h2>

      <div class="donut" style="--target:${degree}deg"></div>


      <div class="result-score">
        Score: ${correct} / 35
      </div>

      <div class="result-stats">
        <div class="correct-text">✔ Correct: ${correct}</div>
        <div class="wrong-text">✖ Wrong: ${wrong}</div>
      </div>

  
<div class="result-actions">
  <button class="btn secondary" onclick="goDashboard()">Dashboard</button>
  <button class="btn" onclick="location.reload()">Retake</button>
</div>

    </div>
  `;
}


loadQuestion();
</script>

</body>
</html>
